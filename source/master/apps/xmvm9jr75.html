<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0B3B26">
<title>Ophtalmologie L3 — INFAS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style id="app-css">:root{
  --bg:#EEF6F0; --card:#FFFFFF; --ink:#0F2A1C; --soft:#5B7465; --line:#D6E8DC;
  --h1:#0B3B26; --h2:#13693F; --coral:#22A95B; --coral-d:#178A47; --turq:#8BCF3F; --turq-l:#B8F28A;
  --gold:#FFC24B; --plum1:#123D22; --plum2:#2F6B1F; --mint:#D3F2DC; --peach:#FFE3DC;
  --red:#E5484D; --amber:#F5A524; --green:#1FAE6B; --grey:#D5E0DF;
  --hl0:#FFE08A; --hl1:#A8E6CF; --hl2:#FFB3BA;
  --r:22px; --sh:0 6px 22px rgba(11,59,38,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font,'Outfit'),'Outfit',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:calc(16px*var(--gts,1)*var(--ts,1));line-height:1.45;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font-family:inherit;font-size:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select{font-family:inherit;font-size:calc(16px*var(--gts,1)*var(--ts,1))}
.app{max-width:600px;margin:0 auto;min-height:100vh;padding-bottom:120px}
/* header */
.hdr{background:linear-gradient(160deg,var(--hdrA,var(--h1)),var(--hdrB,var(--h2)) 120%);color:var(--hdrInk,#fff);box-shadow:var(--hdrSh,none);padding:18px 20px 22px;border-radius:0 0 30px 30px;position:relative;overflow:hidden}
.hdr:after{content:'';position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,var(--blob,rgba(139,207,63,.35)),transparent 70%)}
.brand{font-weight:900;font-size:calc(44px*var(--gts,1)*var(--ts,1));letter-spacing:-1px;line-height:.95;margin:0}
.brand .b1{background:linear-gradient(90deg,var(--brand1a,#C9F7A6),var(--brand1b,#6EDB8F));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand .b2{background:linear-gradient(90deg,var(--b2a,#FFE08A),var(--b2b,#FFC24B));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{opacity:.9;font-size:calc(15px*var(--gts,1)*var(--ts,1));margin-top:6px}
.sig{font-weight:800;font-size:calc(21px*var(--gts,1)*var(--ts,1));margin-top:10px}
.sig b{color:var(--sigB,var(--gold))}
.where{margin-top:8px;font-weight:700;font-size:calc(15px*var(--gts,1)*var(--ts,1));opacity:.85}
.hdr.mini{padding:14px 16px 16px;display:flex;align-items:center;gap:12px}
.hdr.mini .back{background:var(--coral);color:#fff;font-weight:800;padding:12px 16px;border-radius:16px;white-space:nowrap;font-size:calc(17px*var(--gts,1)*var(--ts,1));flex:0 0 auto;position:relative;z-index:2}
.hdr.mini .tt small{display:block;opacity:.8;font-size:calc(14px*var(--gts,1)*var(--ts,1))}
.hdr.mini .tt div{font-weight:800;font-size:calc(19px*var(--gts,1)*var(--ts,1));line-height:1.15}
.wrap{padding:16px}
.card{border:var(--cardBd,none);background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:18px;margin-bottom:14px}
.card h3{margin:0 0 10px;font-size:calc(20px*var(--gts,1)*var(--ts,1))}
.muted{color:var(--soft)}
.small{font-size:calc(13.5px*var(--gts,1)*var(--ts,1))}
/* home */
.hello{background:linear-gradient(135deg,var(--h2),var(--h3,var(--h2)));color:#fff;display:flex;gap:14px;align-items:center}
.ava{width:76px;height:76px;border-radius:22px;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;font-size:calc(44px*var(--gts,1)*var(--ts,1));flex:0 0 auto}
.hello .nm{font-weight:800;font-size:calc(22px*var(--gts,1)*var(--ts,1))}
.hello .lv{font-weight:700;font-size:calc(14.5px*var(--gts,1)*var(--ts,1));opacity:.95;letter-spacing:.3px}
.bar{height:10px;border-radius:10px;background:rgba(255,255,255,.18);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--gold);border-radius:10px}
.boss{background:linear-gradient(135deg,var(--plum1),var(--plum2));color:#fff;display:flex;gap:14px;align-items:center;border:3px solid #FFC24B;cursor:pointer}
.boss .be{font-size:calc(52px*var(--gts,1)*var(--ts,1))}
.boss .bt{font-size:calc(14px*var(--gts,1)*var(--ts,1));opacity:.85}
.boss .bn{font-weight:800;font-size:calc(21px*var(--gts,1)*var(--ts,1));line-height:1.15;margin:3px 0}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:16px;border-radius:20px;font-weight:800;font-size:calc(18px*var(--gts,1)*var(--ts,1));background:var(--h1);color:#fff;margin-bottom:12px;box-shadow:var(--sh)}
.btn.coral{background:var(--coral)}
.btn.turq{background:var(--turq)}
.btn.light{background:var(--tint);color:var(--h1);box-shadow:none}
.btn.ghost{background:transparent;border:2px solid var(--line);color:var(--ink);box-shadow:none}
.btn:disabled{opacity:.45}
.search{display:flex;align-items:center;gap:8px;border:2px solid var(--line);border-radius:18px;padding:12px 14px;background:#fff}
.search input{border:0;outline:0;flex:1;min-width:0;background:transparent}
.launch{background:linear-gradient(120deg,var(--coral),var(--turq));color:var(--launchInk,#0B2A17);display:flex;align-items:center;gap:16px;padding:22px;cursor:pointer}
.launch .t{font-weight:900;font-size:calc(30px*var(--gts,1)*var(--ts,1));line-height:1}
.launch .s{font-weight:600;font-size:calc(17px*var(--gts,1)*var(--ts,1));margin-top:4px}
.prog .row{display:flex;align-items:center;gap:8px;margin:12px 0 8px;font-weight:700}
.tag{background:var(--h1);color:var(--gold);font-weight:900;border-radius:12px;padding:3px 9px;font-size:calc(14px*var(--gts,1)*var(--ts,1))}
.segs{display:flex;gap:4px}
.segs span{flex:1;height:22px;border-radius:7px;background:var(--grey);cursor:pointer}
.c-red{background:var(--red)!important}.c-amber{background:var(--amber)!important}.c-green{background:var(--green)!important}
.grid{display:grid;grid-template-columns:repeat(var(--cols,2),minmax(0,1fr));gap:12px}
.tile{border:var(--cardBd,none);background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:18px 16px;min-height:112px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;position:relative;overflow:hidden}
.tile .e{font-size:calc(38px*var(--gts,1)*var(--ts,1));line-height:1}
.tile .l{font-weight:800;font-size:calc(17.5px*var(--gts,1)*var(--ts,1));line-height:1.15;margin-top:10px}
.tile .n{font-size:calc(12.5px*var(--gts,1)*var(--ts,1));color:var(--soft);margin-top:2px}
.tile:before{content:'';position:absolute;right:-20px;bottom:-20px;width:70px;height:70px;border-radius:50%;background:var(--tc,#E4F4F2);opacity:.8}
.tile>*{position:relative}
/* nav */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:max(10px,env(safe-area-inset-bottom));width:min(576px,calc(100% - 20px));background:var(--navBg,var(--h1));border:var(--cardBd,none);border-radius:30px;display:flex;justify-content:space-around;padding:8px 6px;z-index:50;box-shadow:0 10px 30px rgba(11,59,38,.35)}
.nav button{display:flex;flex-direction:column;align-items:center;color:var(--navInk,#cfe3e1);font-weight:700;font-size:calc(13px*var(--gts,1)*var(--ts,1));gap:2px;padding:4px 2px;flex:1}
.nav button .i{font-size:calc(24px*var(--gts,1)*var(--ts,1));color:initial;width:54px;height:40px;border-radius:20px;display:flex;align-items:center;justify-content:center}
.nav button.on{color:var(--navOn,#fff)}
.nav button.on .i{background:var(--coral)}
/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;font-weight:700;font-size:calc(14px*var(--gts,1)*var(--ts,1));cursor:pointer;user-select:none}
.chip.on{background:var(--h1);color:#fff;border-color:var(--h1)}
.chip.on.co{background:var(--coral);border-color:var(--coral)}
.lbl2{font-weight:800;margin:14px 0 8px;font-size:calc(15px*var(--gts,1)*var(--ts,1))}
/* chapter list */
.chl{border:var(--cardBd,none);display:flex;align-items:center;gap:12px;padding:14px;border-radius:18px;background:#fff;box-shadow:var(--sh);margin-bottom:10px;cursor:pointer}
.chl .em{font-size:calc(28px*var(--gts,1)*var(--ts,1));width:48px;height:48px;border-radius:15px;background:var(--mint);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.chl .tx{flex:1;min-width:0}
.chl .tx b{display:block;font-size:calc(16px*var(--gts,1)*var(--ts,1));line-height:1.2}
.chl .tx small{color:var(--soft)}
.ring{width:46px;height:46px;flex:0 0 auto}
.secT{font-weight:900;font-size:calc(22px*var(--gts,1)*var(--ts,1));margin:18px 0 10px;display:flex;align-items:center;gap:8px}
/* quiz */
.qtop{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:calc(14px*var(--gts,1)*var(--ts,1));color:var(--soft);margin-bottom:8px}
.pbar{height:9px;background:var(--tint);border-radius:9px;overflow:hidden;margin-bottom:14px}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--turq),var(--coral));transition:width .3s}
.qtype{display:inline-block;font-size:calc(12.5px*var(--gts,1)*var(--ts,1));font-weight:800;padding:4px 10px;border-radius:10px;background:var(--mint);color:var(--h2);margin-bottom:8px;text-transform:uppercase;letter-spacing:.4px}
.qtype.cas{background:#EDE4FF;color:#5B3BC4}.qtype.vf{background:#FFF1CC;color:#9A6400}.qtype.qcd{background:var(--peach);color:#B4402E}.qtype.saisie{background:#E2EEFF;color:#2457A8}.qtype.img{background:#FFE2F1;color:#A3246B}.qtype.ouv{background:#E6F4EA;color:#1E6B3A}.formbox{font-family:ui-monospace,Menlo,monospace;background:var(--tint,#eef);border-radius:10px;padding:10px 12px;margin:8px 0;font-size:14px;white-space:pre-wrap}.model{background:#F3FAF5;border-left:4px solid var(--green);border-radius:10px;padding:10px 12px;margin-top:8px;color:#1d2433}.model ul,.model ol{margin:4px 0;padding-left:20px}table.tb{border-collapse:collapse;width:100%;font-size:13px}table.tb th,table.tb td{border:1px solid var(--line,#ddd);padding:6px;vertical-align:top;text-align:left}.pnote textarea{min-height:70px;margin-top:6px}@media print{#nav,.tabs,.btn{display:none!important}}
.scen{background:#F5F0FF;border-left:5px solid #7C5CFF;padding:12px 14px;border-radius:12px;margin-bottom:10px;font-size:calc(15.5px*var(--gts,1)*var(--ts,1))}
.qq{font-weight:700;font-size:calc(19px*var(--gts,1)*var(--ts,1));line-height:1.35;margin-bottom:14px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:14px;border:2px solid var(--line);border-radius:16px;margin-bottom:10px;background:#fff;font-size:calc(16px*var(--gts,1)*var(--ts,1));font-weight:500}
.opt .k{flex:0 0 30px;height:30px;border-radius:10px;background:var(--tint2);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:calc(14px*var(--gts,1)*var(--ts,1))}
.opt.sel{border-color:var(--h2);background:var(--tint3)}
.opt.sel .k{background:var(--h2);color:#fff}
.opt.ok{border-color:var(--green);background:#E6F7EE}.opt.ok .k{background:var(--green);color:#fff}
.opt.ko{border-color:var(--red);background:#FDECEC}.opt.ko .k{background:var(--red);color:#fff}
.opt.miss{border-color:var(--green);border-style:dashed}
.vfrow{display:flex;gap:10px}
.vfrow .opt{justify-content:center;font-weight:800;font-size:calc(18px*var(--gts,1)*var(--ts,1))}
.tin{width:100%;padding:14px;border:2px solid var(--line);border-radius:16px;outline:0}
.tin:focus{border-color:var(--h2)}
.fb{border-radius:18px;padding:14px 16px;margin:12px 0;font-size:calc(15.5px*var(--gts,1)*var(--ts,1))}
.fb.good{background:#E6F7EE;border:2px solid #A6E3C3}.fb.bad{background:#FDECEC;border:2px solid #F5B5B5}
.fb .h{font-weight:900;font-size:calc(18px*var(--gts,1)*var(--ts,1));margin-bottom:4px}
.fb .src{margin-top:8px;font-size:calc(14px*var(--gts,1)*var(--ts,1));color:#3d5558;background:rgba(255,255,255,.7);border-radius:10px;padding:8px 10px;font-style:italic}
.linkbtn{display:inline-flex;align-items:center;gap:6px;font-weight:800;color:var(--h2);background:var(--tint);border-radius:12px;padding:8px 12px;margin-top:10px;font-size:calc(14px*var(--gts,1)*var(--ts,1))}
.qimg{width:100%;border-radius:14px;background:#fff;border:1px solid var(--line);margin:6px 0 12px;cursor:zoom-in}
.qimgcap{font-size:calc(13px*var(--gts,1)*var(--ts,1));color:var(--soft);margin-top:-6px;margin-bottom:10px}
/* course */
.pg{border:var(--cardBd,none);background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:18px 18px 10px;margin-bottom:14px;position:relative}
.pgh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.pbadge{font-weight:800;font-size:calc(13px*var(--gts,1)*var(--ts,1));color:var(--h2);background:var(--mint);padding:3px 10px;border-radius:10px}
.pgc{font-size:calc(17px*var(--gts,1)*var(--ts,1));line-height:1.6}
.pgc h4{color:#1F7FA0;color:var(--h2);font-size:calc(18px*var(--gts,1)*var(--ts,1));margin:12px 0 6px}
.pgc p{margin:6px 0}
.pgc ul{margin:6px 0;padding-left:22px}
.pgc li{margin:3px 0}
.pgc .lbl{font-size:calc(14px*var(--gts,1)*var(--ts,1));color:var(--soft)}
.pgc img{width:100%;border-radius:12px;margin:8px 0;cursor:zoom-in}
.pgc .cap{font-size:calc(13.5px*var(--gts,1)*var(--ts,1));color:var(--soft);text-align:center;margin-top:-4px}
mark.hl{border-radius:4px;padding:0 1px;color:inherit}
mark.h0{background:var(--hl0)}mark.h1{background:var(--hl1)}mark.h2{background:var(--hl2)}
.annot{display:flex;align-items:center;gap:12px;margin:10px 0 6px}
.annot button{background:var(--tint);border-radius:16px;padding:12px 16px;font-weight:800}
.annot button.on{background:var(--h1);color:#fff}
.palette{position:fixed;z-index:80;background:var(--h1);border-radius:18px;padding:8px;display:none;gap:8px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.palette button{width:44px;height:44px;border-radius:12px;border:3px solid #fff}
.palette .er{background:#fff;font-size:calc(20px*var(--gts,1)*var(--ts,1));border-color:#fff}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:8px 0;border-radius:14px;border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:calc(14.5px*var(--gts,1)*var(--ts,1));min-width:420px}
th{background:var(--h1);color:#fff;text-align:left;padding:9px 10px;font-weight:700}
td{padding:9px 10px;border-top:1px solid var(--line);vertical-align:top}
tr:nth-child(even) td{background:var(--tint2)}
td:first-child{font-weight:700}
.tabs{display:flex;gap:6px;background:var(--tint);padding:5px;border-radius:18px;margin-bottom:12px;overflow-x:auto}
.tabs button{flex:1;padding:10px 10px;border-radius:14px;font-weight:800;font-size:calc(14px*var(--gts,1)*var(--ts,1));white-space:nowrap}
.tabs button.on{background:#fff;box-shadow:var(--sh);color:var(--h1)}
.res li{margin:6px 0}
.res ul{padding-left:20px;margin:6px 0}
.rh{display:flex;align-items:center;gap:8px;font-weight:800;font-size:calc(17px*var(--gts,1)*var(--ts,1));margin-bottom:6px}
.pill{font-size:calc(12px*var(--gts,1)*var(--ts,1));font-weight:800;padding:3px 8px;border-radius:9px;background:var(--mint);color:var(--h2)}
.pill.a{background:var(--peach);color:#B4402E}
/* gallery */
.gal{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gi{border:var(--cardBd,none);background:#fff;border-radius:16px;box-shadow:var(--sh);overflow:hidden;cursor:pointer}
.gi .th{height:120px;background:#fff center/contain no-repeat;border-bottom:1px solid var(--line)}
.gi .c{padding:8px 10px;font-size:calc(13px*var(--gts,1)*var(--ts,1));font-weight:600;line-height:1.25}
.lb{position:fixed;inset:0;background:rgba(6,22,25,.94);z-index:100;display:none;flex-direction:column;justify-content:center;padding:16px}
.lb.on{display:flex}
.lb img{max-width:100%;max-height:70vh;object-fit:contain;background:#fff;border-radius:12px;align-self:center}
.lb .cap{color:#fff;text-align:center;margin:12px 0;font-weight:600}
.lb .ctr{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.lb .ctr button{background:#fff;color:var(--h1);font-weight:800;padding:10px 16px;border-radius:14px}
/* flash */
.fc{perspective:1200px;margin-bottom:14px}
.fci{position:relative;min-height:300px;transition:transform .5s;transform-style:preserve-3d;cursor:pointer}
.fci.flip{transform:rotateY(180deg)}
.fcf,.fcb{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:26px;padding:22px;display:flex;flex-direction:column;justify-content:center;box-shadow:var(--sh)}
.fcf{background:linear-gradient(150deg,#fff,var(--tint3))}
.fcb{background:linear-gradient(150deg,var(--h1),var(--h2));color:#fff;transform:rotateY(180deg);overflow:auto}
.fcf .q{font-weight:800;font-size:calc(20px*var(--gts,1)*var(--ts,1))}
.fcb .a{font-weight:800;font-size:calc(19px*var(--gts,1)*var(--ts,1));color:var(--gold)}
.boxes{display:flex;gap:6px;margin:10px 0}
.boxes div{flex:1;background:#fff;border-radius:12px;padding:8px 4px;text-align:center;font-weight:800;font-size:calc(13px*var(--gts,1)*var(--ts,1));box-shadow:var(--sh)}
.boxes div b{display:block;font-size:calc(20px*var(--gts,1)*var(--ts,1));color:var(--h2)}
/* stats */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{border:var(--cardBd,none);background:#fff;border-radius:18px;padding:14px;box-shadow:var(--sh)}
.kpi b{display:block;font-size:calc(26px*var(--gts,1)*var(--ts,1));font-weight:900;color:var(--h2)}
.kpi span{font-size:calc(13.5px*var(--gts,1)*var(--ts,1));color:var(--soft);font-weight:600}
.sbar{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:calc(14px*var(--gts,1)*var(--ts,1))}
.sbar .nmx{flex:0 0 42%;font-weight:700;line-height:1.15}
.sbar .tr{flex:1;height:12px;background:var(--tint2);border-radius:12px;overflow:hidden}
.sbar .tr i{display:block;height:100%;border-radius:12px}
.sbar .pc{flex:0 0 40px;text-align:right;font-weight:800}
/* profile */
.avgrid{display:flex;flex-wrap:wrap;gap:10px;padding:8px 0}
.avgrid button{width:56px;height:56px;border-radius:50%;background:var(--tint);font-size:calc(30px*var(--gts,1)*var(--ts,1));display:flex;align-items:center;justify-content:center}
.avgrid button.on{background:var(--h1);box-shadow:0 0 0 3px var(--coral)}
.avgrid button.lock{filter:grayscale(1);opacity:.35}
details.cat{border-top:1px solid var(--line);padding:12px 0}
details.cat summary{font-weight:800;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
details.cat summary:after{content:'▾';color:var(--soft)}
.badges{display:flex;flex-wrap:wrap;gap:8px}
.badge{padding:8px 12px;border-radius:999px;background:var(--tint2);font-weight:700;font-size:calc(14px*var(--gts,1)*var(--ts,1));opacity:.38}
.badge.on{opacity:1;background:var(--mint)}
.hlrow{display:flex;align-items:center;gap:10px;margin:8px 0}
.hlrow input[type=color]{width:46px;height:38px;border:0;border-radius:10px;padding:0;background:none}

<script type="application/json" id="app-data">{"meta":{"appId":"ophtalmoL3","title":"Ophtalmologie L3 — INFAS","brand":["OPHTALMO","LOGIE"],"subtitle":"Licence 3 · Infirmier(e) · Unité pédagogique de médecine · 2025-2026","signature":"Créé par <b>Daniel Noufe<\/b> · INFAS","defaultPalette":1,"palettes":null,"exam":{"n":40,"min":40}},"parts":[{"id":"B","name":"Bases de l'œil","tag":"BASES","emo":"👁️"},{"id":"P","name":"Pathologies courantes","tag":"ADULTE","emo":"🩺"},{"id":"E","name":"Pathologies de l'enfant","tag":"ENFANT","emo":"🍼"},{"id":"N","name":"Pathologies négligées","tag":"MTN","emo":"🪰"},{"id":"T","name":"Traumatismes & médicaments","tag":"URGENCE","emo":"🚑"}],"sources":[{"id":"O","name":"Ophtalmologie L3 (INFAS 2025-2026)"}],"chapters":[{"id":"A1","part":"B","title":"Anatomie de l'œil","short":"Anatomie","pages":[2,7],"emo":"🧠"},{"id":"A2","part":"B","title":"Examen de l'acuité visuelle","short":"Acuité","pages":[8,11],"emo":"🔤"},{"id":"P1","part":"P","title":"Les amétropies","short":"Amétropies","pages":[12,15],"emo":"👓"},{"id":"P2","part":"P","title":"Les conjonctivites","short":"Conjonctivites","pages":[16,19],"emo":"🔴"},{"id":"P3","part":"P","title":"La cataracte sénile","short":"Cataracte","pages":[20,22],"emo":"🌫️"},{"id":"P4","part":"P","title":"Glaucome chronique à angle ouvert","short":"GCAO","pages":[23,24],"emo":"🕳️"},{"id":"P5","part":"P","title":"Glaucome aigu","short":"Glaucome aigu","pages":[25,26],"emo":"🚨"},{"id":"P6","part":"P","title":"Chalazion et orgelet","short":"Paupières","pages":[27,29],"emo":"🫧"},{"id":"E1","part":"E","title":"Conjonctivites du nouveau-né","short":"Ophtalmie NN","pages":[30,32],"emo":"👶"},{"id":"E2","part":"E","title":"Limbo-conjonctivite","short":"LCET","pages":[33,33],"emo":"🌴"},{"id":"E3","part":"E","title":"Cataracte congénitale","short":"Cat. congénitale","pages":[34,36],"emo":"⚪"},{"id":"E4","part":"E","title":"Le rétinoblastome","short":"Rétinoblastome","pages":[37,39],"emo":"🎗️"},{"id":"E5","part":"E","title":"Glaucome congénital","short":"Gl. congénital","pages":[40,40],"emo":"🔵"},{"id":"N1","part":"N","title":"Onchocercose","short":"Onchocercose","pages":[41,47],"emo":"🪰"},{"id":"N2","part":"N","title":"Trachome","short":"Trachome","pages":[48,52],"emo":"🧫"},{"id":"T1","part":"T","title":"Les traumatismes oculaires","short":"Traumatismes","pages":[53,57],"emo":"🤕"},{"id":"M1","part":"T","title":"Médicaments ophtalmiques","short":"Médicaments","pages":[58,61],"emo":"💧"}],"course":[{"ch":"A1","src":"O","page":2,"html":"<h4>Introduction<\/h4>\n<p>L'ophtalmologie est une discipline médico-chirurgicale dont l'étude se focalise sur le fonctionnement de l'œil et ses manifestations pathologiques. Les spécialistes de cette discipline sont appelés ophtalmologues. Ils ont pour mission la prise en charge de la santé oculaire des populations. Cette catégorie de personnel se retrouve majoritairement dans les échelons secondaire et tertiaire de notre système de santé. Or la prévalence des affections oculaires est beaucoup plus importante dans les milieux défavorisés et les zones rurales où il n'y a pas de spécialistes en ophtalmologie.<\/p>\n<p>En votre qualité de personnel de premier contact, vous serez régulièrement confrontés à des situations de prise en charge d'affections oculaires, en l'absence de spécialiste d'ophtalmologie dans votre aire sanitaire. Il peut s'agir d'une rougeur oculaire, un trouble visuel, une douleur ou plus grave, un traumatisme oculaire.<\/p>\n<p>Ce cours ambitionne de vous donner des connaissances pour appréhender le fonctionnement de l'œil et assurer des prestations de soins préventifs et curatifs relevant de votre compétence.<\/p>\n<p>Ce document n'est pas exhaustif. Néanmoins, il aborde le rappel anatomique du globe oculaire, l'examen de la réfraction, quelques pathologies oculaires de l'adulte et de l'enfant sans oublier les traumatismes oculaires et les thérapeutiques.<\/p>\n<p>Des objectifs d'apprentissage sont énoncés au début de chaque cours et feront l'objet d'évaluation. Des exercices d'application seront faits à la fin du cours.<\/p>","imgs":[]},{"ch":"A1","src":"O","page":3,"html":"<h4>Chapitre I : Anatomie de l'œil<\/h4>\n<p><b>Objectifs<\/b> — A la fin de ce cours, l'étudiant(e) doit être capable en situation d'examen de :<\/p>\n<ul><li>Décrire l'anatomie du globe oculaire<\/li><li>Citer les éléments de l'enveloppe du globe oculaire<\/li><li>Citer les éléments du contenu du globe oculaire<\/li><li>Décrire le rôle du cristallin<\/li><li>Citer les annexes du globe oculaire<\/li><\/ul>\n<h4>1. Le globe oculaire<\/h4>\n<p>Le globe oculaire est un organe qui a la forme d'une sphère. Son diamètre antéro-postérieur est d'environ 23 à 25 mm. Il pèse environ 7g avec un volume de 6,5 cm3 chez l'adulte. Schématiquement, le globe oculaire est constitué d'une coque et des milieux transparents :<\/p>\n<ul><li>La coque est appelée l'enveloppe ou le contenant.<\/li><li>Les milieux transparents sont appelés le contenu.<\/li><\/ul>\n<p><i>Figure 1 : coupe du globe oculaire<\/i><\/p>","imgs":["O_p003_0"]},{"ch":"A1","src":"O","page":4,"html":"<h4>1.1 Enveloppe du globe oculaire ou Contenant<\/h4>\n<p>L'enveloppe ou le contenant est composé de trois membranes qui sont de l'extérieur vers l'intérieur :<\/p>\n<p><b>a) La sclère ou la sclérotique<\/b><\/p>\n<p>C'est la membrane (tunique) la plus externe recouvrant 4/5 postérieur du globe oculaire. Elle comprend deux (02) parties :<\/p>\n<ul><li>La partie postérieure qui est fibreuse, épaisse, résistante, opaque aux rayons lumineux. C'est elle qui confère au globe oculaire sa couleur blanche.<\/li><\/ul>\n<p>Son rôle est de : protéger les structures intraoculaires ; résister aux forces expansives générées par pression intraoculaire ; limiter la forme et la taille de l'œil au cours de son développement.<\/p>\n<p>C'est grâce à cette membrane que se fait l'insertion des muscles oculomoteurs sur le globe oculaire.<\/p>\n<ul><li>La partie antérieure transparente est appelée la cornée. En fait, cette cornée est une membrane fibreuse enchâssée comme un verre de montre dans l'ouverture antérieure de la sclère. La zone de jonction de la cornée et la sclère est appelée le Limbe scléro-cornéen.<\/li><\/ul>\n<p>Au plan Histologique, la cornée est formée d'avant en arrière par trois couches de cellules et deux membranes : l'épithélium ; la membrane de Bowman ; le stroma ; la membrane de Descemet ; l'endothélium.<\/p>\n<p><b>b) L'uvée<\/b><\/p>\n<p>C'est une membrane vasculaire composée de trois parties :<\/p>\n<ul><li>la partie postérieure de l'uvée qui tapisse la sclère est appelée choroïde.<\/li><li>la partie moyenne renflée forme le corps ciliaire<\/li><li>la partie antérieure forme l'iris qui est perforé en son centre d'un orifice appelé la pupille.<\/li><\/ul>","imgs":[]},{"ch":"A1","src":"O","page":5,"html":"<p><b>c) La rétine<\/b><\/p>\n<p>C'est la membrane la plus interne. Elle est la membrane neurosensorielle de la vision. Elle reçoit les informations lumineuses et les transmet au cerveau par l'intermédiaire des fibres optiques regroupées au sein du nerf optique.<\/p>\n<p>Sur la rétine, on distingue des zones particulières. Il s'agit de :<\/p>\n<ul><li>La papille ou tache aveugle qui est le point de départ du nerf optique. C'est le lieu de rassemblement de toutes les fibres nerveuses conductrices d'information<\/li>\n<li>La macula, encore appelée fovéa. C'est une petite dépression de la rétine située dans l'axe visuel qui reçoit la plus grande quantité de rayons lumineux. Elle permet la vision précise, discriminative ainsi que la vision des couleurs.<\/li><\/ul>\n<h4>1.2 Le Contenu du globe oculaire<\/h4>\n<p>Il est composé de trois milieux transparents qui sont : l'humeur aqueuse, le cristallin et le vitré.<\/p>\n<p><b>a) L'humeur aqueuse<\/b><\/p>\n<p>C'est un liquide incolore, aqueux, secrété par les procès ciliaires et qui remplit l'espace compris entre la cornée et le cristallin. Cet espace est subdivisé en deux chambres :<\/p>\n<ul><li>la chambre antérieure située entre la cornée et l'iris<\/li><li>la chambre postérieure située entre l'iris et le cristallin.<\/li><\/ul>\n<p>Les deux chambres communiquent entre elles à travers la pupille.<\/p>\n<p><b>b) Le Cristallin<\/b><\/p>\n<p>C'est une lentille biconvexe, transparente et avasculaire située entre l'iris en avant et le vitré en arrière.<\/p>\n<p>Le cristallin est suspendu au corps ciliaire par des ligaments suspenseurs appelés la zonule de ZINN. Il joue un rôle important dans le système optique de l'œil. Car du fait de sa transparence, il permet le passage de la lumière. Le cristallin est élastique. Sous l'action du muscle ciliaire, ses courbures se modifient. Ses possibilités de déformation lui permettent d'assurer l'accommodation, c'est-à-dire l'adaptation de la vision aux différentes distances. Cette élasticité diminue avec l'âge.<\/p>","imgs":[]},{"ch":"A1","src":"O","page":6,"html":"<p><b>c) Le vitré<\/b><\/p>\n<p>C'est un liquide visqueux (substance gélatineuse), transparent qui comble l'espace compris entre la rétine et la face postérieure du cristallin. Le vitré assure au globe oculaire sa tonicité.<\/p>\n<h4>1.3 Les annexes du globe oculaire<\/h4>\n<p><b>1.3.1 Les paupières<\/b><\/p>\n<p>Elles sont au nombre de deux par œil (paupière inférieure et paupière supérieure).<\/p>\n<p>Chaque paupière est formée par une charpente cartilagineuse : le tarse. Des rangées de cils sont implantées sur le bord des paupières pour empêcher l'entrée de certains corps étrangers (particules de poussières) dans l'œil.<\/p>\n<p>La motilité des paupières est régie par deux (02) groupes de muscles antagonistes. Nous avons :<\/p>\n<ul><li>le muscle releveur de la paupière qui commande l'ouverture de la fente palpébrale.<\/li><li>le muscle orbiculaire qui commande la fermeture de la paupière.<\/li><\/ul>\n<p><b>1.3.2 La conjonctive<\/b><\/p>\n<p>C'est une membrane muqueuse qui recouvre la face profonde des paupières : on parle de conjonctive palpébrale.<\/p>\n<p>Elle recouvre également la face antérieure de la sclérotique : on l'appelle alors la conjonctive bulbaire.<\/p>\n<p>La jonction entre les conjonctives bulbaires et palpébrales délimite les culs-de-sacs conjonctivaux ou fornix.<\/p>\n<p><b>1.3.3 L'appareil lacrymal<\/b><\/p>\n<p>Il est composé de :<\/p>\n<ul><li>des glandes lacrymales qui sécrètent les larmes afin de mouiller la cornée en permanence.<\/li>\n<li>des voies lacrymales qui servent de canaux d'évacuation. Elles commencent à l'angle interne des paupières par des points lacrymaux. Les sécrétions lacrymales passent par les canalicules lacrymaux avant de se déverser dans le canal lacrymo-nasal.<\/li><\/ul>","imgs":[]},{"ch":"A1","src":"O","page":7,"html":"<p><i>L'appareil lacrymal et la circulation du liquide lacrymal<\/i><\/p>\n<p><b>1.3.4 Les muscles oculomoteurs<\/b><\/p>\n<p>La motilité du globe oculaire est assurée par les muscles oculomoteurs. Ils sont au nombre de six(06) par œil dont :<\/p>\n<ul><li>4 muscles droits : droit supérieur ; le droit inférieur ; le droit externe (droit latéral) et le droit interne (droit médiane)<\/li>\n<li>2 muscles obliques : le petit oblique ou oblique inférieur et le grand oblique ou oblique supérieur.<\/li><\/ul>\n<p><i>Insertion des muscles sur le globe oculaire<\/i><\/p>","imgs":["O_p007_0","O_p007_1"]},{"ch":"A2","src":"O","page":8,"html":"<h4>Chapitre II : Examen de l'acuité visuelle<\/h4>\n<p><b>Objectifs<\/b> — Définir l'acuité visuelle ; Décrire les différents types d'optotypes (échelles optométriques) ; Mesurer l'acuité visuelle d'un patient ; Noter les résultats d'une acuité visuelle de loin et de près dans un carnet médical.<\/p>\n<h4>I- Définition<\/h4>\n<p>L'AV est la faculté que possède l'œil de percevoir les détails des formes et des couleurs. D'une façon précise, c'est la faculté que possède l'œil de percevoir distinctement deux points séparés de 3 mm à une distance de 5 mètres.<\/p>\n<p>L'AV permet de mesurer la finesse des détails qu'un œil est capable de distinguer dans une image. Elle se mesure de loin et de près. C'est un examen essentiel en ophtalmologie. C'est un moyen d'exploration efficace pour dépister une anomalie de la vision ou une pathologie oculaire.<\/p>\n<h4>II- Indications<\/h4>\n<p>La mesure de l'AV doit être systématique chez toute personne se présentant en consultation d'ophtalmologie en particulier lors de :<\/p>\n<ul><li>des troubles visuels<\/li><li>des traumatismes oculaires<\/li><li>l'examen du fond d'œil<\/li><li>la visite médicale d'embauche dans certaines fonctions (pilote, conduite automobile, etc...)<\/li><\/ul>\n<p>L'AV peut servir à déterminer par exemple l'incapacité totale ou partielle des victimes d'accident de la route ou de travail, en vue de constituer un dossier médico-légal (demandé par les légistes ou les assurances).<\/p>","imgs":[]},{"ch":"A2","src":"O","page":9,"html":"<h4>III- Matériel<\/h4>\n<p>Il existe plusieurs types d'échelles optométriques. Les échelles optométriques les plus utilisées sont :<\/p>\n<ul><li>L'échelle de MONOYER comportant l'alphabet réservé aux personnes adultes lettrées. C'est le test type. Il est gradué en dixièmes.<\/li>\n<li>L'échelle de SNELLEN : il comporte des lettres « E » orientées dans différentes directions. Il est utilisé généralement pour les adultes analphabètes (illettrés).<\/li>\n<li>L'échelle de l'anneau brisé de LANDÖLT : utilisé également pour les adultes illettrés<\/li>\n<li>L'échelle de ROSSANO et WEISS comportant des images d'objets ou d'animaux. Ce test est utilisé pour les enfants.<\/li>\n<li>L'échelle de Mme PIGASSOU comportant également des images d'objets ou d'animaux.<\/li><\/ul>\n<p><i>L'échelle de SNELLEN — L'échelle de MONOYER — Echelle de Pigassou<\/i><\/p>\n<h4>IV- Technique de réalisation<\/h4>\n<p>La mesure de l'AV se fait de préférence dans une salle peu éclairée :<\/p>","imgs":["O_p009_0"]},{"ch":"A2","src":"O","page":10,"html":"<p><b>1. AV de loin<\/b><\/p>\n<p>Les échelles comportent au moins dix lignes d'alphabet ou de symboles de tailles différentes.<\/p>\n<p>La lecture se fait des gros caractères vers les plus petits.<\/p>\n<p>Le sujet est placé à 5m s'il s'agit d'un adulte et à 2,5m s'il s'agit d'un enfant. La lecture se fait œil par œil. On commence par l'œil droit, l'œil gauche étant masqué par une palette ou un disque plein. Le résultat de l'AV correspond à la valeur de l'échelle dont les caractères ou les symboles ont été effectivement lus. Exemple : 1/10e 2/10e ou 10/10e<\/p>\n<p><b>2. Acuité visuelle de près<\/b><\/p>\n<p>Après la mesure de l'acuité visuelle de loin (AVL), on éclaire la salle ou le test de lecture et on procède à la mesure de l'AV de près. On utilise l'échelle de PARINAUD. Cette échelle comporte des paragraphes de caractères différents. Il existe également des PARINAUD avec des « E » ou des dessins d'animaux ou d'objets pour les analphabètes.<\/p>\n<p>L'échelle est tenue par le patient à environ 33cm de ses yeux et, il lit le texte paragraphe par paragraphe.<\/p>\n<p>Le dernier paragraphe lu, constitue son AV. on note par Exemple : P3, P2 ou P1.<\/p>\n<p><i>Echelle de Parinaud<\/i><\/p>","imgs":["O_p010_0"]},{"ch":"A2","src":"O","page":11,"html":"<h4>V- Notation des résultats de l'acuité visuelle<\/h4>\n<p>La mesure de l'AV de loin se fait sans correction c'est-à-dire sans verres de lunettes. On note sur le carnet ou sur la fiche du patient :<\/p>\n<p><b>Acuité Visuelle de loin sans correction :<\/b><\/p>\n<p>AVL SC | OD = 5/10e ; OG = 3/10e — P4<\/p>\n<p>Lorsque le sujet est porteur de verres correcteurs, l'AV se fait d'abord sans ses verres. Ensuite, il porte ses verres correcteurs pour lire et on note :<\/p>\n<p><b>Acuité visuelle de loin avec correction :<\/b><\/p>\n<p>AVL AC | OD = 10/10e ; OG = 10/10e — P2<\/p>","imgs":[]},{"ch":"P1","src":"O","page":12,"html":"<h4>Chapitre III : Pathologies oculaires courantes — Les amétropies<\/h4>\n<p><b>Objectifs<\/b> — Citer les différents types d'amétropie ; Citer les signes cliniques de la myopie simple ; Citer les signes cliniques de l'hypermétropie de l'enfant ; Enoncer les éléments du traitement de chaque amétropie.<\/p>\n<h4>Introduction<\/h4>\n<p>Les amétropies désignent l'ensemble des troubles (vices ou défauts) de la réfraction oculaire dûs à une mauvaise mise au point de l'image sur la rétine. On distingue : la myopie, l'hypermétropie et l'astigmatisme. A ces amétropies, on pourrait ajouter la presbytie qui est un trouble de la vision lié au vieillissement c'est-à-dire à l'âge.<\/p>\n<h4>Myopie — I- Définition<\/h4>\n<p>La myopie est une amétropie au cours de laquelle l'image se forme en avant de la rétine. C'est un trouble de la réfraction de l'œil tel que sa puissance est trop forte pour sa longueur. Ainsi, on corrige le myope avec des verres sphériques concaves ou divergents pour lui permettre de voir nettement. Ce sont les verres précédés du signe moins(-).<\/p>","imgs":[]},{"ch":"P1","src":"O","page":13,"html":"<h4>II- Formes cliniques de la myopie<\/h4>\n<p>Il existe deux grandes formes cliniques de myopie.<\/p>\n<p><b>2.1 La myopie simple, bénigne<\/b><\/p>\n<p>Elle débute à l'âge scolaire entre 6 et 10 ans. La vision de près est normale et facile mais l'enfant se plaint de voir mal au loin ainsi qu'au tableau et à la télévision où il a tendance à s'approcher pour mieux voir. Il se plaint également de céphalées après effort de plissement des yeux (il diminue les fentes palpébrales pour mieux voir).<\/p>\n<p>La myopie simple a tendance à augmenter progressivement. Cette augmentation se fait par poussées correspondant aux poussées de croissance vers l'âge de 16 à 18 ans. Puis, la myopie se stabilise et la correction reste identique jusqu'à la presbytie.<\/p>\n<p><b>2.2 La myopie forte<\/b><\/p>\n<p>Elle débute entre 2 et 3 ans. Cette forme de myopie est liée à des facteurs héréditaires. L'acuité visuelle de loin est très perturbée ; parfois elle n'est pas chiffrable et se limite à une perception lumineuse.<\/p>\n<h4>Hypermétropie — I- Définition<\/h4>\n<p>L'hypermétropie est un trouble de la réfraction dans laquelle l'image vient se former en arrière du plan de la rétine. L'hypermétrope est obligé d'accommoder constamment pour voir net quel que soit la distance de l'objet fixé. On corrige les hypermétropes avec des verres sphériques convergents ou convexes (verres +) pour lui permettre de voir nettement.<\/p>","imgs":["O_p013_0"]},{"ch":"P1","src":"O","page":14,"html":"<h4>II- Formes cliniques de l'hypermétropie<\/h4>\n<p>Il existe deux grandes formes cliniques d'hypermétropie :<\/p>\n<p><b>2.1 L'hypermétropie de l'enfant<\/b><\/p>\n<p>L'hypermétropie de l'enfant passe généralement inaperçue sauf s'il s'installe un strabisme convergent accommodatif ; chez l'enfant d'âge scolaire, il a des difficultés au travail de près avec céphalées.<\/p>\n<p>Il se comporte comme un myope. Il se plaint de céphalées « scolaire » vers midi et 17 heures.<\/p>\n<p>L'évolution se fait vers l'amélioration au fil de la croissance et l'enfant peut quitter ses lunettes vers 15-16 ans.<\/p>\n<p><b>2.2 Hypermétropie de l'adulte<\/b><\/p>\n<p>C'est une hypermétropie qui fait son apparition vers l'âge de 30 à 40 ans (après avoir été longtemps compensée par l'accommodation).<\/p>\n<p>Le malade se plaint de trouble de la vision de près qui apparaît à la lecture ou après un certain temps de fixation.<\/p>\n<p>Ce trouble de la vision peut être accompagné d'autres signes physiques et fonctionnels tels que :<\/p>\n<ul><li>une hyperhémie conjonctivale, des picotements<\/li><li>des larmoiements<\/li><li>des céphalées sus-orbitaires : elles surviennent au moment du travail de lecture et d'écriture. Puis, elles cessent dès qu'on arrête de travailler.<\/li><li>des blépharospasmes caractérisés par une contracture frontale<\/li><li>des troubles de la vision panoramique : cinéma, télé, conduite automobile.<\/li><\/ul>","imgs":["O_p014_0"]},{"ch":"P1","src":"O","page":15,"html":"<h4>Astigmatisme<\/h4>\n<p>C'est une anomalie de la réfraction due au fait que les méridiens de la surface de la cornée ont des rayons de courbures différentes. Par conséquent, l'image d'un point perçu qui traverse la cornée n'est pas un point, mais un segment de droite.<\/p>\n<p>Il en résulte que les images des objets sont déformées dans un sens et non dans l'autre.<\/p>\n<h4>Presbytie<\/h4>\n<p>La presbytie n'est pas une amétropie. Mais elle est responsable d'un défaut de vision binoculaire.<\/p>\n<p>La presbytie se définit comme la difficulté qu'on éprouve à voir de près à partir de 40-45 ans.<\/p>\n<p>La presbytie résulte de la diminution du pouvoir accommodatif du cristallin, liée à l'âge : ce pouvoir accommodatif baisse en dessous de 3 dioptries et la vision nette à la distance habituelle de travail de près (lecture), c'est à dire 33 cm, devient impossible. Le presbyte est obligé d'éloigner les journaux de ses yeux pour lire.<\/p>\n<h4>Traitement des amétropies<\/h4>\n<p>Il n'existe pas de traitement médicamenteux efficace pour guérir l'amétropie.<\/p>\n<p>Le seul traitement reste le port de verres correcteurs.<\/p>\n<p>La prescription des verres correcteurs se fait en fonction du type d'amétropie.<\/p>\n<ul><li>Chez le myope, on prescrit des verres sphériques concaves. Ce sont des verres précédés du signe moins (-). On recommande au patient d'avoir une bonne hygiène de vie.<\/li>\n<li>Chez l'hypermétrope, on prescrit des verres sphériques convexes. Ce sont des verres précédés du signe plus (+)<\/li>\n<li>Chez l'astigmate, on corrige l'astigmatisme par des verres cylindriques. Ce sont des verres caractérisés par des axes, un signe (+ ou -) et une puissance dioptrique.<\/li>\n<li>On peut aussi prescrire des lentilles de contact ou faire la chirurgie réfractive.<\/li>\n<li>Dans la presbytie, il n'y a également qu'un seul : c'est le port de verres convexes (convergents) qui augmentent la convergence du système oculaire et supplée l'accommodation. Les verres ne serviront ainsi qu'à la vision de près.<\/li><\/ul>","imgs":[]},{"ch":"P2","src":"O","page":16,"html":"<h4>Les conjonctivites<\/h4>\n<p><b>Objectifs<\/b> — Définir la conjonctivite ; Décrire les signes cliniques de la conjonctivite ; Citer les étiologies d'une conjonctivite ; Rédiger une ordonnance pour traiter une conjonctivite bactérienne.<\/p>\n<h4>I – Définition<\/h4>\n<p>La conjonctivite est une inflammation de la muqueuse conjonctivale, consécutive à divers types d'agressions (bactériennes, virales, mycosiques, parasitaires, allergiques, toxiques et traumatiques) entrainant une rougeur oculaire.<\/p>\n<h4>II – Signes cliniques<\/h4>\n<p><b>1. Les signes fonctionnels<\/b><\/p>\n<p><b>a) Phase de début<\/b> — Le début de la maladie est caractérisé par :<\/p>\n<ul><li>la sensation de gêne à type de démangeaison<\/li><li>les picotements oculaires<\/li><li>la lourdeur des paupières<\/li><\/ul>\n<p><b>b) Phase d'état<\/b> — On note :<\/p>\n<ul><li>une impression de corps étrangers ou de grain de sable dans les yeux<\/li><li>une sensation de cuisson de l'œil<\/li><li>des larmoiements et photophobies<\/li><li>des prurits plus ou moins intenses responsables de la propagation de la maladie du fait de « tripotage » des yeux avec les doigts<\/li><li><u>l'acuité visuelle reste conservée<\/u><\/li><li>l'atteinte est d'abord unilatérale, puis bilatérale quelques jours après.<\/li><\/ul>\n<p><b>2. Les signes physiques<\/b><\/p>\n<p>A l'inspection le plus souvent on note : un œdème (tuméfaction) de la paupière.<\/p>\n<p>A l'examen physique (lampe à fente ou bio microscope) on note :<\/p>","imgs":[]},{"ch":"P2","src":"O","page":17,"html":"<ul><li>des sécrétions purulentes, abondantes collant les paupières le matin au réveil. Elles prennent un aspect laiteux ou fluide avec une coloration jaunâtre ou verdâtre qui coule sur la joue.<\/li>\n<li>une hyperémie conjonctivale (rougeur diffuse de la conjonctive)<\/li>\n<li>un œdème conjonctival (le chémosis) important masquant parfois la cornée.<\/li>\n<li>des hémorragies sous conjonctivales<\/li>\n<li>des follicules (renflouement ampulaire ou nodulaire)<\/li>\n<li>des papilles (petits bourgeons reliés, charnus, centrés par un bouquet vasculaire). Elles ont la grosseur d'une tête d'épingle.<\/li><\/ul>\n<p>Les signes généraux sont parfois présents : fièvre ou frisson ou insomnie<\/p>\n<p><i>Conjonctivite bactérienne — Hémorragie sous conjonctivale en nappe<\/i><\/p>\n<h4>III – Etiologies<\/h4>\n<ul><li>les conjonctivites bactériennes dues pour la plupart des cas aux : gonocoques, streptocoques, bacilles de Weeks, pyocyaniques.<\/li>\n<li>Les conjonctivites virales : elles sont très rebelles aux traitements classiques et associent des signes de complication<\/li>\n<li>Les conjonctivites allergiques<\/li>\n<li>Les conjonctivites parasitaires : Helminthiase ; Protozoaires (onchocerca volvulus, toxoplasmose)<\/li>\n<li>Les conjonctivites mycosiques : on les rencontre chez les sujets immunodéprimés (ex: candida albicans).<\/li><\/ul>","imgs":["O_p017_0","O_p017_1"]},{"ch":"P2","src":"O","page":18,"html":"<h4>IV- Evolution<\/h4>\n<p>La plupart des conjonctivites évoluent vers la guérison. Certaines conjonctivites évoluent vers des complications.<\/p>\n<h4>V - Complications<\/h4>\n<p>Les complications sont nombreuses et siègent à plusieurs niveaux :<\/p>\n<ul><li>les complications au niveau des paupières telles que les ulcérations du bord libre des paupières ;<\/li><li>Les surinfections conjonctivales dans les formes virales ;<\/li><li>les complications cornéennes telles que les Ulcères cornéens ou la Perforation de la cornée.<\/li><\/ul>\n<h4>VI- Diagnostic différentiel<\/h4>\n<p>Il ne faut pas confondre la conjonctivite avec :<\/p>\n<ul><li>kératite (inflammation de la cornée)<\/li><li>uvéite (inflammation de l'uvée)<\/li><li>glaucome (neuropathie optique)<\/li><\/ul>\n<h4>VII – Traitement<\/h4>\n<p><b>1 – CAT<\/b><\/p>\n<p>Le traitement est essentiellement étiologique. Pour cela, il faut faire un prélèvement des sécrétions à l'aide d'un écouvillon en vue d'un examen cytologique direct, une culture et un antibiogramme au laboratoire.<\/p>\n<p><b>2 - Traitement proprement dit des conjonctivites bactériennes<\/b><\/p>\n<p>Le traitement repose essentiellement sur le lavage oculaire avec du sérum physiologique et sur l'usage de collyre antibiotique à large spectre d'action :<\/p>\n<ul><li>les collyres seront instillés à raison : 1 goutte 6 fois / jour, le 1er jour. A partir du 2ème jour : 1 goutte 4 fois/ jour pendant 10 à 15 jours<\/li>\n<li>la pommade sera appliquée localement 1 à 2 fois / jour (surtout le soir au coucher) pendant 10 à 15 jours.<\/li><\/ul>\n<p>En fonction des résultats de l'examen bactériologique et de l'antibiogramme, le traitement pourrait être réadapté.<\/p>\n<p>Exemple de collyre antibiotique : chibroxine collyre, tobrex collyre, rifamycine collyre, gentalline collyre, ciloxan collyre.<\/p>","imgs":[]},{"ch":"P2","src":"O","page":19,"html":"<p>Exemple de pommade : Rifamycine pommade; Cébémyxine pommade; Gentalline pommade; Fucithalmic gel; Tobrex pommade<\/p>\n<p><b>N.B<\/b> : il faut éviter de prescrire systématiquement les collyres à base de corticoïde, tant que le germe en cause n'est pas identifié, excluant les virus et les mycoses (ex : candida albicans)<\/p>\n<p><b>3 – Traitement prophylactique :<\/b><\/p>\n<p>Assurer la propreté quotidienne des yeux.<\/p>\n<p>Donner quelques jours de repos aux travailleurs (2 à 3 jours).<\/p>\n<p>Eviction scolaire des écoliers et élèves.<\/p>","imgs":[]},{"ch":"P3","src":"O","page":20,"html":"<h4>La cataracte sénile<\/h4>\n<p><b>Objectifs<\/b> — Définir la cataracte ; Décrire les signes cliniques d'une cataracte sénile ; Proposer aux patients les différentes possibilités thérapeutiques.<\/p>\n<h4>I- Définition<\/h4>\n<p>La cataracte est l'opacification partielle ou totale du cristallin.<\/p>\n<p>Il existe différentes formes de cataractes. La cataracte sénile est de loin la forme la plus fréquente. Elle survient habituellement après 60 ans. Mais en réalité, elle est beaucoup plus précoce dans les zones tropicales où on la rencontre autour de 50 à 55 ans. C'est une cause de cécité réversible.<\/p>\n<h4>II- Facteurs de risque de la cataracte<\/h4>\n<p>Les facteurs de risques connus sont :<\/p>\n<ul><li>une exposition aux radiations ultraviolettes : des études ont montré une prévalence plus élevée de cataractes chez les populations vivant ou travaillant dans des zones à haute exposition aux rayons ultraviolets.<\/li>\n<li>les maladies métaboliques comme le diabète : les diabétiques ont plus de risque de développer la cataracte par rapport au reste de la population.<\/li>\n<li>la myopie forte<\/li><li>l'hérédité<\/li>\n<li>certains médicaments : Une corticothérapie au long cours des cataractes sous capsulaires postérieures est bien connue même si des controverses persistent sur le rôle de la susceptibilité individuelle et la durée de la corticothérapie, les diurétiques et les tranquillisants ont été incriminés comme pouvant être cataractogènes.<\/li>\n<li>il existe d'autres facteurs comme le tabagisme, l'alcoolisme chronique, la carence en vitamines, etc.<\/li>\n<li>les traumatismes oculaires : les contusions et les plaies du globe.<\/li><\/ul>","imgs":[]},{"ch":"P3","src":"O","page":21,"html":"<h4>III- Signes cliniques<\/h4>\n<p><b>1. Signes Fonctionnels<\/b> — Le malade se plaint de :<\/p>\n<ul><li>vision floue (caractérisée par une baisse progressive d'acuité visuelle)<\/li><li>impression de brouillard, de fumée ou de voile.<\/li><li>Impossibilité de distinguer une personne de loin<\/li><li>Diplopie monoculaire<\/li><li>Photophobie avec éblouissement.<\/li><\/ul>\n<p><b>2. Signes physiques<\/b><\/p>\n<p>Le cristallin est blanchâtre. La cataracte est visible à l'œil nu, lorsqu'elle est totale : on observe une blancheur de l'aire pupillaire.<\/p>\n<p>L'examen à la Lampe à fente (LAF) permet de différencier le type de cataracte selon le siège de l'opacité. On peut distinguer : une cataracte capsulaire, une cataracte corticale, une cataracte nucléaire, une cataracte cortico-nucléaire<\/p>\n<p>On a un réflexe pupillaire conservé<\/p>\n<p><b>3. Evolution<\/b><\/p>\n<p>L'évolution de la cataracte sénile est progressive et aboutit à une opacification totale, responsable de la cécité. L'évolution peut être aussi émaillée de complications.<\/p>\n<h4>IV- Complications<\/h4>\n<ul><li><b>L'hypertonie oculaire<\/b> (élévation de la pression intraoculaire)<\/li><li><b>Le glaucome<\/b> (neuropathie optique)<\/li><li><b>L'uvéite<\/b> (inflammation de l'uvée)<\/li><\/ul>\n<h4>V- Traitement<\/h4>\n<p><b>1. Traitement médical<\/b><\/p>\n<p>Il n'existe pas de traitement médical à visée curative à ce jour.<\/p>\n<p>Le seul véritable traitement de la cataracte reste la chirurgie.<\/p>\n<p><b>2. Traitement chirurgical<\/b><\/p>\n<p>L'intervention chirurgicale de la cataracte est précédée d'un bilan pré-opératoire (standard et oculaire) qui renseigne sur les chances de succès de l'opération.<\/p>\n<ul><li>un bilan préopératoire standard.<\/li><\/ul>","imgs":[]},{"ch":"P3","src":"O","page":22,"html":"<ul><li>TP + TCA, Groupe rhésus, ECG, Radio-pulmonaire ; urée - glycémie + créatinine, NFS<\/li><\/ul>\n<p>un bilan oculaire qui porte sur :<\/p>\n<ul><li>la recherche d'une éventuelle infection de l'œil (au niveau des conjonctives, paupières et voies lacrymales)<\/li><li>la mesure de la PIO (pression intra-oculaire).<\/li><li>l'appréciation (étude) du réflexe photomoteur (réflexe pupillaire)<\/li><li>l'étude de la projection lumineuse<\/li><li>l'échographie oculaire en mode A et B pour le calcul de l'implant.<\/li><\/ul>\n<p><b>a) Extraction extra-capsulaire<\/b><\/p>\n<p>C'est la technique la plus utilisée. Elle consiste à ouvrir par incision la capsule antérieure, à laver les masses corticales, puis à extraire le noyau cristallinien tout en laissant en place la capsule postérieure. Cette extraction est suivie par la mise en place d'un implant (cristallin artificiel) en chambre postérieure.<\/p>\n<p><b>b) La phaco-émulsification<\/b><\/p>\n<p>Elle consiste à faire une petite incision cornéenne par laquelle on introduit une sonde à ultrasons. Les ultrasons vont fragmenter le noyau. Les fragments seront extraits par irrigation et aspiration.<\/p>","imgs":[]},{"ch":"P4","src":"O","page":23,"html":"<h4>Glaucome chronique à angle ouvert<\/h4>\n<p><b>Objectifs<\/b> — Définir le glaucome chronique à angle ouvert (GCAO) ; Décrire les signes cliniques caractéristiques du GCAO ; Faire une éducation sanitaire à un patient pour une prise en charge adéquate du GCAO.<\/p>\n<h4>I- Définition<\/h4>\n<p>C'est une neuropathie optique chronique et évolutive. Cette évolution se fait insidieusement (à l'insu du malade). Elle est en général bilatérale et caractérisée par :<\/p>\n<ul><li>une hypertonie oculaire (non obligatoire)<\/li><li>une excavation de la papille<\/li><li>un déficit du champ visuel<\/li><\/ul>\n<p>La fréquence de cette neuropathie augmente nettement à partir de 40 ans.<\/p>\n<h4>II- Signes cliniques<\/h4>\n<p><b>1. Signes fonctionnels<\/b><\/p>\n<p>Ils sont rares, quelques fois inexistants. Le GCAO est découvert lors d'une consultation ophtalmologique de routine.<\/p>\n<p>Cependant le patient peut signaler :<\/p>\n<ul><li>des céphalées frontales frustes ou des douleurs sus-orbitaires à type de pesanteur<\/li><li>une baisse d'acuité visuelle (BAV), au stade tardif<\/li><li>un halo coloré : le patient voit une sorte d'arc-en-ciel autour des lumières<\/li><\/ul>\n<p><b>2. Signes physiques<\/b><\/p>\n<ul><li>lorsqu'on mesure la pression à l'intérieur de l'œil, on constate qu'il y a une hypertonie oculaire : la Pression Intra Oculaire (PIO) est supérieure à 21 mmHg; mais, parfois la PIO peut être normale.<\/li><li>le fond d'œil (FO) montre une excavation de la papille;<\/li><li>le champ visuel est altéré.<\/li><\/ul>","imgs":[]},{"ch":"P4","src":"O","page":24,"html":"<p><b>Mesure du tonus oculaire<\/b> : à l'aplanation ; bi digital.<\/p>\n<p>L'appréciation du tonus oculaire se fait à l'aide de deux doigts (index) par palpation du globe oculaire, l'œil étant fermé.<\/p>\n<p>La mesure de la pression intra oculaire se fait à l'aide d'un dispositif appelé le Tonomètre à aplanation.<\/p>\n<h4>III- Evolution<\/h4>\n<p>En l'absence de traitement le GCAO évolue insidieusement pour aboutir à la cécité.<\/p>\n<p>Sous traitement le GCAO peut se stabiliser et le tonus oculaire se normalise. L'excavation papillaire et le champ visuel restent stables<\/p>\n<h4>IV- Traitement<\/h4>\n<p><b>1. Traitement médical<\/b><\/p>\n<p>C'est un traitement à vie, basé sur l'utilisation de collyres anti glaucomateux. La prescription de ces collyres relève du médecin ophtalmologistes.<\/p>\n<p>On peut aussi avoir recours à des hypotonisants par voie générale.<\/p>\n<p><b>2. Traitement chirurgical<\/b><\/p>\n<p>C'est la trabéculectomie qui va favoriser l'évacuation de l'humeur aqueuse. Elle consiste à créer une fistule dans le trabéculum à travers laquelle l'humeur aqueuse va être évacuée.<\/p>\n<p><i>Fond d'œil normal — Papille du glaucome chronique<\/i><\/p>","imgs":["O_p024_0","O_p024_1"]},{"ch":"P5","src":"O","page":25,"html":"<h4>Glaucome aigu<\/h4>\n<p><b>Objectifs<\/b> — Définir le glaucome aigu ; Décrire les signes cliniques du glaucome aigu ; Instituer un traitement d'urgence et évacuer le patient en ophtalmologie.<\/p>\n<h4>I- Définition<\/h4>\n<p>C'est une crise oculaire aiguë très douloureuse, de survenue brutale et unilatérale due à la fermeture de l'angle irido-cornéen. Elle est caractérisée par la triade :<\/p>\n<ul><li>Rougeur oculaire<\/li><li>Douleur oculaire vive, intense<\/li><li>Baisse de l'acuité visuelle (BAV)<\/li><\/ul>\n<p>Le glaucome aigu est une urgence en ophtalmologie.<\/p>\n<h4>II- Signes cliniques<\/h4>\n<p><b>1. Signes fonctionnels<\/b><\/p>\n<p><b>a) Facteurs déclenchants<\/b> — La crise peut être précédée par les signes suivants :<\/p>\n<ul><li>stress<\/li><li>anxiété<\/li><li>les nausées et vomissements<\/li><li>les céphalées et sueurs profuses<\/li><li>l'anesthésie générale<\/li><li>certains médicaments (atropine, antispasmodique, antihistaminique, antiasthmatique, antidépresseur, anorexigène)<\/li><\/ul>\n<p><b>b) La crise<\/b><\/p>\n<p>C'est une douleur intense (lancinante) brutale habituellement unilatérale, survenant la nuit où à l'aube.<\/p>\n<p>Le patient se plaint de :<\/p>\n<ul><li>céphalées intenses<\/li><li>œil douloureux et rouge<\/li><\/ul>","imgs":[]},{"ch":"P5","src":"O","page":26,"html":"<ul><li>BAV importante se limitant à 1/10e parfois<\/li><li>Photophobie<\/li><li>Larmoiement<\/li><li>Halo coloré autour des lumières.<\/li><\/ul>\n<p>Parfois le malade est obnubilé ou il est dans un état qui rappelle un syndrome abdominal (nausées et vomissements).<\/p>\n<p><b>2. Signes physiques<\/b><\/p>\n<p>Ils sont dominés par :<\/p>\n<ul><li>l'hyperhémie conjonctivale (œil rouge)<\/li><li>une cornée trouble, terne ou oedématiée<\/li><li>un cercle périkératique (rougeur limbique qui entoure la cornée)<\/li><li>une pupille en mydriase ou semi-mydriase<\/li><li>au palper bidigital le globe oculaire est dur comme une bille<\/li><li>le tonus oculaire se situe entre 60 à 100 mmHg<\/li><li>Si le FO est accessible, on note une excavation de la papille optique ou une papille normale.<\/li><\/ul>\n<h4>III- Traitement<\/h4>\n<p><b>1. Traitement médical d'urgence<\/b><\/p>\n<p>Il faut évacuer le malade d'urgence en ophtalmologie où l'on procédera à :<\/p>\n<ul><li>La mise en place d'une perfusion intraveineuse de mannitol à 10 ou 20% à faire passer en 30 mn.<\/li>\n<li>Injection de Diamox (acétazolamide 500mg) en IVD lente 2 ou 3 fois.<\/li>\n<li>Instillation d'un collyre myotique : exemple : pilocarpine 2%, 1 goutte toutes les 15mn jusqu'à l'obtention d'un myosis<\/li>\n<li>L'administration d'antalgique (paracétamol 500mg) par voie orale.<\/li><\/ul>\n<p><b>2. Traitement chirurgical (Traitement préventif)<\/b><\/p>\n<p>Il consiste à pratiquer une iridectomie périphérique ou une iridotomie au laser à ARGON.<\/p>","imgs":[]},{"ch":"P6","src":"O","page":27,"html":"<h4>Pathologies des paupières — Le chalazion<\/h4>\n<p><b>Objectifs<\/b> — Définir le chalazion ; Décrire les signes cliniques du chalazion ; Citer les éléments du diagnostic différentiel du chalazion ; Rédiger une ordonnance médicale pour un traitement de chalazion.<\/p>\n<h4>I. Définition<\/h4>\n<p>Le chalazion est une petite tumeur qui se développe sur le tarse. En fait c'est un granulome inflammatoire chronique dû à une obstruction du canal excréteur (évacuateur) de la glande de Méibomius. L'inflammation peut être due à une infection à staphylocoque doré.<\/p>\n<p>Le chalazion a une taille qui varie de celle d'une tête d'épingle à celle d'une noisette ou d'un petit pois qui soulève la paupière de façon inesthétique.<\/p>\n<h4>II. Signes cliniques<\/h4>\n<p>Le chalazion évolue principalement en deux stades :<\/p>\n<p><b>1. Le stade aigu<\/b><\/p>\n<p>A ce stade, les signes fonctionnels sont dominés par une douleur modérée ou parfois aiguë de la paupière. Le matin au réveil on peut avoir un écoulement spontané de pus.<\/p>\n<p>Les signes physiques sont dominés essentiellement par une tuméfaction chaude, rouge et douloureuse.<\/p>\n<p><b>2. Le stade d'enkystement<\/b><\/p>\n<p>A ce stade la tuméfaction est ferme.<\/p>\n<p>A la palpation, la peau qui la recouvre glisse facilement. Il n'y a plus de douleur mais la tuméfaction persiste.<\/p>","imgs":[]},{"ch":"P6","src":"O","page":28,"html":"<p><i>Chalazion<\/i><\/p>\n<h4>III. Diagnostic différentiel<\/h4>\n<ul><li>Orgelet<\/li><li>Tarsite nodulaire de la syphilis<\/li><li>Œdème palpébral au cours de la conjonctivite unilatérale<\/li><li>Piqûre d'insecte<\/li><\/ul>\n<h4>IV. Traitement<\/h4>\n<p><b>1. Au stade aigu :<\/b><\/p>\n<p>Application de pommade ATB + corticoïde matin et soir pendant 10 à 15 jours.<\/p>\n<p><b>2. Au stade d'enkystement<\/b><\/p>\n<p>Le traitement est uniquement chirurgical.<\/p>\n<p><b>NB<\/b> : il ne faut pas opérer précipitamment un chalazion car la disparition spontanée est possible pendant le premier mois d'évolution.<\/p>","imgs":["O_p028_0"]},{"ch":"P6","src":"O","page":29,"html":"<h4>L'orgelet<\/h4>\n<p><b>Objectifs<\/b> — Définir l'orgelet ; Décrire les signes cliniques de l'orgelet ; Rédiger une ordonnance médicale pour un traitement d'orgelet.<\/p>\n<h4>I- Définition<\/h4>\n<p>C'est l'abcès staphylococcique de la glande de ZEISS. Ici, la tuméfaction est centrée sur le cil du bord libre de la paupière. C'est l'homologue du furoncle de la peau.<\/p>\n<p><i>Orgelet<\/i><\/p>\n<h4>II- Signes cliniques<\/h4>\n<p>Le début est rapide en 24 à 48 heures caractérisé par un œdème palpébral circonscrit. Le patient se plaint de sensation de gêne ou de lourdeur et de chaleur au niveau de la paupière. C'est une sensation de cuisson du bord palpébral.<\/p>\n<h4>III- Evolution<\/h4>\n<p>L'infection peut se propager à l'autre bord par inoculation directe ou à d'autres atteintes folliculaires du voisinage. Il n'est pas rare de trouver plusieurs orgelets à des stades évolutifs différents.<\/p>\n<p>Cependant, l'orgelet peut se perforer et laisser couler du pus ou laisser une zone indurée.<\/p>\n<p>La récidive est très fréquente et doit faire rechercher une étiologie générale (ex : diabète méconnu, déficit de l'état général).<\/p>\n<h4>IV- Traitement<\/h4>\n<ul><li>Application de compresses chaudes<\/li><li>Application de pommades antibiotiques<\/li><li>On peut ponctionner le pus à l'aide d'une aiguille fine, mais jamais à l'aide d'un couteau (bistouri).<\/li><\/ul>","imgs":["O_p029_0"]},{"ch":"E1","src":"O","page":30,"html":"<h4>Chapitre IV : Pathologies oculaires de l'enfant — Conjonctivites du nouveau-né<\/h4>\n<p><b>Objectifs<\/b> — Définir la conjonctivite du nouveau-né ; Décrire les signes cliniques de la conjonctivite bactérienne ; Citer les différents modes de contamination ; Décrire les stratégies de Prévention de la conjonctivite bactérienne ; Rédiger une ordonnance pour traiter la conjonctivite du nouveau-né.<\/p>\n<h4>I- Définition<\/h4>\n<p>Les conjonctivites du nouveau-né ou ophtalmies néonatales désignent les conjonctivites pendant le 1er mois de la vie, précisément pendant les 28 premiers jours de la vie. Ce sont en général des conjonctivites gonococciques, ou à chlamydiae.<\/p>\n<h4>II- Mode de contamination<\/h4>\n<p>La contamination du nouveau-né se fait :<\/p>\n<ul><li>lors du passage au travers des voies génitales (surtout si des manœuvres obstétricales sont effectuées).<\/li><li>Lors d'une présentation de la face<\/li><li>Par contages après la naissance (directement ou par l'intermédiaire de draps ou de linges souillés).<\/li><li>L'infection intra-utérine après rupture prématurée des membranes (rares)<\/li><\/ul>\n<h4>III – Signes cliniques<\/h4>\n<p>Il est important de connaître la date de début de l'infection conjonctivale. Généralement, l'infection survient entre le 3e et le 4e jour. Elle est due au gonocoque ou exceptionnellement au méningocoque.<\/p>\n<p>L'infection est caractérisée par :<\/p>\n<ul><li>l'œdème et la rougeur importante de la paupière et de la conjonctive<\/li><\/ul>","imgs":[]},{"ch":"E1","src":"O","page":31,"html":"<ul><li>les sécrétions purulentes, jaunes verdâtres, abondantes et crémeuses<\/li><li>le pus s'écoule sur la joue lorsqu'on tire sur la paupière<\/li><li>l'atteinte est bilatérale<\/li><\/ul>\n<p>Sans traitement, elle évolue vers des complications.<\/p>\n<h4>IV- Complications<\/h4>\n<ul><li>Perforation cornéenne<\/li><li>Endophtalmie (infection du contenu du globe oculaire)<\/li><li>Panophtalmie (infection généralisée du globe oculaire et des annexes)<\/li><li>Cécité<\/li><li>Septicémie.<\/li><\/ul>\n<h4>V – Traitement<\/h4>\n<p><b>1 – Prophylaxie de l'ophtalmie néonatale<\/b><\/p>\n<p><b>1.1 Méthode de Crédé (Historique)<\/b><\/p>\n<p>C'est une méthode prophylactique proposée en 1880 par CREDE et rendue obligatoire en France. Elle consiste à instiller systématiquement en salle d'accouchement un collyre au nitrate d'argent à 1% (1 à 2 gouttes) dans les yeux du nouveau-né dès sa naissance.<\/p>\n<p>En pratique, dès la naissance du nouveau-né avant même l'ouverture des paupières, il faut les essuyer à l'aide d'une compresse stérile. Puis on tire sur la paupière inférieure à l'aide d'un doigt et on laisse tomber 1 à 2 gouttes de collyre au nitrate d'argent : Ex : argyrol collyre.<\/p>\n<p>Cette méthode a été abandonnée à cause des effets secondaires du collyre de nitrate d'argent (irritations).<\/p>\n<p><b>1.2 Prévention par collyre antibiotique<\/b><\/p>\n<p>Aujourd'hui, on utilise les collyres antibiotiques à large spectre d'action. L'instillation du collyre se fait en salle d'accouchement.<\/p>\n<p>En principe, dans chaque kit d'accouchement, il y a un collyre antibiotique destiné à être instillé au nouveau-né. A défaut, la sage-femme doit prescrire le collyre et veiller à son instillation effective avant la sortie de la mère. Celle-ci devra poursuivre l'instillation à domicile, à raison de 1 goutte 3 fois par jour pendant une semaine.<\/p>","imgs":[]},{"ch":"E1","src":"O","page":32,"html":"<p><b>2 – Traitement curatif<\/b><\/p>\n<p>Avant les résultats du laboratoire il faut instiller un collyre antibiotique plus une pommade à large spectre d'action. Le traitement devra être réadapté ou poursuivi selon les résultats de l'antibiogramme et devra durer au moins 2 semaines.<\/p>\n<p>Un traitement général est nécessaire en cas de mise en évidence de :<\/p>\n<ul><li>gonocoque<\/li><li>méningocoque<\/li><li>chlamydiae<\/li><\/ul>\n<p>Les parents de l'enfant doivent être éventuellement traités s'il est avéré qu'ils sont porteurs de germes.<\/p>","imgs":[]},{"ch":"E2","src":"O","page":33,"html":"<h4>Limbo-conjonctivite<\/h4>\n<p><b>Objectifs<\/b> — Définir la limbo-conjonctivite ; Décrire les signes cliniques d'une limbo-conjonctivite ; Rédiger une ordonnance pour traiter une limbo-conjonctivite.<\/p>\n<h4>I- Définition<\/h4>\n<p>La Limbo-conjonctivite est une conjonctivite allergique qui sévit de façon endémique dans les régions tropicales. D'où son appellation : Limbo-conjonctivite Endémique des Tropiques (LCET).<\/p>\n<p>Elle est très fréquente chez l'enfant en âge préscolaire et scolaire : c'est une Conjonctivite chronique.<\/p>\n<h4>II- Signes cliniques<\/h4>\n<p><b>1. Signes fonctionnels<\/b><\/p>\n<p>Les enfants se plaignent essentiellement de photophobie, larmoiement et de prurits oculaires.<\/p>\n<p><b>2. Signes physiques<\/b><\/p>\n<ul><li>Atteinte bilatérale<\/li><li>Hyperhémie de la conjonctive bulbaire avec parfois une pigmentation brune.<\/li><li>Le limbe cornéen devient épais, de couleur marron ou jaunâtre.<\/li><li>On note parfois des sécrétions blanchâtres localisées sur les bords libres des paupières et dans l'angle interne de chaque œil.<\/li><\/ul>\n<p><b>3. Evolution<\/b><\/p>\n<p>Avec ou sans traitement la limbo-conjonctivite régresse avec l'âge. Mais des surinfections peuvent survenir en cours d'évolution d'où la nécessité de prévenir les complications et les traiter.<\/p>\n<h4>III- Traitement<\/h4>\n<p>Il faut adresser l'enfant au service d'ophtalmologie où un traitement local et général seront institués.<\/p>\n<p>Le traitement local comporte : le lavage oculaire au sérum physiologique ; l'instillation de collyres antiallergiques /antihistaminiques.<\/p>\n<p>Le traitement général comporte :<\/p>\n<ul><li>un anti-histaminique par voie générale si besoin.<\/li><li>un déparasitage systématique.<\/li><li>une désensibilisation lorsque l'allergène est identifié.<\/li><\/ul>","imgs":[]},{"ch":"E3","src":"O","page":34,"html":"<h4>Cataracte congénitale<\/h4>\n<p><b>Objectifs<\/b> — Définir la cataracte congénitale ; Citer les facteurs étiologiques de la cataracte congénitale ; Indiquer le risque majeur lié à la prise en charge tardive de la cataracte congénitale ; Citer 4 diagnostics différentiels de la cataracte congénitale ; Donner des conseils à une mère pour une prise en charge adéquate de son enfant atteint de cataracte.<\/p>\n<h4>I- Définition<\/h4>\n<p>C'est une opacification congénitale du cristallin qui survient à la naissance. Elle altère (modifie) considérablement la fonction visuelle et peut entraîner une amblyopie. L'amblyopie est une malvoyance qui se traduit par une BAV sans lésion organique de l'œil, mais par un mécanisme cérébral de neutralisation des images ; d'où la nécessité d'un diagnostic précoce.<\/p>\n<h4>II- Rappel anatomo physiologique<\/h4>\n<p>Le cristallin est une lentille biconvexe située dans l'œil, en arrière de la pupille. Sa transparence et son élasticité lui permette d'assurer la transmission de la lumière et de focaliser les images sur la rétine.<\/p>\n<p>La fonction visuelle murit dans les premiers moments de la vie après la naissance. Mais cette maturation n'est possible que si la rétine bénéficie d'une stimulation par la lumière. Toute privation de cette stimulation va compromettre la maturation de la vision.<\/p>\n<h4>III- Diagnostic positif de la cataracte du nouveau-né<\/h4>\n<p><b>1- Circonstances de découverte<\/b><\/p>\n<ul><li>La découverte peut être précoce : dans ce cas, c'est la mère, la sage-femme ou le pédiatre qui constate à la naissance, une blancheur de l'aire pupillaire (leucocorie) du nouveau-né.<\/li>\n<li>Il peut s'agir d'une découverte plus tardive : on constate quelques semaines plus tard que l'enfant qui, normalement devait commencer à voir bouger les objets, semble ne pas les voir (son regard ne suit pas les mouvements des objets).<\/li><\/ul>","imgs":[]},{"ch":"E3","src":"O","page":35,"html":"<ul><li>La découverte peut se faire également à l'occasion d'une consultation de l'enfant pour strabisme<\/li><\/ul>\n<p><i>Cataracte congénitale bilatérale<\/i><\/p>\n<p><b>2- A l'examen<\/b><\/p>\n<ul><li>l'Acuité visuelle est difficile à mesurer compte tenu de l'âge de l'enfant ;<\/li><li>On a une diminution ou une abolition du <b>réflexe de clignement<\/b> lors de l'éblouissement par une lumière vive ;<\/li><li>On a également une diminution ou une abolition du <b>réflexe de poursuite<\/b> oculaire de la lumière ;<\/li><li>La cataracte peut être unilatérale ou bilatérale.<\/li><\/ul>\n<h4>IV- Diagnostic différentiel<\/h4>\n<p>L'examen bien conduit permettra d'éliminer d'autres causes de blancheur oculaires chez les enfants :<\/p>\n<ul><li>le rétinoblastome ;<\/li><li>la fibroplasie rétro-lentale ;<\/li><li>le décollement de la rétine ;<\/li><li>la persistance et l'hyperplasie du vitré primitif.<\/li><\/ul>\n<h4>V- Etiologies<\/h4>\n<p>Plusieurs causes peuvent être à l'origine de la cataracte congénitale :<\/p>\n<ul><li>les maladies virales contractées par la mère au cours de la grossesse (ex : rubéole)<\/li><li>les maladies microbiennes (ex : syphilis)<\/li><li>les pathologies parasitaires telles que la toxoplasmose.<\/li><li>les avitaminoses<\/li><li>certains médicaments : le sulfamide<\/li><\/ul>","imgs":["O_p035_0"]},{"ch":"E3","src":"O","page":36,"html":"<ul><li>(médicaments, suite) l'insuline ; la cortisone (naphtaline)<\/li><li>les anomalies du métabolisme : acide aminé ; Glucide ; lipide<\/li><li>les maladies héréditaires (trisomie 21…)<\/li><\/ul>\n<h4>VI- Traitement<\/h4>\n<p>Le traitement est exclusivement chirurgical et doit être précoce afin d'éviter l'installation de l'amblyopie (malvoyance).<\/p>\n<p><b>Buts<\/b> : Lever l'obstacle au passage de la lumière ; Suppléer au rôle optique du cristallin ; Prévenir l'amblyopie<\/p>\n<p><b>Moyens<\/b><\/p>\n<p><b>Traitement chirurgical<\/b> : extraction du cristallin opaque (extraction extra capsulaire)<\/p>\n<p><b>Traitement optique<\/b> : remplacement du cristallin soit par une lentille intra oculaire, des verres de lunettes ou des lentilles de contact<\/p>\n<p><b>Rééducation de l'amblyopie<\/b><\/p>\n<p><b>NB<\/b> : L'implantation immédiate est controversée : elle dépendra surtout de l'âge du patient.<\/p>","imgs":[]},{"ch":"E4","src":"O","page":37,"html":"<h4>Le rétinoblastome<\/h4>\n<p><b>Objectifs<\/b> — Définir le rétinoblastome ; Décrire les signes cliniques du rétinoblastome ; Citer les éléments du diagnostic différentiel ; Décrire les moyens de traitement et leurs indications.<\/p>\n<h4>I- Définition<\/h4>\n<p>Le rétinoblastome est une tumeur maligne de la rétine touchant l'enfant dans les trois premières années de la vie. Sa fréquence est rare, car elle touche en moyenne 1 enfant sur 10 000. Il est le plus souvent unilatéral. Sa transmission est souvent héréditaire et en général sur un mode autosomique dominant.<\/p>\n<h4>II- Diagnostic positif<\/h4>\n<p><b>1- Circonstance de découverte<\/b><\/p>\n<ul><li>Il s'agit le plus souvent d'un enfant amené par ses parents ayant constaté : l'existence d'un reflet pupillaire anormal (leucocorie) ; l'apparition d'un strabisme ; la présence de mouvements anormaux de type nystagmus.<\/li>\n<li>Il peut s'agir par ailleurs d'une baisse d'acuité visuelle (BAV) ou de l'existence de complications à type d'hémorragie oculaire, d'hypertonie oculaire ou de syndrome inflammatoire.<\/li>\n<li>Cette tumeur peut être découverte à l'occasion d'un examen systématique.<\/li><\/ul>\n<p>En Afrique, il n'est pas rare de découvrir le rétinoblastome au stade d'exophtalmie plus ou moins monstrueux. Il faut toujours s'informer sur l'existence d'une leucocorie antérieure à l'exophtalmie.<\/p>\n<p><b>2- Examen clinique de l'œil atteint chez un enfant de moins de trois ans<\/b><\/p>\n<p>L'examen est réalisé sous anesthésie générale afin de déterminer les caractéristiques de la tumeur.<\/p>","imgs":[]},{"ch":"E4","src":"O","page":38,"html":"<p><b>2.1 Stade de début<\/b><\/p>\n<p>L'examen du segment antérieur est normal; Le fond d'œil montre une masse blanche plus ou moins volumineux faisant corps avec la rétine hyper vascularisée s'accompagnant parfois d'hémorragie ou de décollement de rétine.<\/p>\n<p><b>2.2 Stade tardif<\/b><\/p>\n<p>Le diagnostic est tardif en présence d'une exophtalmie avec : un segment antérieur remanié; une atteinte palpébrale : les paupières faisant corps avec l'exophtalmie tumorale; un fond d'œil inaccessible.<\/p>\n<h4>III- Evolution<\/h4>\n<p>L'évolution spontanée de la tumeur se fait vers le nerf optique et le chiasma pour aboutir à la mort dans de grandes douleurs.<\/p>\n<h4>IV- Diagnostic différentiel<\/h4>\n<ul><li>Une cataracte<\/li><li>Une malformation congénitale<\/li><li>Une fibroplasie rétrolentale<\/li><li>Une hyperplasie du vitré<\/li><li>Un décollement de la rétine<\/li><li>Un lymphome de Burkitt<\/li><\/ul>\n<h4>V- Traitement<\/h4>\n<p><b>1. But<\/b> : C'est de conserver la vie de l'enfant.<\/p>\n<p><b>2. Les moyens<\/b> : Ils se résument en trois : l'énucléation, la radiothérapie et la chimiothérapie.<\/p>\n<p><b>3. Indications<\/b><\/p>\n<p><b>3.1 Dans les formes unilatérales<\/b> : On fait une énucléation associée ou non à la radiothérapie de l'œil atteint.<\/p>","imgs":[]},{"ch":"E4","src":"O","page":39,"html":"<p><b>3.2 Dans les formes bilatérales<\/b><\/p>\n<p>On peut proposer l'énucléation d'un œil, associée à la radiothérapie de l'autre œil.<\/p>\n<p><b>3.3 Dans les formes tardives<\/b><\/p>\n<p>On pratique une exentération associée à la radiothérapie. Mais le pronostic est très mauvais.<\/p>","imgs":[]},{"ch":"E5","src":"O","page":40,"html":"<h4>Glaucome congénital<\/h4>\n<p><b>Objectifs<\/b> — Définir le glaucome congénital ; Décrire les signes cliniques du glaucome congénital ; Conseiller une mère pour une prise en charge adéquate de son enfant atteint de glaucome congénital.<\/p>\n<h4>I- Définition<\/h4>\n<p>Le glaucome congénital est une hypertonie oculaire engendrée par une malformation de l'angle irido-cornéen qui laisse subsister devant le trabéculum un tissu mésodermique (membrane de BARKAN) qui s'oppose à l'évacuation de l'humeur aqueuse.<\/p>\n<h4>II- Signes cliniques<\/h4>\n<p>Le glaucome congénital est souvent bilatéral<\/p>\n<p><b>1. Signes fonctionnels<\/b><\/p>\n<ul><li>larmoiement<\/li><li>photophobie intense : l'enfant tourne la tête à l'opposé d'une source lumineuse.<\/li><li>Les yeux sont quelques fois endormis.<\/li><\/ul>\n<p><b>2. Signes physiques<\/b><\/p>\n<p>On note :<\/p>\n<ul><li>une mégalo-cornée avec de gros yeux. On dit souvent que l'enfant a de « beaux yeux »<\/li><li>une Buphtalmie<\/li><li>un œdème cornéen<\/li><li>une distension du limbe<\/li><li>une rupture de la membrane de Descemet<\/li><li>une excavation de la papille optique<\/li><\/ul>\n<h4>III- Traitement<\/h4>\n<p>Le traitement est exclusivement chirurgical et doit être précoce. C'est la trabéculectomie. Elle consiste dans l'ablation des structures trabéculaires du canal de Schlemm.<\/p>","imgs":[]},{"ch":"N1","src":"O","page":41,"html":"<h4>Chapitre V : Pathologies oculaires négligées — Onchocercose<\/h4>\n<p><b>Plan du cours<\/b> : Introduction ; I. Définition ; II. Epidémiologie ; III. Diagnostics (3.1 Diagnostic positif : clinique et para clinique ; 3.2 Diagnostic différentiel) ; IV. Conduite à tenir ; V. Impact psychologique et socio-économique ; Conclusion.<\/p>","imgs":[]},{"ch":"N1","src":"O","page":42,"html":"<h4>Introduction<\/h4>\n<p>L'onchocercose fait partie des maladies tropicales négligées à Chimiothérapie Préventive (MTN-CP). C'est une maladie parasitaire qui a des répercussions oculaires avec des lésions spécifiques et graves. Elle est appelée aussi « cécité des rivières ». La lutte contre cette affection a fait l'objet de la mise en place de programme à très large échelle dans les zones d'endémicité. Les résultats probants engrangés ont permis de maîtriser l'impact de la maladie. Mais, elle n'est toujours pas éradiquée, d'où l'intérêt de son étude.<\/p>\n<p><b>Objectif général<\/b> : Assurer la prise en charge de tout patient souffrant d'onchocercose<\/p>\n<p><b>Objectifs spécifiques<\/b> : Définir l'onchocercose ; Expliquer l'épidémiologie ; Poser le diagnostic ; Décrire la prise en charge ; Expliquer l'impact psychosocial et économique.<\/p>\n<h4>I- Définition<\/h4>\n<p>L'onchocercose est une filariose cutanéo-dermique due à un ver appelé onchocerca volvulus. Il est provoqué par l'infestation de la peau et des yeux par de nombreuses larves microfilaires après plusieurs piqûres d'un moucheron appelé Simulie (<i>Simulium Damnosum<\/i>).<\/p>\n<h4>II- Epidémiologie<\/h4>\n<p><b>2.1. Répartition géographique<\/b><\/p>\n<p>L'onchocercose sévit dans de nombreux pays du monde, principalement en Afrique de l'Ouest et en Afrique centrale. Il est surtout répandu dans de nombreux pays d'Afrique comme le Bénin, le Burkina-Faso, la Côte d'Ivoire, le Ghana, la Guinée, l'Ouganda, la République démocratique du Congo.<\/p>\n<p>L'onchocercose sévit dans certaines régions d'Amérique centrale ainsi qu'au Yémen.<\/p>","imgs":[]},{"ch":"N1","src":"O","page":43,"html":"<p>En fait, le foyer le plus important se situe en Afrique entre le 20ème degré de latitude Nord et le 17ème degré de latitude Sud dont la Côte d'Ivoire en fait partie. L'onchocercose atteint plus de 20 millions d'individus dans le monde dont un 500 000 atteints de cécité.<\/p>\n<p>En Côte d'Ivoire, on dénombre 97 districts sanitaires endémiques à l'onchocercose sur 113.<\/p>\n<p><b>2.2. Caractéristiques sociodémographiques<\/b><\/p>\n<p>L'onchocercose sévit dans les communautés rurales isolées des pays les moins développés. Les personnes qui vivent ou travaillent dans les régions où sont présentes à la fois la simulie et la maladie risquent de contracter l'onchocercose. 60% des personnes vivant dans les zones hyperendémiques souffrent d'onchocercose qu'elles ont contractée plus tôt dans leur vie. Dans ces zones hyperendémiques, 5% des membres de la communauté vont perdre la vue et 30% parmi les hommes de plus de 40 ans. L'incidence de la cécité est plus élevée chez les hommes. Le risque est plus élevé chez les personnes qui pratiquent la culture maraichère, les pêcheurs et les lavandières.<\/p>\n<h4>III- Diagnostics<\/h4>\n<p><b>3.1. Diagnostic positif<\/b><\/p>\n<p>On peut poser le diagnostic à partir des signes cliniques tels que les lésions de la peau à un stade préc
