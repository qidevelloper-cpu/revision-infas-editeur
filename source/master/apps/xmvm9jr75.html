  <div class="small" style="margin-top:8px"><b>${T('sources.year','Année :')}</b> ${esc(c.annee)} · <b>${T('sources.level','Niveau :')}</b> ${esc(c.niveau)} · <b>${T('sources.fmt','Format :')}</b> ${esc(c.fmt)}<br><b>${T('sources.num','Numérotation :')}</b> ${esc(c.num)}<br><b>${T('sources.content','Contenu :')}</b> ${esc(c.contenu)}<br><b>${T('sources.rq','Remarques :')}</b> ${esc(c.rq)}</div><button class="btn light" onclick="${first(c.id)}">${T('sources.read','📄 Lire ce cours')}</button></div>`}).join('');
 if(t==='side')body=`<div class="card" style="overflow:auto"><table class="tb"><tr><th>${T('sources.crit','Critère')}</th>${C.map(c=>`<th>${esc(c.code)}<div class="small muted">${esc(c.short)}</div></th>`).join('')}</tr>${(DATA.side||[]).map(([k,v])=>`<tr><th>${esc(k)}</th>${v.map((x,i)=>`<td>${x==='auto'?stat(C[i].id).dv+' div.':esc(x)}</td>`).join('')}</tr>`).join('')}</table></div>`;
 if(t==='theme')body=(DATA.themes||[]).map(th=>`<div class="card"><h3>${esc(th.t)}</h3>${th.chs.filter(c=>CH[c]).map(c=>`<div class="rv"><b>${esc(chOf(c).title)}</b><div class="small muted">${esc((DATA.chapSrc||{})[c]||'')}</div></div>`).join('')}<button class="btn coral" onclick="startQuiz(pick({chs:${esc(JSON.stringify(th.chs))},n:20}),'${jsq(th.t)}')">${T('sources.theme.quiz','🎯 Quiz sur ce thème')}</button></div>`).join('');
 if(t==='meme')body=DATA.chapters.filter(c=>((DATA.chapSrc||{})[c.id]||'').includes(';')).map(c=>{const ds=DVG().filter(d=>d.ch.includes(c.id));return `<div class="card"><h3>${c.emo} ${esc(c.title)}</h3><div class="small">${esc(DATA.chapSrc[c.id])}</div>${ds.length?ds.map(d=>`<div class="small" style="color:#b35c00">⚠ ${esc(d.t)}</div>`).join(''):`<div class="small muted">${T('sources.meme.ok','Pas de divergence relevée : les cours concordent sur l’essentiel.')}</div>`}</div>`}).join('');
 if(t==='coq'){const items=[],seen=new Set();const scan=(txt,ch,src,page)=>{const re=/[^.;«»]*✎[^.;»]*/g;let x;while((x=re.exec(txt))){const s=x[0].trim();if(!seen.has(s)){seen.add(s);items.push([s,ch,src,page])}}};
  (DATA.cards||[]).forEach(f=>scan(f.q+' '+f.a,f.ch,f.src,f.page));DATA.questions.forEach(q=>scan(q.q+' '+(q.exp||''),q.ch,q.src,q.page));
  body=`<div class="card small">${T('sources.coq.intro','Les fautes de frappe évidentes des PDF ont été corrigées dans l’appli et signalées par « ✎ ». Les valeurs douteuses portent la mention « à vérifier auprès de l’enseignant ».')}</div>${(DATA.sommaireErr||[]).length?`<div class="card"><h3>${T('sources.coq.som','Erreurs de sommaire')}</h3>${DATA.sommaireErr.map(e=>`<div class="rv"><b>${esc(e[0])}</b> — ${esc(e[1])} ${srcBtn(e[2],e[3])}</div>`).join('')}</div>`:''}<div class="card"><h3>${T('sources.coq.list','Coquilles corrigées ({n})',{n:items.length})}</h3>${items.map(i=>`<div class="rv">${esc(i[0])} <span class="small muted">· ${esc(chOf(i[1]).short)}</span> ${srcBtn(i[2],i[3])}</div>`).join('')}</div>`}

/* ---------- Prépa : par épreuve ---------- */
function prepaEps(){const P=PREPA();const all=P.q.concat(P.hors).sort((a,b)=>(a.num||0)-(b.num||0));const out=[],m={};all.forEach(q=>{const k=q.ep||Tx('prepa.ep.none','Sans titre');if(!m[k]){m[k]={t:k,q:[],h:[]};out.push(m[k])}(q.hors?m[k].h:m[k].q).push(q)});return out}
function startPrepaExam(k){const E=prepaEps()[k];const ids=E.q.filter(q=>q.type!=='ouv').map(q=>q.id);if(!ids.length){toast(Tx('prepa.exam.none','Pas de question notable automatiquement dans cette épreuve'));return}EX={ids,idx:0,ans:{},t0:Date.now(),dur:Math.max(10,Math.round(ids.length*1.2))*60*1000,subj:'pex'+k};touchStreak();go('exam')}
B('prepa.eps','Par épreuve du recueil',()=>{const L=prepaEps();if(L.length<2)return'';const st=S.subj||{};
 return `<div class="card"><h3>${T('prepa.eps.h','📚 Les épreuves du recueil')}</h3><div class="small muted" style="margin-bottom:10px">${T('prepa.eps.sub','Chaque épreuve dans l’ordre du recueil : entraînement corrigé (toutes les questions, y compris rédigées) ou examen chronométré noté /20 (questions à correction automatique).')}</div>
 ${L.map((E,k)=>{const o=st['pep'+k];const ex=st['pex'+k];const nAuto=E.q.filter(q=>q.type!=='ouv').length;return `<div class="rv"><b>${esc(E.t)}</b><div class="small muted">${T('prepa.eps.n','{n} questions corrigées · {o} rédigées · {h} hors cours',{n:E.q.length,o:E.q.filter(q=>q.type==='ouv').length,h:E.h.length})}${o?' · '+T('prepa.best','Meilleur : {s}/{n} ({p} %)',{s:o.best,n:o.n,p:Math.round(o.best/o.n*100)}):''}${ex?' · '+T('prepa.eps.note','examen : {s}/20',{s:Math.round(ex.best/ex.n*200)/10}):''}</div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px">${E.q.length?`<button class="chip" onclick="startPrepa(prepaEps()[${k}].q.map(q=>q.id),'${jsq(E.t)}','ep${k}')">${T('prepa.eps.train','▶ S’entraîner')}</button>`:''}${nAuto?`<button class="chip" onclick="startPrepaExam(${k})">${T('prepa.eps.exam','⏱ Examen /20 ({n} q)',{n:nAuto})}</button>`:''}</div></div>`}).join('')}</div>`},{portable:false});

 $$('[data-c]',b).forEach(x=>x.oninput=()=>{E.palette={custom:Object.assign({},authorPalette(),{n:'Sur mesure',[x.dataset.c]:x.value})};S.theme=null;save();applyLook();commitSoon('Palette sur mesure')});

VIEWS.font=()=>{const f=E.font&&E.font.family;return `<div class="ed-note">Police de toute l’application, choisie parmi celles installées sur l’appareil. Police actuelle : <b>${esc(f||'Outfit (par défaut)')}</b></div>
 <div class="ed-h">1 · Saisie libre</div><input class="ed-in" id="edFFree" placeholder="Nom exact de la police, ex. Georgia" value="${esc(f||'')}"><div class="ed-pv" id="edFPv" style="font-size:20px">Aa — L’infirmier évalue la douleur 0123456789</div>
 <div class="ed-row"><button class="ed-btn" id="edFApply">Appliquer cette police</button><button class="ed-btn l" id="edFDef">Police par défaut</button></div>
 <div class="ed-h">2 · Polices de l’appareil (Chrome / Edge sur ordinateur)</div>${'queryLocalFonts' in window?'<button class="ed-btn w" id="edFLocal">Charger la liste des polices de l’appareil</button><div class="ed-note">Le navigateur va demander ton accord.</div>':'<div class="ed-note">Non disponible sur ce navigateur (normal sur téléphone). Utilise la détection ci-dessous.</div>'}
 <div class="ed-h">3 · Détection automatique (fonctionne aussi sur téléphone)</div><button class="ed-btn l" id="edFDetect">Détecter parmi ${FONT_LIST.length} polices courantes</button>
 <input class="ed-in" id="edFq" placeholder="Filtrer la liste…" style="display:none"><div class="ed-fonts" id="edFList"></div>`};
let FONTS_FOUND=null;
BINDS.font=b=>{const free=edq('#edFFree'),pv=edq('#edFPv');const prev=()=>{pv.style.fontFamily=free.value?'"'+free.value.replace(/"/g,'')+'", monospace':''};free.oninput=prev;prev();
 edq('#edFApply').onclick=()=>{const v=free.value.trim();if(!v)return;setFont(v,'saisie')};edq('#edFDef').onclick=()=>{E.font=null;commit('Police par défaut');applyLook();panel('font')};
 const lb=edq('#edFLocal');if(lb)lb.onclick=async()=>{try{const fs=await window.queryLocalFonts();showFonts([...new Set(fs.map(x=>x.family))].sort((a,c)=>a.localeCompare(c)),'appareil')}catch(e){toast('Accès refusé ou impossible : utilise la détection')}};
 edq('#edFDetect').onclick=()=>{FONTS_FOUND=detectFonts(FONT_LIST);showFonts(FONTS_FOUND,'détection');toast(FONTS_FOUND.length+' police(s) trouvée(s) sur cet appareil')};
 if(FONTS_FOUND)showFonts(FONTS_FOUND,'détection')};
function showFonts(list,src){const box=edq('#edFList'),q=edq('#edFq');q.style.display='block';const draw=()=>{const v=nrm(q.value);box.innerHTML=list.filter(f=>!v||nrm(f).includes(v)).slice(0,300).map(f=>`<button data-f="${esc(f)}" style="font-family:'${esc(f.replace(/'/g,''))}',monospace">${esc(f)} — Aa Bb 123<small>${src}</small></button>`).join('')||'<div class="ed-note">Aucune police.</div>';$$('[data-f]',box).forEach(x=>x.onclick=()=>setFont(x.dataset.f,src))};q.oninput=draw;draw()}
function setFont(f,src){E.font={family:f,src};commit('Police « '+f+' »');applyLook();render();panel('font');toast('Police « '+f+' » appliquée')}
function detectFonts(list){const c=document.createElement('canvas').getContext('2d');const txt='mmmmmmmmmmlli WwQq@#0123456789 éàçÆ';const base=['monospace','serif','sans-serif'];const bw=base.map(b=>{c.font='72px '+b;return c.measureText(txt).width});
 return list.filter(f=>base.some((b,i)=>{c.font='72px "'+f+'", '+b;return Math.abs(c.measureText(txt).width-bw[i])>0.5}))}
window.PORTAIL_detectFonts=()=>detectFonts(FONT_LIST);

function qForm(q){const isNew=!q;q=q?clone(q):{id:'n'+Date.now().toString(36),ch:CT.ch||DATA.chapters[0].id,type:'qcm',q:'',options:['','','',''],answer:0,exp:'',src:(DATA.sources[0]||{}).id,page:null};const L='ABCDEFGH';
 const ansStr=q.type==='saisie'?(q.answer||[]).join('\n'):q.type==='vf'?(q.answer===0?'Vrai':'Faux'):(Array.isArray(q.answer)?q.answer:[q.answer]).map(i=>L[i]).join(',');
 modal(`<h3>${isNew?'Nouvelle question':'Modifier la question #'+esc(q.id)}</h3>
 <div class="ed-grid2"><select id="fqType">${TYPES.map(t=>`<option value="${t}" ${q.type===t?'selected':''}>${esc(typeLabel(t))}</option>`).join('')}</select><select id="fqCh">${DATA.chapters.map(c=>`<option value="${esc(c.id)}" ${q.ch===c.id?'selected':''}>${esc(c.short)}</option>`).join('')}</select></div>
 <textarea id="fqScen" placeholder="Situation clinique (cas clinique seulement)" style="min-height:50px">${esc(q.scen||'')}</textarea>
 <textarea id="fqQ" placeholder="Énoncé">${esc(q.q)}</textarea>
 <div class="ed-note">Propositions (une par ligne, A, B, C…) — inutile pour Vrai/Faux et QROC</div><textarea id="fqO">${esc((q.options||[]).join('\n'))}</textarea>
 <div class="ed-note">Bonne(s) réponse(s) : lettre(s) « A » ou « A,C » · « Vrai »/« Faux » · pour QROC, réponses acceptées une par ligne</div><textarea id="fqA" style="min-height:44px">${esc(ansStr)}</textarea>
 <textarea id="fqE" placeholder="Explication" style="min-height:60px">${esc(q.exp||'')}</textarea>
 <div class="ed-grid2"><select id="fqS">${DATA.sources.map(s=>`<option value="${esc(s.id)}" ${q.src===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select><input id="fqP" type="number" placeholder="Page" value="${q.page==null?'':q.page}"></div>
 <div class="ed-row"><button class="ed-btn" id="fqOk">Enregistrer</button>${isNew?'':'<button class="ed-btn r" id="fqDel">Supprimer</button>'}<button class="ed-btn l" data-x>Annuler</button></div>`,()=>{
  edq('#fqOk').onclick=()=>{const t=edq('#fqType').value,o=edq('#fqO').value.split('\n').map(s=>s.trim()).filter(Boolean),a=edq('#fqA').value.trim();let ans;
   if(t==='saisie')ans=a.split('\n').map(s=>s.trim()).filter(Boolean);else if(t==='vf')ans=/^f/i.test(a)?1:0;else{const idx=a.toUpperCase().split(/[\s,;]+/).filter(Boolean).map(x=>L.indexOf(x)).filter(i=>i>=0&&i<o.length);if(!idx.length){alert('Indique la ou les bonnes réponses (A, B, …)');return}ans=t==='qcd'||idx.length>1?idx:idx[0]}
   if(!edq('#fqQ').value.trim()){alert('L’énoncé est vide');return}
   const nq=Object.assign({},q,{type:t,ch:edq('#fqCh').value,q:edq('#fqQ').value.trim(),options:t==='vf'||t==='saisie'?(t==='vf'?['Vrai','Faux']:[]):o,answer:ans,exp:edq('#fqE').value.trim(),src:edq('#fqS').value,page:edq('#fqP').value?+edq('#fqP').value:null});
   const sc=edq('#fqScen').value.trim();if(sc)nq.scen=sc;else delete nq.scen;
   const c=E.content;if(isNew||String(q.id).startsWith('n')){c.qAdd=(c.qAdd||[]).filter(x=>x.id!==nq.id).concat([nq])}else{c.q=c.q||{};c.q[q.id]=nq}
   commit(isNew?'Question ajoutée':'Question #'+q.id+' modifiée');closeModal();applyContent();render();panel('content')};
  const d=edq('#fqDel');if(d)d.onclick=()=>{if(!confirm('Supprimer cette question ?'))return;const c=E.content;if(String(q.id).startsWith('n'))c.qAdd=(c.qAdd||[]).filter(x=>x.id!==q.id);else{c.qDel=(c.qDel||[]).concat([q.id]);if(c.q)delete c.q[q.id]}commit('Question #'+q.id+' supprimée');closeModal();applyContent();render();panel('content')}})}
function pqForm(id){const P=DATA.prepa||{};const q0=(P.q||[]).concat(P.hors||[]).find(x=>String(x.id)===String(id));if(!q0)return;const q=clone(q0);const L='ABCDEFGH';
 const ansStr=q.answer==null?'':q.type==='ouv'?String(q.answer):q.type==='saisie'?(q.answer||[]).join('\n'):q.type==='vf'?(q.answer===0?'Vrai':'Faux'):(Array.isArray(q.answer)?q.answer:[q.answer]).map(i=>L[i]).join(',');

 <textarea id="pqE" placeholder="Explication (d’après le cours)" style="min-height:70px">${esc(q.exp||'')}</textarea>
 <div class="ed-grid2"><select id="pqS">${DATA.sources.map(s=>`<option value="${esc(s.id)}" ${q.src===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select><input id="pqP" type="number" placeholder="Page du cours" value="${q.page==null?'':q.page}"></div>
 ${q.why?`<div class="ed-note">Motif « hors cours » : ${esc(q.why)}</div>`:''}
 <div class="ed-row"><button class="ed-btn" id="pqOk">Enregistrer</button>${E.content.pq&&E.content.pq[q.id]?'<button class="ed-btn r" id="pqReset">Annuler mes modifs</button>':''}<button class="ed-btn l" data-x>Fermer</button></div>`,()=>{
  edq('#pqHors').onchange=()=>{};
  edq('#pqOk').onclick=()=>{const t=edq('#pqType').value,hors=edq('#pqHors').checked,a=edq('#pqA').value.trim();let o=edq('#pqO').value.split('\n').map(x=>x.trim()).filter(Boolean);let ans=null;
   if(t==='vf')o=['Vrai','Faux'];if(t==='saisie'||t==='ouv')o=[];
   if(!hors){if(t==='ouv'){if(!a){alert('Écris le corrigé modèle');return}ans=a}else if(t==='saisie'){ans=a.split('\n').map(x=>x.trim()).filter(Boolean);if(!ans.length){alert('Indique au moins une réponse acceptée');return}}
    else if(t==='vf'){if(!/^(v|f)/i.test(a)){alert('Écris « Vrai » ou « Faux »');return}ans=/^f/i.test(a)?1:0}
    else{if(o.length<2){alert('Au moins 2 propositions');return}const idx=a.toUpperCase().split(/[\s,;]+/).filter(Boolean).map(x=>L.indexOf(x)).filter(i=>i>=0&&i<o.length);if(!idx.length){alert('Indique la ou les bonnes réponses (A, B, …) ou coche « Laisser hors cours »');return}ans=t==='qcd'||idx.length>1?idx:idx[0]}}
   if(!edq('#pqQ').value.trim()){alert('L’énoncé est vide');return}
   const nq={type:t,q:edq('#pqQ').value.trim(),options:o,answer:hors?null:ans,exp:edq('#pqE').value.trim(),src:edq('#pqS').value,page:edq('#pqP').value?+edq('#pqP').value:null,hors:hors?1:0};
   const sc=edq('#pqScen').value.trim();nq.scen=sc||undefined;if(!hors&&(!q.ch||q.ch==='PX'))nq.ch='PX';
   E.content.pq=E.content.pq||{};E.content.pq[q.id]=nq;commit('Prépa Q'+q.num+(hors?' modifiée':' corrigée'));closeModal();applyContent();render();toast(hors?'Question enregistrée (hors cours)':'Question corrigée ✅ — ajoutée aux sujets')};
  const r=edq('#pqReset');if(r)r.onclick=()=>{if(!confirm('Revenir à la version d’origine ?'))return;delete E.content.pq[q.id];commit('Prépa Q'+q.num+' rétablie');closeModal();applyContent();render()}})}
function listEditor(box,key,fields,label){const arr=DATA[key];box.innerHTML=`<button class="ed-btn w" id="edLAdd">+ Ajouter</button>`+arr.map((g,i)=>`<div class="ed-item">${fields.map(f=>f[0]==='ch'?`<select class="ed-in" style="width:110px" data-i="${i}" data-f="ch">${DATA.chapters.map(c=>`<option value="${esc(c.id)}" ${g.ch===c.id?'selected':''}>${esc(c.short)}</option>`).join('')}</select>`:`<input class="ed-in" style="flex:${f[1]};min-width:90px" data-i="${i}" data-f="${f[0]}" value="${esc(g[f[0]])}" placeholder="${f[2]}">`).join('')}<button class="ed-btn sm r" data-del="${i}">🗑</button></div>`).join('');
 const put=a=>{E.content[key]=a;commit(label+' modifié');applyContent();render()};
 $$('[data-f]',box).forEach(x=>x.onchange=()=>{const a=clone(DATA[key]);a[+x.dataset.i][x.dataset.f]=x.value;put(a)});
 $$('[data-del]',box).forEach(x=>x.onclick=()=>{const a=clone(DATA[key]);a.splice(+x.dataset.del,1);put(a);panel('content')});
 edq('#edLAdd').onclick=()=>{const a=clone(DATA[key]);const n={ch:DATA.chapters[0].id};fields.forEach(f=>{if(f[0]!=='ch')n[f[0]]='…'});a.unshift(n);put(a);panel('content')}}
CBIND.glossary=box=>listEditor(box,'glossary',[['t',1,'Terme'],['d',3,'Définition'],['ch']],'Glossaire');
CBIND.numbers=box=>listEditor(box,'numbers',[['v',1,'Chiffre'],['l',3,'Signification'],['ch']],'Chiffres clés');

/* ---------- sauvegardes ---------- */
VIEWS.saves=()=>`<div class="ed-note">✅ Chaque modification est <b>enregistrée automatiquement sur cet appareil</b> : tu peux fermer et rouvrir le fichier sans rien exporter.</div>
 <div class="ed-h">Les 5 dernières modifications enregistrées</div>${HIST.length?HIST.map((h,i)=>`<div class="ed-item"><div class="gr"><b>${esc(h.label)}</b><br><small>${dfull(h.t)}${i===0?' · état actuel':''}</small></div>${i===0?'':`<button class="ed-btn sm" data-r="${i}">Restaurer</button>`}</div>`).join(''):'<div class="ed-note">Aucune modification pour l’instant.</div>'}
 <div class="ed-h">Enregistrer directement dans un fichier</div><div class="ed-note">Sur ordinateur (Chrome ou Edge), lie un fichier : chaque modification y sera écrite automatiquement, sans export.</div>
 ${'showSaveFilePicker' in window?`<button class="ed-btn w" id="edLink">${fileHandle?'🔗 Fichier lié : '+esc(fileHandle.name)+' (changer)':'🔗 Lier un fichier'}</button>`:'<div class="ed-note">Non disponible sur ce navigateur : utilise « Exporter ».</div>'}`;
BINDS.saves=b=>{$$('[data-r]',b).forEach(x=>x.onclick=()=>{const h=HIST[+x.dataset.r];if(!confirm('Restaurer l’état « '+h.label+' » du '+dfull(h.t)+' ?'))return;E=normE(clone(h.E));commit('Restauration : '+h.label);refresh(true);panel('saves');toast('État restauré ✅')});
 const l=edq('#edLink');if(l)l.onclick=async()=>{try{fileHandle=await window.showSaveFilePicker({suggestedName:APPID+'-finale.html',types:[{description:'Page HTML',accept:{'text/html':['.html']}}]});await writeFile();panel('saves');status()}catch(e){}}};
function scheduleFile(){if(!fileHandle)return;clearTimeout(fileTimer);fileTimer=setTimeout(writeFile,1200)}
async function writeFile(){if(!fileHandle)return;try{const w=await fileHandle.createWritable();await w.write(buildHTML(false));await w.close();toast('📁 Écrit dans '+fileHandle.name)}catch(e){toast('Impossible d’écrire dans le fichier lié');fileHandle=null;status()}}

function buildHTML(ro){const g=id=>{const e=document.getElementById(id);return e?e.textContent:''};
 const E2=clone(E);delete E2.base;E2.rev=Date.now();
 const links=$$('head link').map(l=>l.outerHTML).join('\n');const tc=($('meta[name=theme-color]')||{}).content||'#0B3B26';
 return '<!DOCTYPE html>\n<html lang="fr">\n<head>\n<meta charset="UTF-8">\n<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">\n<meta name="theme-color" content="'+esc(tc)+'">\n<title>'+esc(Tx('meta.title',META.title))+'</title>\n'+links+'\n<style id="app-css">'+g('app-css')+'</style>\n'+(ro?'':'<style id="ed-css">'+g('ed-css')+'</style>\n')+'</head>\n<body>\n'
 +'<script type="application/json" id="app-data">'+g('app-data')+SC+'\n'
 +'<script type="application/json" id="app-img">'+g('app-img')+SC+'\n'
 +'<script type="application/json" id="app-edits">'+JSON.stringify(E2).replace(/</g,'\\u003c')+SC+'\n'
 +'<script id="app-js">'+g('app-js')+SC+'\n'+(ro?'':'<script id="ed-js">'+g('ed-js')+SC+'\n')+'</body>\n</html>\n'}
window.PORTAIL_buildHTML=buildHTML;
VIEWS.export=()=>`<div class="ed-h">📦 Version finale</div><div class="ed-note">Fichier unique avec toutes tes modifications. Il reste modifiable (bouton ✏️) et peut être ré-exporté.</div><button class="ed-btn" id="edXF">Télécharger la version finale</button>
 <div class="ed-h">🔒 Version lecture seule</div><div class="ed-note">Pour les étudiants : mêmes contenus et réglages, mais <b>aucun élément d’édition</b> (pas de bouton ✏️, pas de panneau, code de l’éditeur retiré). La progression, le surligneur et les palettes du Profil restent disponibles.</div><button class="ed-btn" id="edXR">Télécharger la version lecture seule</button>
 <div class="ed-h">🧾 Modifications seules (JSON)</div><div class="ed-note">Petit fichier contenant uniquement tes modifications, à réimporter dans n’importe quelle version de cette appli.</div><div class="ed-row"><button class="ed-btn l" id="edXJ">Exporter les modifications</button><button class="ed-btn l" id="edXI">Importer des modifications</button></div>
 <div class="ed-h">♻️ Tout annuler</div><div class="ed-note">Revenir à l’état d’origine de ce fichier (l’état actuel reste dans les 5 sauvegardes).</div><button class="ed-btn r" id="edXZ">Revenir à l’original</button>`;
BINDS.export=b=>{edq('#edXF').onclick=()=>{download(APPID+'-finale.html',buildHTML(false),'text/html');toast('Version finale téléchargée')};
 edq('#edXR').onclick=()=>{download(APPID+'-lecture-seule.html',buildHTML(true),'text/html');toast('Version lecture seule téléchargée')};
 edq('#edXJ').onclick=()=>{const E2=clone(E);delete E2.base;download(APPID+'-modifications-'+today()+'.json',JSON.stringify(E2,null,1),'application/json')};
 edq('#edXI').onclick=()=>edq('#edImp').click();
 edq('#edXZ').onclick=()=>{if(!confirm('Revenir à l’état d’origine du fichier ?'))return;commit('Avant retour à l’original');E=normE(EMB);commit('Retour à l’original');refresh(true);panel('export')}};

window.PORTAIL_EDITOR={init,decorate,setEdit,panel,commit,buildHTML,pqForm};
