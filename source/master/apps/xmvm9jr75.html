oce ; les nodules ou onchocercome et les lésions oculaires à un stade tardif.<\/p>\n<p><b>3.1.1. Diagnostic clinique — 3.1.1.1 Signes cutanéo-dermiques de l'onchocercose<\/b><\/p>\n<ul><li>Démangeaisons ou prurit rebelle au traitement antihistaminique habituel. Ce prurit a un caractère permanent ;<\/li><li>Eruption cutanée (gale filarienne) ;<\/li><li>Dépigmentation de la peau (peau de léopard) ;<\/li><li>Epaississement de la peau (peau de lézard) ;<\/li><li>Peau très sèche ou ridée au niveau de l'aine ;<\/li><\/ul>","imgs":[]},{"ch":"N1","src":"O","page":44,"html":"<p><i>Gale filarienne — Peau lézard — Peau de léopard<\/i><\/p>\n<p><b>3.1.1.2 Signes oculaires de l'onchocercose<\/b><\/p>\n<p>Contrairement aux atteintes cutanéo-dermiques, les atteintes oculaires sont tardives et graves.<\/p>\n<p>Les atteintes oculaires les plus fréquentes sont :<\/p>\n<ul><li>les prurits oculaires<\/li><li>la rougeur<\/li><li>l'irritation et/ ou larmoiement<\/li><li>les kératites (inflammation de la cornée)<\/li><li>les iridocyclites (inflammation du corps ciliaire)<\/li><li>les choriorétinites (inflammation de la choroïde et de la rétine)<\/li><\/ul>\n<p><b>3.1.2. Diagnostic paraclinique<\/b><\/p>\n<p><b>Biopsie cutanée exsangue<\/b><\/p>\n<p>On diagnostique l'onchocercose chez un individu par le test de Snip. Il s'agit de faire une biopsie cutanée exsangue au niveau des crêtes iliaques. L'échantillon de peau est mis sur une lame cerclée dans quelques gouttes d'eau distillée et examiné au microscope. Si les microfilaires sont évidentes, le test est positif, on procède alors au comptage des microfilaires. Si les microfilaires ne sont pas évidents, l'échantillon est réexaminé 24h après.<\/p>\n<p>Cette biopsie permet d'apprécier l'importance de l'infestation (charge parasitaire)<\/p>","imgs":["O_p044_0"]},{"ch":"N1","src":"O","page":45,"html":"<ul><li>charge faible : 0-10 microfilaires<\/li><li>charge moyenne : 11-50 microfilaires<\/li><li>charge forte : > 50 microfilaires.<\/li><\/ul>\n<p><b>Diagnostic immunologique<\/b><\/p>\n<p>OV 16 : il consiste à prélever une goutte de sang à la pulpe du doigt par piqûre avec une lancette. Cette goutte de sang est déposée dans la zone de migration du test et la lecture se fait 20 minutes après le dépôt de la goutte de sang.<\/p>\n<p><b>3.2. Diagnostic différentiel<\/b><\/p>\n<ul><li>Au niveau cutanéo-dermique, il ne faut pas confondre la gale filarienne avec : la gale sarcoptique ; le prurigo par piqure d'insecte<\/li><li>Au niveau oculaire : la limboconjonctivite ; l'uvéite antérieure.<\/li><\/ul>\n<p><b>3.3 Complications<\/b><\/p>\n<p>Elles surviennent en absence de traitement et peuvent apparaitre au bout de 10 à 15 ans voire plus. Ce sont notamment :<\/p>\n<ul><li>Baisse de l'acuité visuelle<\/li><li>Gêne à la lumière<\/li><li>Kératite sclérosante (Opacité de la cornée)<\/li><li>Baisse de la vision crépusculaire<\/li><li>Diminution du champ visuel<\/li><li>Cécité irréversible<\/li><li>Eléphantiasis des membres supérieurs et inférieurs ;<\/li><li>Hydrocèle ;<\/li><li>Nodules onchocerquiens.<\/li><\/ul>\n<p><i>Eléphantiasis — Hydrocèle<\/i><\/p>","imgs":["O_p045_0"]},{"ch":"N1","src":"O","page":46,"html":"<p><i>Cécité irréversible — kératite sclérosante — Nodules onchocerquiens indolores (due à la présence des filaires qu'on peut palper)<\/i><\/p>\n<h4>IV. CAT devant l'onchocercose<\/h4>\n<p>Devant les signes cliniques cutanéo-dermiques et les signes oculaires en faveur de l'onchocercose, il faut référer le patient chez les spécialistes. La prise en charge est basée sur l'administration d'Ivermectine (Mectizan®) et la lutte anti vectorielle.<\/p>\n<p>Les complications oculaires bénéficient d'une prise en charge des spécialistes en ophtalmologie.<\/p>\n<p>Sans traitement, l'onchocercose aboutit à la cécité irréversible.<\/p>\n<h4>V- Impact psychologique et socio-économique<\/h4>\n<p>L'onchocercose est une pathologie potentiellement <b>invalidante<\/b> du fait des complications induisant la réduction des mouvements et des déplacements tels que l'éléphantiasis et la cécité. Il a un impact psychologique et socioéconomique important sur les populations. Au plan psychologique, c'est une affection débilitante et stigmatisante parce qu'elle est considérée à tort par certaines populations comme un mauvais sort ou une punition divine.<\/p>\n<p>L'endémicité de l'onchocercose provoque la <b>désertion des populations<\/b> vivant dans les vallées fertiles ; ce qui entraine une <b>baisse de la productivité<\/b> et <b>l'appauvrissement<\/b> des populations. La société<\/p>","imgs":["O_p046_0"]},{"ch":"N1","src":"O","page":47,"html":"<p>et les communautés paient un lourd tribut du fait de la cécité engendrée par l'onchocercose. Il constitue de ce fait un réel problème de Santé Publique qu'il faut absolument combattre et éliminer.<\/p>\n<h4>Conclusion<\/h4>\n<p>L'onchocercose est une pathologie cutanéo-dermique potentiellement cécitante qui n'est pas encore éliminé dans notre pays. Des poches résiduelles existent dans plusieurs localités de nos régions.<\/p>\n<p>Au regard des complications liées à cette pathologie, une synergie d'actions des différents acteurs de santé s'avère indispensable pour appuyer et soutenir l'Etat de Côte d'Ivoire dans ses efforts de contrôle et d'élimination de l'onchocercose. Ces actions doivent prendre en compte la sensibilisation et la mobilisation sociale, le dépistage et la prise en charge efficace et efficiente de cette pathologie. Les actions de lutte contre l'onchocercose et son élimination font partie intégrante des actions du Programme MTN-CP de Côte d'Ivoire. Dans cette perspective, les agents techniques de santé (infirmiers(ères), sages-femmes, techniciens biologistes, pharmaciens, etc.) doivent être à l'avant-garde de la lutte contre l'onchocercose.<\/p>","imgs":[]},{"ch":"N2","src":"O","page":48,"html":"<h4>Trachome<\/h4>\n<p><b>Plan du cours<\/b> : Introduction ; I. Définition ; II. Diagnostic ; III. Impact psychologique et socio-économique ; Conclusion.<\/p>\n<h4>Introduction<\/h4>\n<p>Le trachome fait partie des maladies tropicales négligées à Chimiothérapie Préventive (MTN-CP). Il est responsable de déficience visuelle et constitue la première cause de cécité dans les pays à faible revenu et où les populations vivent dans des milieux socioéconomiques précaires. Avec la dynamique de développement et l'amélioration des conditions de vie des populations, le trachome a été considéré comme une pathologie maîtrisée, voire éliminée. Cependant la cartographe montre une réalité différente. Cette pathologie sévit encore dans certaines localités de notre pays, la Côte d'Ivoire.<\/p>\n<p><b>Objectif général<\/b> : Assurer la prise en charge de tout patient souffrant de trachome<\/p>\n<p><b>Objectifs spécifiques<\/b> : définir le trachome ; expliquer l'épidémiologie du trachome ; poser le diagnostic du trachome ; expliquer l'impact psychosociale.<\/p>\n<h4>I. Définition<\/h4>\n<p>Le trachome est une maladie infectieuse de l'œil provoquée par une bactérie appelée <i>Chlamydia trachomatis<\/i>.<\/p>","imgs":[]},{"ch":"N2","src":"O","page":49,"html":"<h4>II- Diagnostics<\/h4>\n<p><b>2.1 Diagnostic positif<\/b><\/p>\n<p>Le diagnostic positif du trachome est habituellement clinique. Mais, le diagnostic biologique est parfois associé puisqu'il est devenu beaucoup plus simple et plus fiable.<\/p>\n<p><b>2.1.1 Diagnostic clinique<\/b><\/p>\n<p>Le diagnostic clinique du trachome actif repose sur les signes caractéristiques qui sont la présence des follicules et des papilles sur la conjonctive tarsale supérieure.<\/p>\n<p>Le trachome inactif ou ancien se traduit habituellement par l'un des signes suivants : entropion ou trichiasis de la paupière supérieure, lésions cicatricielles au niveau de la conjonctive tarsale supérieure.<\/p>\n<p><b>Formes cliniques<\/b><\/p>\n<p>L'OMS a mis au point un système simplifié de classification pour reconnaître les signes du trachome. La description clinique se présente comme suit :<\/p>\n<p><b>1) TF : Trachome Folliculaire<\/b><\/p>\n<p>C'est le stade de début du trachome. Il est très fréquent chez les enfants surtout de 0 à 10 ans qui constituent le réservoir de l'infection. Les enfants qui en souffrent ont le plus souvent les yeux rouges, collants et des démangeaisons. Pour dépister le trachome, il faut retourner la paupière supérieure pour rechercher les follicules.<\/p>\n<p>On dit qu'une personne est atteinte de trachome, lorsqu'on note la présence d'au moins cinq follicules de 0,5 mm à 2 mm de diamètre sur la conjonctive tarsienne supérieure.<\/p>","imgs":["O_p049_0"]},{"ch":"N2","src":"O","page":50,"html":"<p><b>2) TI : Inflammation trachomateuse Intense<\/b><\/p>\n<p>Epaississement inflammatoire prononcé de la conjonctive tarsienne supérieure qui masque plus de la moitié des vaisseaux profonds du tarse.<\/p>\n<p><b>3) TS : Trachome Cicatriciel<\/b><\/p>\n<p>Présence de lésions cicatricielle linéaire, stellaire et diffuse sur la conjonctive tarsale. Cela s'observe généralement après des infections répétées.<\/p>\n<p><b>4) TT : Trichiasis trachomateux<\/b><\/p>\n<p>Les cicatrices déforment la paupière et les cils sont alors déviés vers le globe oculaire et commencent à frotter sur la cornée. Au moins, un cil frotte sur le globe ou il existe des traces d'épilation associé à la présence de cicatrice à l'éversion de la paupière.<\/p>\n<p><b>5) CO : Opacité cornéenne évidente recouvrant l'aire pupillaire.<\/b><\/p>\n<p>Présence d'une opacité cornéenne affectant l'axe visuel. La pupille est difficile ou impossible à voir à travers l'opacité.<\/p>","imgs":["O_p050_0","O_p050_1","O_p050_2","O_p050_3"]},{"ch":"N2","src":"O","page":51,"html":"<p><b>NB<\/b> : Sans traitement, le trachome évolue vers des complications à type d'opacité cornéenne et de cécité. Sous traitement, la maladie évolue favorablement selon les stades.<\/p>\n<p><b>2.1.2 Diagnostic paraclinique<\/b><\/p>\n<p>Le chlamydia trachomatis peut être isolé en culture ou par des tests d'amplification des acides nucléiques (NAAT) et des techniques d'immunoflorescence. Le test couramment utilisé est le <i>Microtrak<\/i>. Il permet de détecter l'antigène de Chlamydia par immunofluorescence. <i>Chlamydiasine<\/i> est aussi un autre test qui permet de détecter les anticorps dirigés contre Chlamydia par la méthode Elisa.<\/p>\n<p>D'autres tests plus sophistiqués utilisant la PCR (Réaction en la chaine par polymérase) et l'immunoblotting sont désormais disponibles.<\/p>\n<p><b>2.2 Diagnostic différentiel<\/b><\/p>\n<p>Il ne faut pas confondre le trachome avec :<\/p>\n<ul><li>la kérato-conjonctivite épidémique, qui est une infection à adénovirus responsable de kératite ponctuée superficielle sur la surface de la cornée.<\/li><li>la limbo-conjonctivite endémique des tropiques qui est une conjonctivite chronique avec prurits intenses.<\/li><\/ul>\n<h4>III- Impact socioéconomique du trachome<\/h4>\n<p>Le trachome a un impact psychologique et socioéconomique important sur les populations. Au plan psychologique, c'est une affection stigmatisante parce qu'elle rime avec la pauvreté et la misère. En effet, il frappe avant tout les populations rurales pauvres qui ont précisément tendance à être négligées sur le plan aussi bien économique que social. Sa prévalence au sein des populations infantiles de 0 à 5 ans et des femmes est très élevée. La société et les communautés paient un lourd tribut du fait du coût du traitement et de la cécité engendrée par le trachome. Il constitue de ce fait un réel problème de Santé Publique qu'il faut absolument combattre et éliminer.<\/p>","imgs":[]},{"ch":"N2","src":"O","page":52,"html":"<h4>Conclusion<\/h4>\n<p>Le trachome reste la principale cause de cécité évitable dans le monde. Au-delà du facteur individuel, les facteurs communautaires et environnementaux sont fortement impliqués dans la prévalence et l'endémicité du trachome. Cette réalité en appelle à la responsabilité de tous en matière d'hygiène individuelle et environnementale. Elle en appelle aussi à l'engagement communautaire afin de faciliter l'appropriation et la mise en œuvre du programme de lutte contre le trachome dont les complications entrainent une cécité irréversible.<\/p>","imgs":[]},{"ch":"T1","src":"O","page":53,"html":"<h4>Chapitre VI : Les traumatismes oculaires<\/h4>\n<p><b>Objectifs<\/b> — Définir les traumatismes ; Décrire les différents types de traumatismes ; Décrire la conduite à tenir devant chaque type de traumatisme ; Décrire les caractéristiques du lavage en cas de brûlures chimiques.<\/p>\n<h4>Introduction<\/h4>\n<p>C'est l'ensemble des agressions extérieures qui affectent l'œil.<\/p>\n<p>Les traumatismes du globe oculaire constituent une urgence. Leur prise en charge requiert des gestes précis dont le but est de sauvegarder la fonction visuelle.<\/p>\n<p>On distingue différents types de traumatismes : les traumatismes à globe fermé ou contusions ; les traumatismes à globe ouvert ; les brûlures oculaires.<\/p>\n<h4>I- Contusions ou traumatismes à globe fermé<\/h4>\n<p>Ce sont les traumatismes du globe oculaire au cours desquels le patient ressent une vive douleur plus ou moins persistante selon l'importance du choc. Ces traumatismes n'occasionnent pas de plaies. Mais, le patient révèle qu'au moment du choc, il a vu « des étoiles » ou des « chandelles » ou encore des « flashs. » Comme agent contondant, il peut s'agir de : coup de poing, bouchon de champagne, caillou, balle de tennis, coup de matraque, etc.<\/p>\n<p>Plusieurs cas de figures peuvent se présenter :<\/p>\n<p><b>Une atteinte au niveau de la conjonctive<\/b> (beaucoup plus fréquente) caractérisée par une rougeur hématique du « blanc de l'œil » : c'est l'hémorragie sous conjonctivale.<\/p>\n<p>CAT : faire l'AV du patient ; rechercher les lésions ; hospitaliser le patient si nécessaire<\/p>","imgs":[]},{"ch":"T1","src":"O","page":54,"html":"<ul><li>administrer des collyres antiseptiques ou anti-inflammatoires (ex : Désomédine, Indocollyre, Dicloced...)<\/li><li>Demander au patient de boire beaucoup de litres d'eau par jour en cas d'hémorragie sous conjonctivale.<\/li><\/ul>\n<p><b>NB<\/b> : Face à une hémorragie sous-conjonctivale persistante, il faut référer le patient en ophtalmologie<\/p>\n<p><b>Une atteinte au niveau de la cornée<\/b> : il s'agit d'une érosion cornéenne. Dans ce cas le patient se plaint de douleurs importantes avec photophobie<\/p>\n<p>CAT : faire l'AV ; collyre cicatrisant ; collyre antibiotique<\/p>\n<p><b>Au niveau de la chambre antérieure<\/b> : On peut avoir :<\/p>\n<ul><li>un hyphéma (épanchement de sang dans la chambre antérieure)<\/li><li>une hypertonie oculaire c'est-à-dire que le globe oculaire devient dur au palper bidigital.<\/li><\/ul>\n<p>CAT : c'est une urgence ophtalmologique — il faut mesurer l'acuité visuelle ; faire une injection d'anti-hémorragique (vit k1) puis évacuer le patient vers un service d'ophtalmologie.<\/p>\n<p><b>Les atteintes au niveau de l'iris, du cristallin et du segment postérieur<\/b> sont caractérisées par une baisse importante de l'acuité visuelle, brutale ou progressive<\/p>\n<p>CAT : il faut mesurer l'acuité visuelle ; il faut référer le patient au spécialiste ophtalmologiste.<\/p>\n<h4>II- Traumatismes à globe ouvert<\/h4>\n<p>Ce sont les traumatismes qui provoquent les plaies du globe oculaire.<\/p>\n<p><b>1. Plaies pénétrantes sans corps étrangers<\/b><\/p>\n<p>Les lésions siègent en général sur le segment antérieur (constitué par les paupières, les conjonctives, la cornée et la sclère).<\/p>\n<p>Ces lésions peuvent aussi intéresser toutes les membranes (tuniques) du globe oculaire.<\/p>\n<p>CAT : faire l'acuité visuelle ; instituer une antibiothérapie locale et générale<\/p>","imgs":[]},{"ch":"T1","src":"O","page":55,"html":"<ul><li>évacuer le patient chez l'ophtalmologiste qui entreprendra un traitement exclusivement chirurgical. Ce geste permet d'éviter une endophtalmie, puis, une panophtalmie.<\/li><\/ul>\n<p><b>2. Plaies pénétrantes avec corps étrangers<\/b><\/p>\n<p>Le corps étranger pénétrant dans le globe oculaire peut provoquer de graves lésions intraoculaires.<\/p>\n<p>Quel que soit le type du corps étranger (verre, débris métallique ou de pierre ou de bois), les soins de première intention sont extrêmement importants. Ces soins peuvent non seulement permettre de guérir, mais surtout prévenir les complications graves notamment infectieuses (endophtalmie, voire une panophtalmie).<\/p>\n<p>CAT : Adresser urgemment le patient en ophtalmologie. Cette évacuation se fera sous pansement occlusif de l'œil avec :<\/p>\n<ul><li>antibiotique collyre ou en pommade<\/li><li>atropine collyre<\/li><li>antibiotique par voie générale<\/li><li>si le patient n'est pas vacciné contre le tétanos, il faut lui faire le (Sérum Anti Tétanique)<\/li><\/ul>\n<p>Les différents soins administrés doivent être marqués sur la feuille d'évacuation.<\/p>\n<h4>III- Les brûlures oculaires<\/h4>\n<p>C'est l'ensemble des brûlures provoquées par la chaleur sous toutes ses formes. On distingue :<\/p>\n<p><b>1. Les brûlures par agents thermiques<\/b><\/p>\n<p>Ce sont : la flamme, les brûlures par liquide ou métaux en ébullition, les brûlures électriques.<\/p>\n<p>Ces brûlures touchent généralement les paupières, les conjonctives, la cornée et les voies lacrymales.<\/p>\n<p>CAT : Faire l'AV ; il faut administrer localement : un ATB+ ATI collyre et pommade ; un cicatrisant collyre ; faire un pansement occlusif et référer le blessé en ophtalmologie d'urgence.<\/p>","imgs":[]},{"ch":"T1","src":"O","page":56,"html":"<p><b>2. Les brûlures par agents chimiques<\/b><\/p>\n<p>Ce sont des brûlures causées par des agents caustiques. Elles entraînent des lésions cornéennes et sclérales très graves et une atteinte des culs-de-sac conjonctivaux. Les substances mises en cause sont :<\/p>\n<p><b>a) les acides<\/b> : acide chlorhydrique ; Acide nitrique ; Acide sulfurique contenu dans certains produits cosmétiques ; Le crachat de serpent (venin). Il s'agit le plus souvent de la projection dans les yeux du venin du serpent Naja. C'est une substance qui provoque des douleurs intenses à type de brûlure, des blépharospasmes avec des paupières oedématiées ou des ecchymoses. C'est une urgence ophtalmologique.<\/p>\n<p><b>b) les bases<\/b> : La soude ; La chaux-vive (oxyde de calcium : elle réagit violemment avec l'eau, en produisant de la chaleur.<\/p>\n<p><b>Le phosphore<\/b> ; L'hypochlorite de sodium (NaOCl) : eau de javel ; L'ammoniac contenu dans les engrais.<\/p>\n<h4>IV- Conduite à tenir<\/h4>\n<p><b>1. Sur le lieu de l'accident<\/b><\/p>\n<p>Le lavage est le geste primordial à faire. C'est l'arme (le moyen) principal. Mais pour que ce lavage soit efficace, il doit être : précoce ; abondant ; profond ; minutieux ; prolongé (lavage oculaire de 30 mn au moins)<\/p>\n<p>Après le lavage, il faut faire l'acuité visuelle puis évacuer d'urgence le patient en ophtalmologie.<\/p>\n<p><b>NB : Il existe cependant deux exceptions au lavage : le phosphore et la chaux vive<\/b> : ils doivent plutôt être enlevés à l'aide d'un coton-tige ou d'un tampon vaseliné. Car le lavage de ces deux produits augmente leur toxicité (pouvoir de destruction).<\/p>","imgs":[]},{"ch":"T1","src":"O","page":57,"html":"<p><b>2. En ophtalmologie<\/b><\/p>\n<p>Le traitement proprement dit porte sur :<\/p>\n<ul><li>l'administration locale de collyre antibiotique + anti-inflammatoire après un second lavage et bilan des lésions<\/li><li>Antibiotique + Anti-inflammatoire par voie générale<\/li><li>Collyre atropine<\/li><li>Cicatrisant collyre<\/li><li>Hospitaliser le patient pour une surveillance médicale adéquate.<\/li><\/ul>\n<h4>V. Prévention<\/h4>\n<ul><li>Port de lunettes ou de masque de protection obligatoire pour les professionnels exposés à des situations de risque. Il s'agit par exemple des peintres, des soudeurs, des ferronniers et des ouvriers de l'industrie.<\/li>\n<li>Les industriels doivent mettre en place dans leurs usines ou unités de fabrication, des fontaines de lavage. Ils doivent s'assurer que leurs employés sont informés des situations à risque auxquelles ils peuvent s'exposer.<\/li>\n<li>Ne pas laisser les enfants jouer avec des objets pointus tels que les pointes, les bâtons, les couteaux, les fléchettes etc.<\/li>\n<li>Ne pas laisser les enfants et les adolescents allumer les feux d'artifices.<\/li>\n<li>Ranger les produits chimiques hors de la portée des enfants. Il s'agit des produits cosmétiques, des insecticides, des pesticides, etc.<\/li><\/ul>","imgs":[]},{"ch":"M1","src":"O","page":58,"html":"<h4>Chapitre VII : Médicaments ophtalmiques<\/h4>\n<p><b>Objectifs<\/b> — Définir le collyre et la pommade ophtalmique ; Citer selon le cours, les différents types de collyres et pommades ophtalmiques ; Décrire les techniques d'instillation des collyres et pommades.<\/p>\n<h4>I- Les collyres<\/h4>\n<p><b>1. Définition<\/b><\/p>\n<p>Ce sont des solutions médicamenteuses (aqueuses ou huileuses) stériles contenant un ou plusieurs principes actifs destinées à être instillées dans les yeux. Elles ont une action immédiate et maximale surtout au niveau de la conjonctive avant de pénétrer les autres éléments du segment antérieur.<\/p>\n<p><b>2. Principaux collyres<\/b><\/p>\n<p>On distingue plusieurs types de collyres selon leur famille thérapeutique. Les principaux collyres utilisés sont :<\/p>\n<p><b>a) les collyres mydriatiques<\/b> : Ils servent à provoquer la mydriase c'est-à-dire à dilater la pupille. Ex : mydriaticum, atropine, néosynéphrine.<\/p>\n<p><b>b) les collyres myotiques<\/b> : Ils servent à provoquer le myosis c'est-à-dire à resserrer la pupille. Ex : pilocarpine.<\/p>\n<p><b>c) les anesthésiques<\/b> : Ce sont des anesthésiques de contact qui permettent d'anesthésier la surface oculaire, notamment la cornée. Ce qui permet de pratiquer l'examen de la tonométrie à l'aplanation, l'extraction des corps étrangers, la petite chirurgie et l'examen du fond d'œil à 3 miroirs. Ex : cébésine<\/p>","imgs":[]},{"ch":"M1","src":"O","page":59,"html":"<p><b>d) les antiseptiques<\/b> : Ils sont utilisés dans toutes les affections conjonctivales et cornéennes. Par exemple : au cours des irritations conjonctivales dues à la fatigue oculaire provoquée par le vent, le soleil, la poussière, la fumée, la lumière naturelle ou artificielle etc. ; pour la désinfection de la cavité conjonctivale et des voies lacrymales. Exemple : Désomédine, Vitabact, Dacryosérum etc…<\/p>\n<p><b>e) les collyres antibiotiques<\/b> : Ce sont les médicaments les plus utilisés dans les affections oculaires aiguës d'origine bactérienne. Ils ont pour la plupart un large spectre et sont indiqués dans les cas de : conjonctivites aiguës, kératites, blépharites, dacryocystites, soins post-opératoire etc... Ex : okacin, chibroxine, gentalline, rifamycine, ciloxan<\/p>\n<p><b>f) les collyres anti-inflammatoires<\/b> : ils ont une action anti-inflammatoire. Ils sont généralement utilisés dans les cas de traumatismes du segment antérieur et en post opératoire. Exemple : indocollyre, indosol, Dicloced etc...<\/p>\n<p><b>g) les collyres anti-histaminiques<\/b> : Ils sont utilisés dans les conjonctivites allergiques. Ex : Cromsol, Naaxia, Cromoptic, Levophta, Almide<\/p>\n<p><b>h) les collyres cicatrisants cornéens<\/b> : Ils sont utilisés dans les pathologies de la cornée (ulcère cornéen, brûlures oculaires). Ex : Vitamine B12 collyre, Vitamine A collyre, Vitamine A pommade, corneregel, etc.<\/p>\n<p><b>i) les collyres corticoïdes<\/b> : Ils ont des propriétés anti-inflammatoires et anti-allergiques. Ils sont parfois associés à des antibiotiques. Ils sont très efficaces notamment dans les conjonctivites et les iridocyclites. Mais, leur prescription relève<\/p>","imgs":[]},{"ch":"M1","src":"O","page":60,"html":"<p>du spécialiste à cause de leur action destructrice de la cornée en cas de conjonctivite virale et surtout herpétique. Ex : chibrocadron, frakidex, tobradex, vexol, etc.<\/p>\n<p><b>NB<\/b> : Ne jamais utiliser un collyre sans vérifier sa propriété et son indication.<\/p>\n<p>Ne jamais prescrire un collyre contenant du corticoïde tant que le diagnostic d'herpès n'est pas éliminé.<\/p>\n<p><b>3. Durée de conservation des collyres<\/b><\/p>\n<p>Dès que le flacon est ouvert, le collyre a une durée de conservation très limitée. Cette durée est de 15 jours. Au-delà de 15 jours le collyre est exposé au risque de : dégradation et diminution du principe actif ; d'oxydation ; de souillure du compte – goutte par les germes ambiants<\/p>\n<p>Cependant il existe de nos jours des collyres qui ont une durée exceptionnelle de 30 jours après la date d'ouverture. D'où, l'intérêt de lire impérativement la notice de chaque collyre pour en savoir la durée de conservation.<\/p>\n<p><b>NB<\/b> : l'usage du collyre est strictement personnel. Il ne doit en aucun cas être utilisé à deux ou à plusieurs.<\/p>\n<h4>II- Les pommades<\/h4>\n<p><b>1- Définition<\/b><\/p>\n<p>Les pommades ophtalmologiques : ce sont des médicaments qui se présentent sous forme de tube de 5g ou 10g ou sous forme uni-dose.<\/p>\n<p>Elles ont les mêmes propriétés que les collyres, mais elles ont pour avantage d'agir plus longtemps car leur élimination par les larmes est moins rapide.<\/p>\n<p><b>2. Indications<\/b><\/p>\n<p>Les pommades sont utilisées en complément des collyres surtout le soir au coucher. Ce sont essentiellement des antibiotiques et des corticoïdes.<\/p>","imgs":[]},{"ch":"M1","src":"O","page":61,"html":"<p><b>3. Technique d'application de la pommade<\/b><\/p>\n<p>On utilise la même technique que celle de l'instillation des collyres.<\/p>\n<p>Pour la présentation en tube, on laisse tomber une quantité égale à la taille d'un grain de riz dans le cul-de-sac inférieur de la paupière.<\/p>\n<p>Pour la présentation unidose, on presse et on laisse tomber tout le contenu dans le cul-de-sac inférieur de la paupière, puis le patient ferme l'œil.<\/p>\n<p><b>Remarque<\/b> : le tampon de coton n'est pas recommandé pour essuyer l'excès de pommade parce que les fibres de coton adhèrent facilement aux cils. Il faut plutôt utiliser la compresse.<\/p>\n<p>Exemple de pommades : Cébémyxine pommade; Tobrex pommade; Fucithalmic gel; Frakidex pommade; Sterdex pommade; Vitamine A pommade ophtalmique etc…<\/p>","imgs":[]}],"images":[{"id":"O_p003_0","src":"O","page":3,"cap":"Figure 1 : coupe du globe oculaire","w":830,"h":636,"ch":"A1"},{"id":"O_p007_0","src":"O","page":7,"cap":"L'appareil lacrymal et la circulation du liquide lacrymal","w":824,"h":663,"ch":"A1"},{"id":"O_p007_1","src":"O","page":7,"cap":"Insertion des muscles oculomoteurs sur le globe oculaire","w":651,"h":547,"ch":"A1"},{"id":"O_p009_0","src":"O","page":9,"cap":"Échelles de Snellen, de Monoyer et de Pigassou","w":966,"h":547,"ch":"A2"},{"id":"O_p010_0","src":"O","page":10,"cap":"Échelle de Parinaud (AV de près)","w":370,"h":466,"ch":"A2"},{"id":"O_p013_0","src":"O","page":13,"cap":"Myopie : image en avant de la rétine, corrigée par un verre divergent","w":329,"h":272,"ch":"P1"},{"id":"O_p014_0","src":"O","page":14,"cap":"Hypermétropie : image en arrière de la rétine, corrigée par un verre convergent","w":337,"h":246,"ch":"P1"},{"id":"O_p017_0","src":"O","page":17,"cap":"Conjonctivite bactérienne","w":760,"h":231,"ch":"P2"},{"id":"O_p017_1","src":"O","page":17,"cap":"Hémorragie sous-conjonctivale en nappe","w":488,"h":248,"ch":"P2"},{"id":"O_p024_0","src":"O","page":24,"cap":"Mesure du tonus oculaire : aplanation et palper bidigital","w":979,"h":417,"ch":"P4"},{"id":"O_p024_1","src":"O","page":24,"cap":"Fond d'œil normal et papille du glaucome chronique","w":946,"h":333,"ch":"P4"},{"id":"O_p028_0","src":"O","page":28,"cap":"Chalazion","w":1001,"h":260,"ch":"P6"},{"id":"O_p029_0","src":"O","page":29,"cap":"Orgelet","w":391,"h":202,"ch":"P6"},{"id":"O_p035_0","src":"O","page":35,"cap":"Cataracte congénitale bilatérale","w":500,"h":279,"ch":"E3"},{"id":"O_p044_0","src":"O","page":44,"cap":"Onchocercose : gale filarie "La sclère (sclérotique) est la membrane la plus externe et recouvre les 4/5 postérieurs du globe.","snip":"C'est la membrane (tunique) la plus externe recouvrant 4/5 postérieur du globe oculaire","src":"O","id":3},{"ch":"A1","page":4,"type":"vf","q":"La partie postérieure de la sclère confère au globe oculaire sa couleur blanche.","options":["Vrai","Faux"],"answer":0,"exp":"Fibreuse, épaisse, résistante et opaque, c'est elle qui donne la couleur blanche à l'œil.","snip":"C'est elle qui confère au globe oculaire sa couleur blanche","src":"O","id":4},{"ch":"A1","page":4,"type":"qcd","q":"Quels sont les rôles de la sclère ?","options":["Sécréter l'humeur aqueuse","Protéger les structures intraoculaires","Résister aux forces expansives de la pression intraoculaire","Limiter la forme et la taille de l'œil au cours de son développement"],"answer":[1,2,3],"exp":"L'humeur aqueuse est sécrétée par les procès ciliaires, pas par la sclère.","snip":"limiter la forme et la taille de l'œil au cours de son développement","src":"O","id":5},{"ch":"A1","page":4,"type":"qcm","q":"Comment appelle-t-on la zone de jonction entre la cornée et la sclère ?","options":["Le fornix","L'angle irido-cornéen","Le limbe scléro-cornéen","La papille"],"answer":2,"exp":"La jonction cornée-sclère est le limbe scléro-cornéen.","snip":"La zone de jonction de la cornée et la sclère est appelée le Limbe scléro-cornéen","src":"O","id":6},{"ch":"A1","page":4,"type":"qcm","q":"La cornée est enchâssée dans l'ouverture antérieure de la sclère comme :","options":["un bouchon","une lentille de contact","un verre de montre","un anneau brisé"],"answer":2,"exp":"Le cours compare la cornée à un verre de montre enchâssé dans la sclère.","snip":"enchâssée comme un verre de montre dans l'ouverture antérieure de la sclère","src":"O","id":7},{"ch":"A1","page":4,"type":"qcm","q":"D'avant en arrière, quelle est la couche de la cornée située entre la membrane de Bowman et la membrane de Descemet ?","options":["Le stroma","Le trabéculum","L'épithélium","L'endothélium"],"answer":0,"exp":"Ordre : épithélium, membrane de Bowman, stroma, membrane de Descemet, endothélium.","snip":"la membrane de Bowman ; le stroma ; la membrane de Descemet","src":"O","id":8},{"ch":"A1","page":4,"type":"saisie","q":"Quelle est la couche la plus postérieure (la plus profonde) de la cornée ?","options":[],"answer":["endothélium","l'endothélium","l endothélium"],"exp":"La cornée se termine en arrière par l'endothélium.","snip":"la membrane de Descemet ; l'endothélium","src":"O","id":9},{"ch":"A1","page":4,"type":"qcm","q":"L'uvée est une membrane :","options":["muqueuse","fibreuse","neurosensorielle","vasculaire"],"answer":3,"exp":"L'uvée est la membrane vasculaire (choroïde, corps ciliaire, iris).","snip":"C'est une membrane vasculaire composée de trois parties","src":"O","id":10},{"ch":"A1","page":4,"type":"qcd","q":"Quelles structures font partie de l'uvée ?","options":["La choroïde","La cornée","Le corps ciliaire","L'iris"],"answer":[0,2,3],"exp":"L'uvée comprend la choroïde (en arrière), le corps ciliaire (milieu) et l'iris (en avant).","snip":"la partie moyenne renflée forme le corps ciliaire","src":"O","id":11},{"ch":"A1","page":4,"type":"qcm","q":"Comment s'appelle l'orifice central de l'iris ?","options":["La papille","Le limbe","La pupille","La macula"],"answer":2,"exp":"L'iris est perforé en son centre d'un orifice appelé la pupille.","snip":"l'iris qui est perforé en son centre d'un orifice appelé la pupille","src":"O","id":12},{"ch":"A1","page":5,"type":"qcm","q":"Quelle est la membrane neurosensorielle de la vision ?","options":["La sclère","La conjonctive","La rétine","La choroïde"],"answer":2,"exp":"La rétine est la membrane la plus interne, neurosensorielle.","snip":"Elle est la membrane neurosensorielle de la vision","src":"O","id":13},{"ch":"A1","page":5,"type":"qcm","q":"Quelle zone de la rétine correspond à la « tache aveugle » ?","options":["La macula","Le limbe","La papille","La fovéa"] ","page":5,"type":"qcm","q":"Par quoi le cristallin est-il suspendu au corps ciliaire ?","options":["Le canal de Schlemm","La membrane de Barkan","La zonule de Zinn","Le tarse"],"answer":2,"exp":"Les ligaments suspenseurs du cristallin forment la zonule de Zinn.","snip":"suspenseurs appelés la zonule de ZINN","src":"O","id":20},{"ch":"A1","page":5,"type":"vf","q":"Le cristallin est une lentille biconcave et vascularisée.","options":["Vrai","Faux"],"answer":1,"exp":"Faux : c'est une lentille biconvexe, transparente et avasculaire.","snip":"C'est une lentille biconvexe, transparente et avasculaire","src":"O","id":21},{"ch":"A1","page":5,"type":"qcm","q":"Quel est le rôle principal du cristallin grâce à son élasticité ?","options":["L'accommodation","La tonicité du globe","La sécrétion des larmes","La vision des couleurs"],"answer":0,"exp":"Ses déformations sous l'action du muscle ciliaire assurent l'accommodation (adaptation de la vision aux distances).","snip":"Ses possibilités de déformation lui permettent d'assurer l'accommodation","src":"O","id":22},{"ch":"A1","page":6,"type":"qcm","q":"Quel milieu assure au globe oculaire sa tonicité ?","options":["La choroïde","Le cristallin","Le vitré","L'humeur aqueuse"],"answer":2,"exp":"Le vitré, substance gélatineuse, assure la tonicité du globe.","snip":"Le vitré assure au globe oculaire sa tonicité","src":"O","id":23},{"ch":"A1","page":6,"type":"saisie","q":"Comment s'appelle la charpente cartilagineuse de la paupière ?","options":[],"answer":["tarse","le tarse"],"exp":"Chaque paupière est formée par une charpente cartilagineuse : le tarse.","snip":"Chaque paupière est formée par une charpente cartilagineuse : le tarse","src":"O","id":24},{"ch":"A1","page":6,"type":"qcm","q":"Quel muscle commande la fermeture de la paupière ?","options":["Le droit supérieur","Le muscle orbiculaire","Le muscle ciliaire","Le muscle releveur de la paupière"],"answer":1,"exp":"Le releveur ouvre la fente palpébrale, l'orbiculaire ferme la paup ales répondent très bien aux traitements classiques.","options":["Vrai","Faux"],"answer":1,"exp":"Faux : elles sont très rebelles aux traitements classiques.","snip":"elles sont très rebelles aux traitements classiques","src":"O","id":85},{"ch":"P2","page":18,"type":"qcd","q":"Avec quelles affections ne faut-il pas confondre une conjonctivite ?","options":["La kératite","L'orgelet","Le glaucome","L'uvéite"],"answer":[0,2,3],"exp":"Le cours cite kératite, uvéite et glaucome comme diagnostics différentiels.","snip":"uvéite(inflammation de l'uvée)","src":"O","id":86},{"ch":"P2","page":18,"type":"qcm","q":"Quel examen permet d'orienter le traitement étiologique d'une conjonctivite ?","options":["Une tonométrie","Un test de Snip","Une échographie oculaire","Un prélèvement des sécrétions à l'écouvillon (cytologie, culture, antibiogramme)"],"answer":3,"exp":"Le traitement étant étiologique, on fait un prélèvement avec cytologie, culture et antibiogramme.","snip":"il faut faire un prélèvement des sécrétions à l'aide d'un écouvillon","src":"O","id":87},{"ch":"P2","page":18,"type":"qcm","q":"Quelle est la posologie du collyre antibiotique le 1er jour d'une conjonctivite bactérienne ?","options":["1 goutte 4 fois/jour","1 goutte toutes les 15 min","1 goutte 6 fois/jour","1 goutte 2 fois/jour"],"answer":2,"exp":"1 goutte 6 fois/jour le 1er jour, puis 4 fois/jour pendant 10 à 15 jours.","snip":"1 goutte 6 fois / jour, le 1er jour","src":"O","id":88},{"ch":"P2","page":18,"type":"qcm","q":"À partir du 2e jour, le collyre antibiotique est poursuivi à raison de :","options":["1 goutte 6 fois/jour pendant 3 jours","2 gouttes 3 fois/jour pendant 7 jours","1 goutte 4 fois/jour pendant 10 à 15 jours","1 goutte 1 fois/jour pendant 1 mois"],"answer":2,"exp":"À partir du 2e jour : 1 goutte 4 fois/jour pendant 10 à 15 jours.","snip":"1 goutte 4 fois/ jour pendant 10 à 15 jours","src":"O","id":89},{"ch":"P2","page":18,"type":"qcm","q":"Quand applique-t-on surtout la pommade antibiotique dans 1","q":"Cette photo montre une rougeur hématique en nappe du blanc de l'œil. Il s'agit :","options":["d'un hyphéma","d'un chalazion","d'une kératite sclérosante","d'une hémorragie sous-conjonctivale"],"answer":3,"exp":"Légende du cours : hémorragie sous-conjonctivale en nappe.","snip":"Hémorragie sous conjonctivale en nappe","src":"O","id":94},{"ch":"P3","page":20,"type":"qcm","q":"La cataracte est définie comme :","options":["l'opacité de la cornée","une neuropathie optique","l'opacification partielle ou totale du cristallin","une infection de la rétine"],"answer":2,"exp":"La cataracte est l'opacification partielle ou totale du cristallin.","snip":"La cataracte est l'opacification partielle ou totale du cristallin","src":"O","id":95},{"ch":"P3","page":20,"type":"qcm","q":"Dans les zones tropicales, autour de quel âge rencontre-t-on la cataracte sénile ?","options":["30 à 35 ans","70 à 75 ans","Après 80 ans","50 à 55 ans"],"answer":3,"exp":"Habituellement après 60 ans, mais plus précoce en zone tropicale : 50 à 55 ans.","snip":"où on la rencontre autour de 50 à 55 ans","src":"O","id":96},{"ch":"P3","page":20,"type":"vf","q":"La cataracte est une cause de cécité réversible.","options":["Vrai","Faux"],"answer":0,"exp":"Elle est réversible grâce à la chirurgie.","snip":"C'est une cause de cécité réversible","src":"O","id":97},{"ch":"P3","page":20,"type":"qcd","q":"Quels sont des facteurs de risque de la cataracte ?","options":["Corticothérapie au long cours","Exposition aux ultraviolets","Port de verres cylindriques","Diabète"],"answer":[0,1,3],"exp":"Facteurs cités : UV, diabète, myopie forte, hérédité, médicaments (corticoïdes…), tabac, alcool, traumatismes.","snip":"les maladies métaboliques comme le diabète","src":"O","id":98},{"ch":"P3","page":20,"type":"qcm","q":"Quel type de cataracte est classiquement associé à la corticothérapie au long cours ?","options":["Corticale antérieure","Congénitale","Nucléaire","Sous-capsulaire postérieure"],"answer":3,"exp":"La cort ure","Oui, à condition de le chauffer"],"answer":2,"exp":"Usage personnel et conservation limitée (15 jours, parfois 30).","snip":"Il ne doit en aucun cas être utilisé à deux ou à plusieurs","src":"O","id":296}],"glossary":[{"t":"Sclère (sclérotique)","d":"Tunique la plus externe, fibreuse et opaque, recouvrant les 4/5 postérieurs du globe ; donne la couleur blanche à l'œil.","ch":"A1"},{"t":"Cornée","d":"Partie antérieure transparente de l'enveloppe, enchâssée comme un verre de montre dans la sclère.","ch":"A1"},{"t":"Limbe scléro-cornéen","d":"Zone de jonction entre la cornée et la sclère.","ch":"A1"},{"t":"Uvée","d":"Membrane vasculaire formée de la choroïde, du corps ciliaire et de l'iris.","ch":"A1"},{"t":"Choroïde","d":"Partie postérieure de l'uvée qui tapisse la sclère.","ch":"A1"},{"t":"Iris","d":"Partie antérieure de l'uvée, perforée en son centre par la pupille.","ch":"A1"},{"t":"Rétine","d":"Membrane la plus interne, neurosensorielle, qui transmet l'information lumineuse au cerveau par le nerf optique.","ch":"A1"},{"t":"Papille","d":"Tache aveugle : point de départ du nerf optique où se rassemblent les fibres nerveuses.","ch":"A1"},{"t":"Macula (fovéa)","d":"Petite dépression de la rétine dans l'axe visuel : vision précise et des couleurs.","ch":"A1"},{"t":"Humeur aqueuse","d":"Liquide incolore sécrété par les procès ciliaires, remplissant les chambres antérieure et postérieure.","ch":"A1"},{"t":"Cristallin","d":"Lentille biconvexe, transparente, avasculaire et élastique assurant l'accommodation.","ch":"A1"},{"t":"Zonule de Zinn","d":"Ligaments suspenseurs reliant le cristallin au corps ciliaire.","ch":"A1"},{"t":"Accommodation","d":"Adaptation de la vision aux différentes distances par déformation du cristallin.","ch":"A1"},{"t":"Vitré","d":"Substance gélatineuse transparente entre rétine et cristallin, assurant la tonicité du globe.","ch":"A1"},{"t":"Tarse","d":"Charpente cartilagineuse de la paupière.","ch":"A1"},{"t":"Conjonctive bulbaire","d":"Partie de la conjonctive qui recouvre la face antérieure de la sclérotique.","ch":"A1"},{"t":"Fornix","d":"Culs-de-sac conjonctivaux, à la jonction des conjonctives bulbaire et palpébrale.","ch":"A1"},{"t":"Acuité visuelle (AV)","d":"Faculté de l'œil de percevoir distinctement deux points séparés de 3 mm à 5 mètres.","ch":"A2"},{"t":"Optotype","d":"Échelle optométrique servant à mesurer l'acuité visuelle (Monoyer, Snellen, Landölt…).","ch":"A2"},{"t":"Échelle de Parinaud","d":"Échelle de paragraphes servant à mesurer l'AV de près, tenue à 33 cm (notée P1, P2…).","ch":"A2"},{"t":"Amétropie","d":"Trouble de la réfraction dû à une mauvaise mise au point de l'image sur la rétine.","ch":"P1"},{"t":"Myopie","d":"Amétropie où l'image se forme en avant de la rétine ; corrigée par verres concaves (-).","ch":"P1"},{"t":"Hypermétropie","d":"Amétropie où l'image se forme en arrière de la rétine ; corrigée par verres convexes (+).","ch":"P1"},{"t":"Astigmatisme","d":"Anomalie de réfraction due à des méridiens cornéens de courbures différentes ; verres cylindriques.","ch":"P1"},{"t":"Presbytie","d":"Difficulté à voir de près à partir de 40-45 ans par baisse du pouvoir accommodatif.","ch":"P1"},{"t":"Conjonctivite","d":"Inflammation de la muqueuse conjonctivale entraînant une rougeur oculaire.","ch":"P2"},{"t":"Chémosis","d":"Œdème conjonctival important pouvant masquer la cornée.","ch":"P2"},{"t":"Papilles conjonctivales","d":"Petits bourgeons charnus centrés par un bouquet vasculaire, taille d'une tête d'épingle.","ch":"P2"},{"t":"Kératite","d":"Inflammation de la cornée.","ch":"P2"},{"t":"Uvéite","d":"Inflammation de l'uvée.","ch":"P2"},{"t":"Cataracte","d":"Opacification partielle ou totale du cristallin.","ch":"P3"},{"t":"Phaco-émulsification","d":"Fragmentation du noyau cristallinien par ultrasons puis irrigation-aspiration.","ch":"P3"},{"t":"Extraction extra-capsulaire","d":"Extraction du noyau en laissant la capsule postérieure, suivie de la pose d'un implant.","ch":"P3"},{"t":"Glaucome chronique à angle ouvert","d":"Neuropathie optique chronique, insidieuse, bilatérale : excavation papillaire, déficit du champ visuel.","ch":"P4"},{"t":"Trabéculectomie","d":"Création d'une fistule dans le trabéculum pour évacuer l'humeur aqueuse.","ch":"P4"},{"t":"Tonomètre à aplanation","d":"Appareil de mesure de la pression intraoculaire.","ch":"P4"},{"t":"Glaucome aigu","d":"Crise oculaire douloureuse brutale et unilatérale par fermeture de l'angle irido-cornéen.","ch":"P5"},{"t":"Cercle périkératique","d":"Rougeur limbique qui entoure la cornée.","ch":"P5"},{"t":"Mydriase","d":"Dilatation de la pupille.","ch":"P5"},{"t":"Myosis","d":"Resserrement de la pupille.","ch":"P5"},{"t":"Chalazion","d":"Granulome inflammatoire chronique du tarse par obstruction de la glande de Méibomius.","ch":"P6"},{"t":"Orgelet","d":"Abcès staphylococcique de la glande de Zeiss, centré sur un cil.","ch":"P6"},{"t":"Ophtalmie néonatale","d":"Conjonctivite des 28 premiers jours de vie, gonococcique ou à chlamydiae.","ch":"E1"},{"t":"Endophtalmie","d":"Infection du contenu du globe oculaire.","ch":"E1"},{"t":"Panophtalmie","d":"Infection généralisée du globe oculaire et de ses annexes.","ch":"E1"},{"t":"Limbo-conjonctivite (LCET)","d":"Conjonctivite allergique chronique endémique des tropiques, fréquente chez l'enfant.","ch":"E2"},{"t":"Amblyopie","d":"Malvoyance sans lésion organique, par neutralisation cérébrale des images.","ch":"E3"},{"t":"Leucocorie","d":"Blancheur de l'aire pupillaire.","ch":"E3"},{"t":"Rétinoblastome","d":"Tumeur maligne de la rétine de l'enfant de moins de 3 ans.","ch":"E4"},{"t":"Énucléation","d":"Ablation chirurgicale du globe oculaire.","ch":"E4"},{"t":"Membrane de Barkan","d":"Tissu mésodermique persistant devant le trabéculum dans le glaucome congénital.","ch":"E5"},{"t":"Buphtalmie","d":"Augmentation de volume du globe oculaire (« gros yeux ») du glaucome congénital.","ch":"E5"},{"t":"Onchocercose","d":"Filariose cutanéo-dermique due à Onchocerca volvulus, transmise par la simulie ; « cécité des rivières ».","ch":"N1"},{"t":"Simulie","d":"Moucheron (Simulium damnosum) vecteur de l'onchocercose.","ch":"N1"},{"t":"Test de Snip","d":"Biopsie cutanée exsangue aux crêtes iliaques pour rechercher les microfilaires.","ch":"N1"},{"t":"Peau de léopard","d":"Dépigmentation cutanée de l'onchocercose.","ch":"N1"},{"t":"Peau de lézard","d":"Épaississement cutané de l'onchocercose.","ch":"N1"},{"t":"Iridocyclite","d":"Inflammation de l'iris et du corps ciliaire.","ch":"N1"},{"t":"Trachome","d":"Maladie infectieuse de l'œil due à Chlamydia trachomatis.","ch":"N2"},{"t":"Trichiasis","d":"Déviation des cils vers le globe qui frottent sur la cornée.","ch":"N2"},{"t":"Entropion","d":"Retournement du bord de la paupière vers l'intérieur, signe de trachome ancien.","ch":"N2"},{"t":"Hyphéma","d":"Épanchement de sang dans la chambre antérieure.","ch":"T1"},{"t":"Hémorragie sous-conjonctivale","d":"Rougeur hématique du blanc de l'œil, atteinte la plus fréquente des contusions.","ch":"T1"},{"t":"Collyre","d":"Solution médicamenteuse stérile (aqueuse ou huileuse) destinée à être instillée dans l'œil.","ch":"M1"},{"t":"Collyre mydriatique","d":"Collyre qui dilate la pupille (atropine, mydriaticum, néosynéphrine).","ch":"M1"},{"t":"Collyre myotique","d":"Collyre qui resserre la pupille (pilocarpine).","ch":"M1"}],"numbers":[{"v":"23 à 25 mm","l":"diamètre antéro-postérieur du globe oculaire","ch":"A1"},{"v":"7 g","l":"poids du globe oculaire de l'adulte","ch":"A1"},{"v":"6,5 cm³","l":"volume du globe oculaire","ch":"A1"},{"v":"4/5","l":"part postérieure du globe recouverte par la sclère","ch":"A1"},{"v":"6","l":"muscles oculomoteurs par œil (4 droits, 2 obliques)","ch":"A1"},{"v":"3 mm à 5 m","l":"définition précise de l'AV (deux points séparés)","ch":"A2"},{"v":"5 m / 2,5 m","l":"distance de mesure de l'AV de loin : adulte / enfant","ch":"A2"},{"v":"33 cm","l":"distance de lecture de l'échelle de Parinaud","ch":"A2"},{"v":"10 lignes","l":"minimum de lignes d'une échelle d'AV de loin","ch":"A2"},{"v":"6-10 ans","l":"début de la myopie simple","ch":"P1"},{"v":"16-18 ans","l":"stabilisation de la myopie simple","ch":"P1"},{"v":"2-3 ans","l":"début de la myopie forte","ch":"P1"},{"v":"15-16 ans","l":"âge où l'enfant hypermétrope peut quitter ses lunettes","ch":"P1"},{"v":"30-40 ans","l":"apparition de l'hypermétropie de l'adulte","ch":"P1"},{"v":"40-45 ans","l":"début de la presbytie","ch":"P1"},{"v":"< 3 dioptries","l":"pouvoir accommodatif du presbyte","ch":"P1"},{"v":"6 fois/j puis 4 fois/j","l":"collyre ATB de la conjonctivite bactérienne : J1 puis à partir de J2","ch":"P2"},{"v":"10-15 jours","l":"durée du traitement de la conjonctivite bactérienne","ch":"P2"},{"v":"2 à 3 jours","l":"repos accordé aux travailleurs atteints de conjonctivite","ch":"P2"},{"v":"> 60 ans","l":"âge habituel de la cataracte sénile","ch":"P3"},{"v":"50-55 ans","l":"âge de la cataracte sénile en zone tropicale","ch":"P3"},{"v":"> 21 mmHg","l":"hypertonie oculaire (GCAO)","ch":"P4"},{"v":"40 ans","l":"âge à partir duquel le GCAO devient nettement plus fréquent","ch":"P4"},{"v":"60 à 100 mmHg","l":"tonus oculaire lors d'une crise de glaucome aigu","ch":"P5"},{"v":"1/10e","l":"BAV possible au cours du glaucome aigu","ch":"P5"},{"v":"Mannitol 10-20 % en 30 min","l":"perfusion d'urgence du glaucome aigu","ch":"P5"},{"v":"Diamox 500 mg IVD","l":"acétazolamide, 2 ou 3 fois, glaucome aigu","ch":"P5"},{"v":"Pilocarpine 2 % /15 min","l":"jusqu'au myosis, glaucome aigu","ch":"P5"},{"v":"Paracétamol 500 mg","l":"antalgique oral du glaucome aigu","ch":"P5"},{"v":"1er mois","l":"disparition spontanée possible du chalazion : ne pas opérer trop tôt","ch":"P6"},{"v":"24-48 h","l":"délai d'installation de l'orgelet","ch":"P6"},{"v":"28 jours","l":"période des ophtalmies néonatales","ch":"E1"},{"v":"J3-J4","l":"début habituel de l'ophtalmie néonatale","ch":"E1"},{"v":"1880","l":"méthode de Crédé (nitrate d'argent 1 %)","ch":"E1"},{"v":"1 goutte × 3/j, 1 semaine","l":"prophylaxie poursuivie à domicile par la mère","ch":"E1"},{"v":"≥ 2 semaines","l":"durée du traitement curatif de l'ophtalmie néonatale","ch":"E1"},{"v":"1/10 000","l":"fréquence du rétinoblastome","ch":"E4"},{"v":"< 3 ans","l":"âge de survenue du rétinoblastome","ch":"E4"},{"v":"20° N – 17° S","l":"foyer principal de l'onchocercose en Afrique","ch":"N1"},{"v":"> 20 millions","l":"personnes atteintes d'onchocercose dans le monde (500 000 aveugles)","ch":"N1"},{"v":"97/113","l":"districts sanitaires endémiques à l'onchocercose en Côte d'Ivoire","ch":"N1"},{"v":"60 %","l":"personnes atteintes en zone hyperendémique","ch":"N1"},{"v":"5 % / 30 %","l":"perte de la vue : communauté / hommes > 40 ans (zone hyperendémique)","ch":"N1"},{"v":"0-10 / 11-50 / > 50","l":"charge parasitaire faible / moyenne / forte (microfilaires)","ch":"N1"},{"v":"20 min","l":"lecture du test OV 16","ch":"N1"},{"v":"10-15 ans","l":"délai d'apparition des complications de l'onchocercose","ch":"N1"},{"v":"≥ 5 follicules","l":"de 0,5 à 2 mm sur la conjonctive tarsienne supérieure : TF","ch":"N2"},{"v":"0-10 ans","l":"enfants réservoir du trachome","ch":"N2"},{"v":"30 min","l":"durée minimale du lavage d'une brûlure chimique","ch":"T1"},{"v":"15 jours","l":"conservation d'un collyre ouvert (parfois 30 jours)","ch":"M1"},{"v":"5 g ou 10 g","l":"conditionnement des tubes de pommade ophtalmique","ch":"M1"}],"resAnat":{"A1":["Le globe oculaire = <b>contenant<\/b> (sclère, uvée, rétine) + <b>contenu<\/b> (humeur aqueuse, cristallin, vitré).","La <b>sclère<\/b> est blanche et opaque en arrière ; sa partie antérieure transparente est la <b>cornée<\/b> (5 couches).","L'<b>uvée<\/b> vasculaire = choroïde + corps ciliaire + iris (percé de la pupille).","La <b>rétine<\/b> neurosensorielle comporte la <b>papille<\/b> (tache aveugle) et la <b>macula<\/b> (vision précise et des couleurs).","Le <b>cristallin<\/b>, suspendu par la zonule de Zinn, assure l'accommodation.","Annexes : paupières (tarse, releveur, orbiculaire), conjonctive, appareil lacrymal, 6 muscles oculomoteurs."],"A2":["AV = percevoir deux points séparés de 3 mm à 5 m.","Échelles : Monoyer (lettrés, en dixièmes), Snellen et Landölt (illettrés), Rossano-Weiss et Pigassou (enfants).","AV de loin : 5 m (adulte), 2,5 m (enfant), œil par œil en commençant par l'œil droit.","AV de près : Parinaud à 33 cm, noté P1, P2, P3…","Toujours mesurer d'abord sans correction (SC) puis avec correction (AC)."],"P1":["Myopie : image en avant de la rétine → verres concaves (-).","Hypermétropie : image en arrière → verres convexes (+) ; l'hypermétrope accommode en permanence.","Astigmatisme → verres cylindriques.","Presbytie (40-45 ans) : pas une amétropie, baisse de l'accommodation → verres convexes de près.","Seul traitement : verres correcteurs (ou lentilles, chirurgie réfractive)."],"P2":["Inflammation de la conjonctive : œil rouge, AV <b>conservée<\/b>.","Sécrétions purulentes, chémosis, follicules, papilles.","Causes : bactériennes, virales, allergiques, parasitaires, mycosiques.","Traitement : lavage au sérum physiologique + collyre ATB (6×/j à J1 puis 4×/j, 10-15 j) + pommade le soir.","Éviter les corticoïdes tant que le germe n'est pas identifié ; prophylaxie : hygiène, repos, éviction scolaire."],"P3":["Cataracte = opacification du cristallin ; sénile après 60 ans (50-55 ans en zone tropicale).","Cécité réversible ; facteurs : UV, diabète, myopie forte, corticoïdes, tabac, traumatismes.","Vision floue progressive, brouillard, diplopie monoculaire, éblouissement ; réflexe pupillaire conservé.","Traitement uniquement chirurgical : extraction extra-capsulaire (+ implant) ou phaco-émulsification."],"P4":["Neuropathie optique chronique, insidieuse, bilatérale, après 40 ans.","PIO > 21 mmHg (non obligatoire), excavation papillaire, déficit du champ visuel.","Évolue silencieusement vers la cécité.","Traitement à vie par collyres anti-glaucomateux ; chirurgie : trabéculectomie."],"P5":["Fermeture de l'angle irido-cornéen : urgence.","Triade : œil rouge, douleur intense, BAV ; mydriase, globe dur, PIO 60-100 mmHg.","Déclenché par stress, atropine, antihistaminiques, antidépresseurs…","Évacuer : mannitol 30 min, Diamox 500 mg IVD, pilocarpine 2 % /15 min, paracétamol ; préventif : iridectomie/iridotomie."],"P6":["Chalazion : granulome de la glande de Méibomius sur le tarse ; stade aigu puis enkysté.","Chalazion aigu : pommade ATB + corticoïde 10-15 j ; enkysté : chirurgie (pas avant 1 mois).","Orgelet : abcès staphylococcique de la glande de Zeiss, centré sur un cil.","Orgelet : compresses chaudes, pommade ATB, ponction à l'aiguille (jamais au bistouri) ; récidive → chercher un diabète."],"E1":["Conjonctivite des 28 premiers jours, gonocoque ou chlamydiae, début J3-J4.","Pus jaune-verdâtre abondant, bilatéral ; risque de perforation, cécité, septicémie.","Prophylaxie : collyre ATB en salle d'accouchement (Crédé au nitrate d'argent abandonné).","Curatif : collyre + pommade ATB ≥ 2 semaines, traitement général si gonocoque/méningocoque/chlamydiae."],"E2":["Conjonctivite allergique chronique endémique des tropiques chez l'enfant.","Photophobie, larmoiement, prurit ; limbe épais marron ou jaunâtre, bilatéral.","Régresse avec l'âge ; traitement : lavage, antiallergiques, antihistaminique, déparasitage."],"E3":["Opacification congénitale du cristallin → risque d'amblyopie.","Leucocorie, absence de poursuite visuelle, strabisme.","Causes : rubéole, syphilis, toxoplasmose, médicaments, métabolisme, trisomie 21.","Traitement chirurgical précoce + correction optique + rééducation."],"E4":["Tumeur maligne de la rétine avant 3 ans, 1/10 000, souvent héréditaire (autosomique dominant).","Leucocorie, strabisme, nystagmus ; en Afrique souvent au stade d'exophtalmie.","But : sauver la vie ; énucléation, radiothérapie, chimiothérapie, exentération si tardif."],"E5":["Membrane de Barkan devant le trabéculum → hypertonie.","Larmoiement, photophobie intense, « beaux yeux » (mégalocornée, buphtalmie).","Traitement chirurgical précoce : trabéculectomie."],"N1":["Filariose à Onchocerca volvulus transmise par la simulie : « cécité des rivières ».","Signes cutanés précoces (prurit rebelle, gale filarienne, peau de léopard/lézard), nodules, signes oculaires tardifs.","Diagnostic : test de Snip (crêtes iliaques), OV 16.","Traitement : ivermectine (Mectizan®) + lutte anti-vectorielle ; 97 districts sur 113 endémiques en CI."],"N2":["Infection à Chlamydia trachomatis, 1re cause de cécité évitable.","Classification OMS : TF, TI, TS, TT, CO.","TF : ≥ 5 follicules sur la conjonctive tarsienne supérieure (retourner la paupière).","Diagnostic paraclinique : Microtrak, Chlamydiasine, PCR ; hygiène individuelle et communautaire essentielle."],"T1":["Contusion (globe fermé), plaie (globe ouvert), brûlure : toujours mesurer l'AV.","Hyphéma : vit K1 et évacuation ; érosion cornéenne : cicatrisant + ATB.","Plaie pénétrante : pansement occlusif, ATB local et général, atropine, SAT, évacuation.","Brûlure chimique : lavage précoce, abondant, ≥ 30 min — sauf phosphore et chaux vive (coton-tige vaseliné)."],"M1":["Collyres : mydriatiques, myotiques, anesthésiques, antiseptiques, antibiotiques, anti-inflammatoires, antihistaminiques, cicatrisants, corticoïdes.","Jamais de corticoïde tant que l'herpès n'est pas éliminé.","Collyre ouvert : 15 jours (parfois 30) ; usage strictement personnel.","Pommade : agit plus longtemps, grain de riz dans le cul-de-sac inférieur, le soir ; essuyer à la compresse."]},"resPhysio":[{"t":"Trajet de la lumière dans l'œil","ch":"A1","items":["La cornée transparente laisse entrer la lumière.","L'humeur aqueuse remplit les chambres antérieure et postérieure.","Le cristallin focalise les images sur la rétine et s'adapte aux distances (accommodation).","Le vitré maintient la tonicité du globe.","La rétine transmet l'information au cerveau par le nerf optique."]},{"t":"Rôles des annexes","ch":"A1","items":["Les cils empêchent l'entrée des poussières.","Le releveur ouvre la fente palpébrale, l'orbiculaire la ferme.","Les glandes lacrymales mouillent la cornée en permanence ; les larmes s'évacuent par le canal lacrymo-nasal.","Les 6 muscles oculomoteurs assurent la motilité du globe."]},{"t":"Accommodation et âge","ch":"P1","items":["L'hypermétrope accommode en permanence pour voir net.","L'élasticité du cristallin diminue avec l'âge.","Sous 3 dioptries d'accommodation, la lecture à 33 cm devient impossible : presbytie."]},{"t":"Circulation de l'humeur aqueuse et glaucomes","ch":"P5","items":["Sécrétée par les procès ciliaires, elle passe de la chambre postérieure à l'antérieure par la pupille.","Elle s'évacue par le trabéculum au niveau de l'angle irido-cornéen.","Fermeture de l'angle → glaucome aigu ; membrane de Barkan → glaucome congénital.","La trabéculectomie crée une fistule pour l'évacuer."]},{"t":"Maturation de la vision chez l'enfant","ch":"E3","items":["La fonction visuelle mûrit après la naissance.","Elle nécessite une stimulation lumineuse de la rétine.","Toute privation (cataracte congénitale) compromet la maturation → amblyopie."]}],"tabRes":[{"t":"Le globe oculaire","ch":"A1","head":["Élément","Situation / nature","Rôle"],"rows":[["Sclère","Tunique externe, 4/5 postérieurs","Protéger, résister à la PIO, insertion des muscles"],["Cornée","Partie antérieure transparente","Laisser passer la lumière"],["Uvée","Membrane vasculaire (choroïde, corps ciliaire, iris)","Vascularisation ; l'iris porte la pupille"],["Rétine","Membrane interne neurosensorielle","Recevoir et transmettre l'information lumineuse"],["Humeur aqueuse","Chambres antérieure et postérieure","Milieu transparent sécrété par les procès ciliaires"],["Cristallin","Entre iris et vitré","Accommodation"],["Vitré","Entre rétine et cristallin","Tonicité du globe"]]},{"t":"Échelles d'acuité visuelle","ch":"A2","head":["Échelle","Contenu","Public"],"rows":[["Monoyer","Alphabet, en dixièmes","Adultes lettrés (test type)"],["Snellen","« E » ori function chMastery(cid){const qs=QBY[cid]||[];let seen=0,ok=0;qs.forEach(q=>{const s=S.qs[q.id];if(s){seen++;if(s.l)ok++}});return{seen,ok,total:qs.length,pct:qs.length?Math.round(ok/qs.length*100):0}}
function mClass(cid){const m=chMastery(cid);if(!m.seen)return'';return m.pct>=80?'c-green':m.pct>=40?'c-amber':'c-red'}
function mColor(cid){const c=mClass(cid);return c==='c-green'?'var(--green)':c==='c-amber'?'var(--amber)':c==='c-red'?'var(--red)':'var(--grey)'}
function mastered(){return DATA.chapters.filter(c=>chMastery(c.id).pct>=80).length}
function ring(pct,col){const r=19,C=2*Math.PI*r;return `<svg class="ring" viewBox="0 0 46 46"><circle cx="23" cy="23" r="${r}" fill="none" style="stroke:var(--tint2)" stroke-width="6"/><circle cx="23" cy="23" r="${r}" fill="none" stroke="${col}" stroke-width="6" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct/100)}" transform="rotate(-90 23 23)"/><text x="23" y="27" text-anchor="middle" font-size="11" font-weight="800" style="fill:var(--ink)">${pct}%</text></svg>`}
function answerText(q){if(q.type==='ouv')return String(q.answer||'').replace(/<li[^>]*>/gi,' • ').replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();if(q.type==='saisie')return(q.answer||[''])[0];if(q.type==='vf')return q.answer===0?Tx('quiz.true','Vrai'):Tx('quiz.false','Faux');if(Array.isArray(q.answer))return q.answer.map(i=>q.options[i]).join(' · ');return(q.options||[])[q.answer]}

function nrm(s){return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[’']/g,"'")}
function doSearch(inp){const o=inp.closest('.card').querySelector('.sout');const v=nrm(inp.value.trim());if(v.length<3){o.innerHTML='';return}
 const res=[];
 DATA.questions.forEach(q=>{if(nrm(q.q+' '+(q.scen||'')+' '+chOf(q.ch).title).includes(v))res.push([Tx('search.question','Question'),esc(q.q),()=>showQDetail(q,o)])});
 DATA.glossary.forEach(g=>{if(nrm(g.t+' '+g.d).includes(v))res.push([Tx('search.glossary','Glossaire'),'<b>'+esc(g.t)+'</b> : '+esc(g.d),null])});
 DATA.course.forEach(p=>{const t=p.html.replace(/<[^>]+>/g,' ');const k=nrm(t).indexOf(v);if(k>=0){const s=t.substr(Math.max(0,k-40),120);res.push([Tx('search.course','Cours')+' · '+srcName(p.src)+' p.'+p.page,'…'+esc(s)+'…',()=>openSource(p.src,p.page)])}});
 o.innerHTML=res.length?`<div class="small muted" style="margin-top:8px">${T('search.count','{n} résultat(s)',{n:res.length})}</div>`+res.slice(0,40).map((r,i)=>`<div class="sres" data-i="${i}"><small>${esc(r[0])}</small><div>${r[1]}</div></div>`).join(''):`<div class="small muted" style="margin-top:8px">${T('search.none','Aucun résultat')}</div>`;
 $$('.sres',o).forEach(e=>{const r=res[+e.dataset.i];if(r[2])e.onclick=r[2]})}
function showQDetail(q,o){o.innerHTML=`<div class="fb good" style="margin-top:10px"><div class="small"><b>${esc(chOf(q.ch).title)}</b> · ${esc(typeLabel(q.type))}</div>${q.scen?'<div class="scen">'+esc(q.scen)+'</div>':''}<div style="font-weight:700;margin:6px 0">${esc(q.q)}</div><div class="h">✅ ${esc(answerText(q))}</div>${q.exp?'<div>'+esc(q.exp)+'</div>':''}${q.snip?'<div class="src">« '+esc(q.snip)+' »</div>':''}${q.page?`<button class="linkbtn" onclick="openSource('${jsq(q.src)}',${+q.page})">${T('ui.srcpage','📖 Page source p.{p}',{p:q.page})}</button>`:''}</div>`}

/* ---------- surligneur de l'étudiant ---------- */
let annotOn=true;
function annotBar(){return `<div class="annot"><button id="annBtn" class="${annotOn?'on':''}" onclick="annotOn=!annotOn;this.classList.toggle('on',annotOn);toast(annotOn?'${jsq(Tx('annot.on','Surligneur activé'))}':'${jsq(Tx('annot.off','Surligneur désactivé'))}')">${T('annot.btn','✏️ Annoter')}</button><span class="small muted">${T('annot.help','Sélectionne du texte pour surligner · touche un surlignage pour l’effacer')}</span></div>`}
let selRange=null,selBox=null;
function bindAnnot(){$$('.pgc[data-k]').forEach(b=>{b.onclick=e=>{if(EDITMODE)return;const m=e.target.closest('mark.hl');if(m&&annotOn&&!window.getSelection().toString()){unwrap(m);persist(b);toast(Tx('annot.erased','Surlignage effacé'))}}})}
function checkSel(){const pal=$('#palette');if(!pal)return;const sel=window.getSelection();if(EDITMODE||!annotOn||!sel.rangeCount||sel.isCollapsed){pal.style.display='none';return}
 const r=sel.getRangeAt(0);const box=(r.commonAncestorContainer.nodeType===1?r.commonAncestorContainer:r.commonAncestorContainer.parentElement).closest('.pgc[data-k]');if(!box){pal.style.display='none';return}
 selRange=r.cloneRange();selBox=box;const rc=r.getBoundingClientRect();pal.style.display='flex';
 let top=rc.top-62;if(top<70)top=rc.bottom+60;pal.style.top=Math.min(window.innerHeight-70,top)+'px';pal.style.left=Math.max(8,Math.min(window.innerWidth-220,rc.left))+'px'}
function textNodesIn(range,box){const out=[];const w=document.createTreeWalker(box,NodeFilter.SHOW_TEXT);let n;while(n=w.nextNode()){if(range.intersectsNode(n)&&n.nodeValue.trim())out.push(n)}return out}

/* ---------- sujets type examen : toutes les questions réparties en sujets distincts de 50 ---------- */
const SUBJ_N=50;
function subjHash(x){let h=2166136261;x=String(x);for(let i=0;i<x.length;i++){h^=x.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function subjects(){const by={};DATA.questions.forEach(q=>{(by[q.ch]=by[q.ch]||[]).push(q)});
 const lists=DATA.chapters.map(c=>(by[c.id]||[]).slice().sort((a,b)=>subjHash('s'+a.id)-subjHash('s'+b.id))).filter(l=>l.length);
 Object.keys(by).forEach(k=>{if(!DATA.chapters.some(c=>c.id===k))lists.push(by[k])});
 const tot=lists.reduce((a,l)=>a+l.length,0),order=[];const pos=lists.map(()=>0);
 /* répartition proportionnelle : chaque chapitre est étalé sur tous les sujets */
 const keyed=[];lists.forEach((l,li)=>l.forEach((q,k)=>keyed.push({q,key:(k+0.5)/l.length,li})));
 keyed.sort((a,b)=>a.key-b.key||a.li-b.li);keyed.forEach(x=>order.push(x.q.id));
 const out=[];for(let i=0;i<order.length;i+=SUBJ_N)out.push(order.slice(i,i+SUBJ_N));
 if(out.length>1&&out[out.length-1].length<SUBJ_N/2){const last=out.pop();last.forEach((id,i)=>out[i%out.length].push(id))}
 return out}

 <div style="display:grid;grid-template-columns:repeat(var(--cols,2),minmax(0,1fr));gap:10px">${L.map((ids,k)=>{const o=st[k];const pct=o?Math.round(o.best/o.n*100):null;

 if(q.type==='saisie')opts=`<input class="tin" id="etin" value="${esc(a||'')}" placeholder="${esc(Tx('quiz.input','Ta réponse…'))}" autocomplete="off">`;
 else if(q.type==='vf')opts=`<div class="vfrow">${[0,1].map(i=>`<button class="opt ${a&&a.includes(i)?'sel':''}" data-i="${i}">${i?T('quiz.vfalse','✖️ Faux'):T('quiz.vtrue','✔️ Vrai')}</button>`).join('')}</div>`;
 else opts=q.options.map((o,i)=>`<button class="opt ${a&&a.includes(i)?'sel':''}" data-i="${i}"><span class="k">${L[i]}</span><span>${esc(o)}</span></button>`).join('');
 return `<div class="pbar"><i style="width:${Object.keys(EX.ans).length/EX.ids.length*100}%"></i></div><div class="card"><span class="qtype ${q.type}">${esc(typeLabel(q.type))}${multi?' — '+T('exam.multi','plusieurs réponses'):''}</span>${q.scen?`<div class="scen">🩺 ${esc(q.scen)}</div>`:''}${q.type==='img'&&IMG[q.img]?`<img class="qimg" src="${IMG[q.img]}">`:''}<div class="qq">${esc(q.q)}</div><div id="opts">${opts}</div></div>
 <div style="display:flex;gap:10px">${EX.idx>0?`<button class="btn light" onclick="exNav(-1)">${T('exam.prev','‹ Préc.')}</button>`:''}${EX.idx<EX.ids.length-1?`<button class="btn" onclick="exNav(1)">${T('exam.next','Suiv. ›')}</button>`:''}</div>
 <button class="btn coral" onclick="askConfirm('${jsq(Tx('exam.confirm','Terminer et corriger ?'))}',finishExam)">${T('exam.finish','🏁 Terminer l’examen ({a}/{n} répondues)',{a:Object.keys(EX.ans).length,n:EX.ids.length})}</button>`},{portable:false,after:()=>{const q=QI[EX.ids[EX.idx]];const multi=Array.isArray(q.answer)&&q.type!=='saisie';
 $$('#opts .opt').forEach(b=>b.onclick=()=>{if(EDITMODE)return;const i=+b.dataset.i;let a=EX.ans[q.id]||[];if(multi){a=a.includes(i)?a.filter(x=>x!==i):a.concat(i)}else a=[i];if(a.length)EX.ans[q.id]=a;else delete EX.ans[q.id];$$('#opts .opt').forEach(x=>x.classList.toggle('sel',a.includes(+x.dataset.i)))});
 const t=$('#etin');if(t)t.oninput=()=>{if(t.value.trim())EX.ans[q.id]=t.value;else delete EX.ans[q.id]};
 clearInterval(EX.ti);const tick=()=>{const r=EX.dur-(Date.now()-EX.t0);const e=$('#tmr');if(r<=0){clearInterval(EX.ti);toast(Tx('exam.timeout','⏰ Temps écoulé !'));finishExam();return}if(e)e.textContent='⏱ '+Math.floor(r/60000)+':'+String(Math.floor(r%60000/1000)).padStart(2,'0')};tick();EX.ti=setInterval(tick,1000)}});
function askConfirm(msg,yes){let o=document.getElementById('askc');if(o)o.remove();o=document.createElement('div');o.id='askc';o.style.cssText='position:fixed;inset:0;z-index:9999;background:rgba(10,20,30,.55);display:flex;align-items:center;justify-content:center;padding:16px';o.innerHTML=`<div class="card" style="max-width:360px;width:100%;margin:0;text-align:center"><div style="font-weight:800;font-size:18px;margin-bottom:14px">${esc(msg)}</div><div style="display:flex;gap:10px"><button class="btn light" id="askNo" style="margin:0">${esc(Tx('ui.no','Annuler'))}</button><button class="btn coral" id="askYes" style="margin:0">${esc(Tx('ui.yes','Oui'))}</button></div></div>`;document.body.appendChild(o);o.onclick=e=>{if(e.target===o)o.remove()};o.querySelector('#askNo').onclick=()=>o.remove();o.querySelector('#askYes').onclick=()=>{o.remove();yes()}}
function abandonExam(){if(EX)clearInterval(EX.ti);EX=null;VSTACK=[];go('home',{},false)}
function exNav(d){EX.idx+=d;render();window.scrollTo(0,0)}
function finishExam(){if(!EX)return;clearInterval(EX.ti);let sc=0;const answers=EX.ids.map(id=>{const q=QI[id];const a=EX.ans[id];let ok=false,user='';
  if(q.type==='saisie'){user=a||'';ok=checkSaisie(q,user)}
  else if(a){const want=Array.isArray(q.answer)?q.answer.slice().sort():[q.answer];const got=a.slice().sort();ok=want.length===got.length&&want.every((v,i)=>v===got[i]);user=got.map(i=>q.type==='vf'?(i?Tx('quiz.false','Faux'):Tx('quiz.true','Vrai')):q.options[i]).join(' · ')}
  if(ok)sc++;const st=S.qs[id]||{s:0,c:0};st.s++;if(ok)st.c++;st.l=ok?1:0;S.qs[id]=st;return{id,ok,user}});
 addXP(sc*10);S.exams.push({d:today(),sc,n:EX.ids.length});const note=Math.round(sc/EX.ids.length*200)/10;if(EX.subj){S.subj=S.subj||{};const o=S.subj[EX.subj]||{best:0,n:0,tries:0};o.tries++;o.n=EX.ids.length;o.last=sc;if(sc>o.best)o.best=sc;S.subj[EX.subj]=o}const label=Tx('exam.label','Examen blanc · note {note}/20',{note});S.hist.push({d:today(),n:EX.ids.length,sc,label});save();
 VSTACK=[];go('result',{n:EX.ids.length,sc,boss:null,answers,label},false);toast(Tx('exam.note','Note : {note} / 20',{note}),3500)}

function fmtNum(x,dec){if(!isFinite(x))return'—';const r=Math.round(x*Math.pow(10,dec))/Math.pow(10,dec);return r.toLocaleString('fr-FR',{maximumFractionDigits:dec})}
function safeHTML(s){return String(s==null?'':s).replace(/<(?!\/?(b|i|u|em|strong|ul|ol|li|br|p|sub|sup)\b)[^>]*>/gi,'').replace(/\son\w+\s*=/gi,' x=')}
function FORM(){return DATA.formulas||[]}
function FX(id){return FORM().find(f=>f.id===id)}
function fnOf(F){if(!F._fn)F._fn=new Function(...F.vars.map(v=>v[0]),'return ('+F.expr+');');return F._fn}
function exValue(F,ex){const v=ex[1];if(F.type==='calc')return fnOf(F)(...F.vars.map(x=>v[x[0]]));if(F.type==='score')return v.reduce((a,b)=>a+b,0);if(F.type==='wallace')return F.zones.reduce((s,z,i)=>s+z[1]*v[i],0);if(F.type==='lund')return Object.entries(v.z).reduce((s,[z,n])=>s+DATA.lund[z][1][v.age]*n,0);return NaN}
function resUnit(F){return F.type==='calc'?F.res[1]:(F.type==='wallace'||F.type==='lund')?'%':'points'}
function fInterp(F,val){const it=(F.interp||[]).find(r=>val>=r[0]-1e-9&&val<=r[1]+1e-9);return it?it[2]:''}
function fSubst(F,v){return F.expr.replace(/\b[A-Za-z]\w*\b/g,k=>(k in v)?String(v[k]).replace('.',','):k).replace(/\*/g,' × ').replace(/\//g,' ÷ ').replace(/\+/g,' + ')}
function solvedExample(F,ex){const val=exValue(F,ex),u=resUnit(F),v=ex[1];let don='',app='';
 if(F.type==='calc'){don=F.vars.map(x=>`${esc(x[1])} = ${String(v[x[0]]).replace('.',',')} ${esc(x[2])}`).join(' ; ');app=esc(fSubst(F,v))}
 if(F.type==='score'){don=F.crit.map((c,i)=>`${esc(c[0])} : ${esc((c[1].find(o=>o[0]===v[i])||['',''])[1])} → ${v[i]}`).join('<br>');app=v.join(' + ')}
 if(F.type==='wallace'){const zs=F.zones.map((z,i)=>v[i]?[z,v[i]]:null).filter(Boolean);don=zs.map(([z])=>`${esc(z[0])} (${z[1]} %)`).join(' ; ');app=zs.map(([z,k])=>k===1?z[1]:z[1]+' × '+k).join(' + ')}
 if(F.type==='lund'){const zs=Object.entries(v.z);don=esc(Tx('form.age','Âge'))+' : '+esc(DATA.lundAges[v.age])+' ; '+zs.map(([z,n])=>`${esc(DATA.lund[z][0])} ${String(DATA.lund[z][1][v.age]).replace('.',',')} % × ${String(+n.toFixed(2)).replace('.',',')}`).join(' ; ');app=zs.map(([z,n])=>String(DATA.lund[z][1][v.age]).replace('.',',')+(n!==1?' × '+String(+n.toFixed(3)).replace('.',','):'')).join(' + ')}
 const it=fInterp(F,val);
 return `<ol class="small" style="margin:6px 0;padding-left:20px"><li><b>${T('form.ex.s','Énoncé :')}</b> ${esc(ex[0])}</li><li><b>${T('form.ex.d','Données :')}</b> ${don}</li><li><b>${T('form.ex.f','Formule :')}</b> ${esc(F.f)}</li><li><b>${T('form.ex.a','Application :')}</b> ${app}</li><li><b>${T('form.ex.r','Résultat :')}</b> ${fmtNum(val,2)} ${esc(u)}</li>${it?`<li><b>${T('form.ex.i','Interprétation :')}</b> ${esc(it)}</li>`:''}</ol>`}
function srcBtn(src,page,lab){return page!=null&&src?(hasPage(src,page)?`<button class="linkbtn" onclick="openSource('${jsq(src)}',${+page})">📖 ${esc(lab||srcName(src)+' p.'+page)}</button>`:`<span class="small muted">📖 ${esc(lab||srcName(src)+' p.'+page)}</span>`):''}
function formCard(F){return `<div class="card"><h3 style="margin-bottom:4px">🧮 ${esc(F.n)}</h3><div class="small muted">${esc(chOf(F.ch).title)} · ${srcBtn(F.src,F.page,F.ref)}${F.horsPdf?' · '+T('form.hors','📝 hors des PDF'):''}</div>
 <div class="formbox">${esc(F.f)}</div><details><summary>${T('form.solved','✍️ Exemples résolus ({n})',{n:F.ex.length})}</summary>${F.ex.map(ex=>solvedExample(F,ex)).join('<hr style="border:0;border-top:1px dashed var(--line,#ddd)">')}</details>
 ${F.piege?`<div class="small" style="margin-top:6px">⚠️ <b>${T('form.trap','Piège :')}</b> ${esc(F.piege)}</div>`:''}
 <button class="btn light" style="margin-top:8px" onclick="go('formulas',{tab:'calc',f:'${jsq(F.id)}'},VIEW!=='formulas')">${T('form.open','➗ Ouvrir dans la calculatrice')}</button></div>`}
function calcPanel(F){let inp='';const row=(l,i)=>`<div style="display:flex;gap:8px;align-items:center;margin:5px 0"><label style="flex:1;font-size:14px">${l}</label>${i}</div>`;
 if(F.type==='calc'){inp=row(`<b>${T('form.seek','Je cherche :')}</b>`,`<select class="tin" id="unk" style="width:auto;margin:0">${`<option value="__res">${esc(F.res[0])} (${esc(F.res[1])})</option>`+F.vars.map(v=>`<option value="${esc(v[0])}">${esc(v[1])} (${esc(v[2])})</option>`).join('')}</select>`)
  +F.vars.map(v=>row(`${esc(v[1])} <span class="small muted">${esc(v[2])}</span>`,`<input class="tin cv" style="width:120px;margin:0" type="number" step="any" id="v_${esc(v[0])}" value="${F.ex[0][1][v[0]]}">`)).join('')
  +row(`<b>${esc(F.res[0])}</b> <span class="small muted">${esc(F.res[1])}</span>`,`<input class="tin cv" style="width:120px;margin:0" type="number" step="any" id="v___res">`)}
 if(F.type==='score')inp=F.crit.map((c,i)=>row(esc(c[0]),`<select class="tin cv" id="s_${i}" style="width:auto;max-width:55%;margin:0">${c[1].map(o=>`<option value="${o[0]}">${o[0]} – ${esc(o[1])}</option>`).join('')}</select>`)).join('');
 if(F.type==='wallace')inp=F.zones.map((z,i)=>row(`${esc(z[0])} (${z[1]} %)`,`<select class="tin cv" id="s_${i}" style="width:auto;margin:0">${[[0,'0'],[0.25,'¼'],[0.5,'½'],[0.75,'¾'],[1,'1']].map(o=>`<option value="${o[0]}">${o[1]}</option>`).join('')}</select>`)).join('');
 if(F.type==='lund')inp=row(`<b>${T('form.age','Âge')}</b>`,`<select class="tin cv" id="age" style="width:auto;margin:0">${DATA.lundAges.map((a,i)=>`<option value="${i}">${esc(a)}</option>`).join('')}</select>`)+Object.entries(DATA.lund).map(([k,z])=>row(`${esc(z[0])} <span class="small muted" id="lv_${k}"></span>`,`<input class="tin cv" style="width:80px;margin:0" type="number" min="0" max="${z[2]}" step="0.25" value="0" id="z_${k}"><span class="small muted">/ ${z[2]}</span>`)).join('');
 return `<div class="card"><h3>${esc(F.n)}</h3><div class="small muted">${srcBtn(F.src,F.page,F.ref)}</div><div class="formbox">${esc(F.f)}</div>${inp}<div id="cres" class="fb good" style="font-size:17px;margin-top:10px"></div>${F.piege?`<div class="small" style="margin-top:6px">⚠️ ${esc(F.piege)}</div>`:''}</div>`}
function solveFor(f,args,idx,target){const g=x=>{const a=args.slice();a[idx]=x;return f(...a)-target};let x0=1,x1=10,f0=g(x0),f1=g(x1);
 for(let i=0;i<80&&isFinite(f1);i++){if(Math.abs(f1)<1e-10)return x1;const d=f1-f0;if(d===0)break;const x2=x1-f1*(x1-x0)/d;x0=x1;f0=f1;x1=x2;f1=g(x1)}return isFinite(f1)&&Math.abs(f1)<1e-6?x1:NaN}
function calcUpdate(){const F=FX(ctx.f);const out=$('#cres');if(!F||!out)return;if(!$(F.type==='calc'?'#unk':F.type==='lund'?'#age':'#s_0'))return;let val,txt='';const num=id=>parseFloat(String(($('#'+id)||{}).value).replace(',','.'));
 if(F.type==='calc'){const unk=$('#unk').value,f=fnOf(F);F.vars.forEach(v=>$('#v_'+v[0]).disabled=unk===v[0]);$('#v___res').disabled=unk==='__res';const args=F.vars.map(v=>num('v_'+v[0]));
  if(unk==='__res'){val=f(...args);$('#v___res').value=isFinite(val)?+val.toFixed(2):'';txt=`<b>${esc(F.res[0])} = ${fmtNum(val,2)} ${esc(F.res[1])}</b>`}
  else{const idx=F.vars.findIndex(v=>v[0]===unk),target=num('v___res');if(!isFinite(target)){out.innerHTML=T('form.needres','Saisis la valeur de « {r} » pour trouver l’inconnue.',{r:esc(F.res[0])});return}const x=solveFor(f,args,idx,target);$('#v_'+unk).value=isFinite(x)?+x.toFixed(2):'';val=target;txt=`<b>${esc(F.vars[idx][1])} = ${fmtNum(x,2)} ${esc(F.vars[idx][2])}</b>`}}
 if(F.type==='score'){val=F.crit.reduce((s,c,i)=>s+ +$('#s_'+i).value,0);txt=`<b>${T('form.total','Total')} = ${val} / ${F.crit.reduce((s,c)=>s+Math.max(...c[1].map(o=>o[0])),0)}</b>`}
 if(F.type==='wallace'){val=F.zones.reduce((s,z,i)=>s+z[1]* +$('#s_'+i).value,0);txt=`<b>SCB = ${fmtNum(val,2)} %</b>`}
 if(F.type==='lund'){const age=+$('#age').value;val=0;Object.entries(DATA.lund).forEach(([k,z])=>{$('#lv_'+k).textContent='('+String(z[1][age]).replace('.',',')+' %)';val+=z[1][age]*(num('z_'+k)||0)});txt=`<b>SCB = ${fmtNum(val,2)} %</b>`}
 const it=fInterp(F,val);out.innerHTML=txt+(it?`<div class="small" style="margin-top:4px">📌 ${esc(it)}</div>`:'')}
function fDistract(F,val){const dec=Math.abs(val)<10&&val%1?2:(val%1?1:0);const set=new Set([fmtNum(val,dec)]);const out=[];
 const cands=F.type==='calc'?[val*2,val/2,val*1.1,val*0.9,val+(Math.abs(val)>20?Math.round(val*0.2):1),val*4,val*10,val/10,val*1.5]:[val+1,val-1,val+2,val-2,val+3,val-3,val*2];
 for(const c of shuffle(cands)){if(c<0||!isFinite(c))continue;const s=fmtNum(c,dec);if(set.has(s))continue;set.add(s);out.push(s);if(out.length===3)break}return{good:fmtNum(val,dec),bad:out}}

  else{const[fid,ei]=FZ.list[FZ.i];const F=FX(fid),ex=F.ex[ei],val=exValue(F,ex);if(!FZ.opts){const d=fDistract(F,val);FZ.opts={opts:shuffle([d.good].concat(d.bad)),good:d.good}}

/* ---------- divergences entre les cours ---------- */
function DVG(){return DATA.dvg||[]}
function reminder(id){const R=DATA.reminders||[];if(!R.length)return'';let x=0;for(const c of String(id))x=(x*31+c.charCodeAt(0))>>>0;return `<div class="small" style="margin-top:6px;padding:8px 10px;border-radius:10px;background:var(--tint,#eef)">📘 ${esc(R[x%R.length])}</div>`}
function dvgBox(id){const d=DVG().find(x=>x.id===id);if(!d)return'';return `<div style="margin-top:8px;padding:10px;border-radius:12px;border:2px solid #f08c00;background:rgba(240,140,0,.08)"><b>⚠ ${T('dvg.badge','Divergence entre les cours')} — ${esc(d.t)}</b>${d.items.map(it=>`<div class="small" style="margin-top:6px">${esc(it[1])}<br>${srcBtn(it[2],it[3],it[0])}</div>`).join('')}${reminder(d.id)}</div>`}

 return `<div class="card"><h3>${T('frises.game.h','🧩 Remets dans l’ordre')}</h3><b>${esc(c.t)}</b> ${srcBtn(c.src,c.page,c.ref)}<div class="small muted" style="margin:6px 0">${T('frises.game.sub','Touche les étapes de la première à la dernière.')}</div>
 <ol>${OG.picked.map(i=>`<li style="color:var(--green);font-weight:700">${esc(c.steps[i])}</li>`).join('')}</ol>${OG.done?'':OG.sh.filter(i=>!OG.picked.includes(i)).map(i=>`<button class="opt" onclick="orderPick(${i})"><span>${esc(c.steps[i])}</span></button>`).join('')}
 ${OG.done?`<div class="fb ${OG.ok?'good':'bad'}"><div class="h">${OG.ok?T('frises.ok','✅ Parfait ! +15 XP'):T('frises.ko','❌ Pas tout à fait. Le bon ordre :')}</div>${OG.ok?'':'<ol>'+c.steps.map(s=>`<li>${esc(s)}</li>`).join('')+'</ol>'}</div>`:''}
 <button class="btn light" onclick="OG=null;render()">${T('frises.other','🔀 Autre séquence')}</button></div>`},{portable:false});
B('frises.list','Frises chronologiques',()=>(DATA.chrono||[]).map(c=>`<div class="card"><h3>⏱️ ${esc(c.t)}</h3>${srcBtn(c.src,c.page,c.ref)}<ol>${c.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol></div>`).join(''));

B('sources.main','Les cours sources',()=>{const C=DATA.courses||[];if(!C.length)return'';const t=ctx.tab||'fiche';const st=VIEW==='sources'?'false':'true';
 const TB=[['fiche',T('sources.tab.fiche','📚 Les cours')],['side',T('sources.tab.side','📊 Comparaison')],['theme',T('sources.tab.theme','🧩 Par thème')],['meme',T('sources.tab.meme','🔁 Même sujet')],['coq',T('sources.tab.coq','✎ Coquilles')]];
 const stat=s=>({ch:new Set(DATA.course.filter(p=>p.src===s).map(p=>p.ch)).size,q:DATA.questions.filter(q=>q.src===s).length,pg:DATA.course.filter(p=>p.src===s).length,dv:DVG().filter(d=>d.srcs.includes(s)).length,img:DATA.images.filter(i=>i.src===s).length});
 const first=s=>{const p=DATA.course.filter(x=>x.src===s).sort((a,b)=>a.page-b.page)[0];return p?`openSource('${jsq(s)}',${p.page})`:''};
