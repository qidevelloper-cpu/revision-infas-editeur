const STORAGE_KEY = "pharmacoInfasProgress_v1";
let progress = loadProgress();

function loadProgress(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultProgress();
    const p = JSON.parse(raw);
    if(!p.mastery) p.mastery = {};
    if(!p.history) p.history = [];
    return p;
  }catch(e){ return defaultProgress(); }
}
function defaultProgress(){
  return { mastery:{}, history:[], totalSeen:0, totalCorrect:0, lastExam:null, flashBoxes:{}, flashDue:{} };
}
const LEITNER_INTERVAL_DAYS = [1,2,4,7,14]; // index = box (0..4)
function getFlashBox(id){ if(!progress.flashBoxes) progress.flashBoxes={}; return progress.flashBoxes[id] ?? 0; }
function isFlashDue(card){
  if(!progress.flashDue) progress.flashDue={};
  const due = progress.flashDue[card.id];
  if(!due) return true;
  return new Date(due).getTime() <= Date.now();
}
function recordFlashResult(card, result){ // result: "again" | "good" | "easy"
  if(!progress.flashBoxes) progress.flashBoxes={};
  if(!progress.flashDue) progress.flashDue={};
  let box = getFlashBox(card.id);
  if(result==="again") box = 0;
  else if(result==="good") box = Math.min(4, box+1);
  else if(result==="easy") box = 4;
  progress.flashBoxes[card.id] = box;
  const next = new Date(Date.now() + LEITNER_INTERVAL_DAYS[box]*24*3600*1000);
  progress.flashDue[card.id] = next.toISOString();
  saveProgress();
}
function flashStats(){
  const total = FLASHCARDS.length;
  let dueCount=0, masteredCount=0;
  FLASHCARDS.forEach(c=>{ if(isFlashDue(c)) dueCount++; if(getFlashBox(c.id)>=4) masteredCount++; });
  return {total, dueCount, masteredCount};
}
function saveProgress(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(progress)); }catch(e){ console.error("Erreur de sauvegarde", e); }
}
function testLocalStorage(){
  try{
    const testKey="__pharmaco_test__", testVal="ok-"+Date.now();
    localStorage.setItem(testKey,testVal);
    const read = localStorage.getItem(testKey);
    const success = read === testVal;
    localStorage.removeItem(testKey);
    const verify = localStorage.getItem(testKey);
    console.log("testLocalStorage:", success && verify===null ? "SUCCES" : "ECHEC");
    return success && verify===null;
  }catch(e){ console.log("testLocalStorage: ECHEC", e); return false; }
}
testLocalStorage();

function getMastery(qid){ return progress.mastery[qid] ?? 0; } // 0..4
function bumpMastery(qid, correct){
  const cur = getMastery(qid);
  const next = correct ? Math.min(4, cur+1) : Math.max(0, cur-1);
  progress.mastery[qid] = next;
  progress.totalSeen++;
  if(correct) progress.totalCorrect++;
  saveProgress();
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

function buildFilteredPool(){
  return Q.filter(q => filters.chapters.has(q.chapter) && filters.types.has(q.type) && filters.difficulties.has(q.difficulty));
}

function startSession(list, label){
  queue = shuffle(list);
  qIndex = 0;
  answersGiven = {};
  selectedOptions = {};
  sessionLabel = label;
  view = "quiz";
  render();
}

function startQuickRevision(minutes){
  const perMinute = 1.2;
  const count = Math.max(5, Math.round(minutes*perMinute));
  const pool = buildFilteredPool();
  const weighted = pool.slice().sort((a,b)=> getMastery(a.id)-getMastery(b.id));
  startSession(weighted.slice(0, Math.min(count, weighted.length)), "Révision rapide · "+minutes+" min");
}

function startExamBlanc(){
  const pool = shuffle(Q);
  startSession(pool.slice(0, Math.min(30,pool.length)), "Examen blanc");
}

function startMedOfDay(){
  const pool = buildFilteredPool();
  if(pool.length===0){ startSession(Q.slice(0,4),"Médicament du jour"); return; }
  const seed = new Date().toDateString();
  let h=0; for(let i=0;i<seed.length;i++){ h = (h*31 + seed.charCodeAt(i))>>>0; }
  const startIdx = h % pool.length;
  const picks = [];
  for(let i=0;i<Math.min(4,pool.length);i++){ picks.push(pool[(startIdx+i)%pool.length]); }
  startSession(picks, "Médicament du jour");
}

function renderSearchResultsInto(host, query){
  host.innerHTML = "";
  const q = query.trim().toLowerCase();
  if(q.length < 2) return;

  const qHits = Q.filter(item=> item.question.toLowerCase().includes(q) || item.chapter.toLowerCase().includes(q) || (item.explanation||"").toLowerCase().includes(q)).slice(0,6);
  const medHits = [];
  MEDS.forEach(group=>{
    group.items.forEach(([dci,brands])=>{
      if(dci.toLowerCase().includes(q) || (brands||"").toLowerCase().includes(q) || group.classe.toLowerCase().includes(q)){
        medHits.push({group, dci, brands});
      }
    });
  });
  const sumHits = [];
  Object.keys(SUMMARIES).forEach(ch=>{
    SUMMARIES[ch].bullets.forEach(b=>{
      if(b.toLowerCase().includes(q) || ch.toLowerCase().includes(q)) sumHits.push({ch,bullet:b});
    });
  });

  if(qHits.length===0 && medHits.length===0 && sumHits.length===0){
    host.appendChild(el(`<div class="hint mt14">Aucun résultat pour « ${esc(query)} ».</div>`));
    return;
  }

  const box = el(`<div class="mt14"></div>`);
  if(medHits.length>0){
    box.appendChild(el(`<div class="label" style="font-size:11px;text-transform:uppercase;color:var(--txt-faint);margin-bottom:6px;">💊 Médicaments (${medHits.length})</div>`));
    medHits.slice(0,6).forEach(h=>{
      const row = el(`<div class="chapter-row" style="cursor:pointer;"><div class="cname"><b>${esc(h.dci)}</b> <span style="color:var(--txt-faint);">— ${esc(h.brands)}</span><br><small style="color:var(--txt-faint);">${esc(h.group.classe)}</small></div></div>`);
      row.addEventListener("click", ()=>{ view="meds"; medsSearchQuery=h.dci; searchQuery=""; render(); });
      box.appendChild(row);
    });
  }
  if(qHits.length>0){
    box.appendChild(el(`<div class="label mt14" style="font-size:11px;text-transform:uppercase;color:var(--txt-faint);margin-bottom:6px;">❓ Questions (${qHits.length})</div>`));
    qHits.forEach(item=>{
      const row = el(`<div class="chapter-row" style="cursor:pointer;"><div class="cname">${esc(item.question.slice(0,80))}${item.question.length>80?'…':''}<br><small style="color:var(--txt-faint);">${esc(item.chapter)}</small></div></div>`);
      row.addEventListener("click", ()=>{ startSession([item], "Résultat de recherche"); searchQuery=""; });
      box.appendChild(row);
    });
  }
  if(sumHits.length>0){
    box.appendChild(el(`<div class="label mt14" style="font-size:11px;text-transform:uppercase;color:var(--txt-faint);margin-bottom:6px;">📖 Résumé de cours (${sumHits.length})</div>`));
    sumHits.slice(0,5).forEach(h=>{
      const row = el(`<div class="chapter-row" style="cursor:pointer;"><div class="cname">${esc(h.bullet.slice(0,90))}${h.bullet.length>90?'…':''}<br><small style="color:var(--txt-faint);">${esc(h.ch)}</small></div></div>`);
      row.addEventListener("click", ()=>{ view="resume"; openChapterInResume=h.ch; searchQuery=""; render(); });
      box.appendChild(row);
    });
  }
  host.appendChild(box);
}

function sumMasteryPct(){
  const total = Q.length;
  let sum=0;
  Q.forEach(q=> sum += getMastery(q.id)/4);
  return Math.round(100*sum/total);
}

function markAnswered(q, correct, given){
  answersGiven[q.id] = { given, correct, revealed:true };
  bumpMastery(q.id, correct);
}

function renderQCM(body,q,state){
  const shuffledKey = "shuf_"+q.id;
  if(!selectedOptions[shuffledKey]) selectedOptions[shuffledKey] = shuffle(q.options.map((o,i)=>({text:o,idx:i})));
  const opts = selectedOptions[shuffledKey];
  const locked = !!state;
  opts.forEach((o,i)=>{
    const isSelected = state ? state.given===o.text : false;
    const isCorrect = o.text===q.correctAnswer;
    let cls = "opt";
    if(locked){
      cls += " disabled";
      if(isCorrect) cls += " correct";
      else if(isSelected) cls += " incorrect";
    } else if(selectedOptions[q.id]===o.text){ cls += " selected"; }
    const div = el(`<div class="${cls}"><span class="letter">${optionLetter(i)}</span><span>${esc(o.text)}</span></div>`);
    if(!locked){
      div.addEventListener("click", ()=>{
        markAnswered(q, o.text===q.correctAnswer, o.text);
        render();
      });
    }
    body.appendChild(div);
  });
}

function renderQCD(body,q,state){
  const shuffledKey = "shuf_"+q.id;
  if(!selectedOptions[shuffledKey]) selectedOptions[shuffledKey] = shuffle(q.options.map((o,i)=>({text:o,idx:i})));
  const opts = selectedOptions[shuffledKey];
  const locked = !!state;
  if(!selectedOptions[q.id]) selectedOptions[q.id] = new Set();
  const sel = selectedOptions[q.id];

  opts.forEach((o,i)=>{
    const isCorrectOpt = q.correctAnswer.includes(o.text);
    const wasSelected = state ? (state.given||[]).includes(o.text) : sel.has(o.text);
    let cls = "opt";
    if(locked){
      cls += " disabled";
      if(isCorrectOpt) cls += " correct";
      else if(wasSelected) cls += " incorrect";
    } else if(wasSelected){ cls += " selected"; }
    const div = el(`<div class="${cls}"><span class="letter">${optionLetter(i)}</span><span>${esc(o.text)}</span></div>`);
    if(!locked){
      div.addEventListener("click", ()=>{
        if(sel.has(o.text)) sel.delete(o.text); else sel.add(o.text);
        render();
      });
    }
    body.appendChild(div);
  });
  if(!locked){
    body.appendChild(el(`<button class="btn primary full mt14" id="validQCD">✓ Valider ma réponse</button>`));
    body.querySelector("#validQCD").addEventListener("click", ()=>{
      const given = Array.from(sel);
      const correctSet = new Set(q.correctAnswer);
      const givenSet = new Set(given);
      const correct = given.length>0 && correctSet.size===givenSet.size && [...correctSet].every(x=>givenSet.has(x));
      markAnswered(q, correct, given);
      render();
    });
  }
}

function renderLibre(body,q,state){
  const locked = !!state;
  if(locked){
    body.appendChild(el(`<div class="opt disabled" style="cursor:default;"><span>${esc(state.given)}</span></div>`));
    return;
  }
  body.appendChild(el(`<textarea class="free" id="freeAns" placeholder="Écris ta réponse ici..."></textarea>`));
  body.appendChild(el(`<button class="btn primary full mt14" id="validLibre">✓ Corriger ma réponse</button>`));
  body.querySelector("#validLibre").addEventListener("click", ()=>{
    const val = body.querySelector("#freeAns").value.trim();
    const low = val.toLowerCase();
    const hits = (q.keywords||[]).filter(k=> low.includes(k.toLowerCase().split(" ")[0]) || low.includes(k.toLowerCase()));
    const correct = val.length>0 && hits.length >= Math.max(1, Math.ceil((q.keywords||[]).length*0.34));
    markAnswered(q, correct, val || "(réponse vide)");
    render();
  });
}

function renderAssociation(body,q,state){
  const locked = !!state;
  const leftShuffledKey = "assocL_"+q.id, rightShuffledKey="assocR_"+q.id;
  if(!selectedOptions[leftShuffledKey]) selectedOptions[leftShuffledKey] = q.pairs.map(p=>p[0]);
  if(!selectedOptions[rightShuffledKey]) selectedOptions[rightShuffledKey] = shuffle(q.pairs.map(p=>p[1]));
  const lefts = selectedOptions[leftShuffledKey];
  const rights = selectedOptions[rightShuffledKey];
  if(!selectedOptions["assocSel_"+q.id]) selectedOptions["assocSel_"+q.id] = {};
  const sel = selectedOptions["assocSel_"+q.id];

  lefts.forEach((L)=>{
    const row = el(`<div style="margin-bottom:10px;"></div>`);
    row.appendChild(el(`<div style="font-size:13.5px;font-weight:600;margin-bottom:6px;">${esc(L)}</div>`));
    const optRow = el(`<div class="row"></div>`);
    rights.forEach(R=>{
      const correctPair = q.pairs.find(p=>p[0]===L)[1]===R;
      const isSelected = locked ? (state.given||{})[L]===R : sel[L]===R;
      let cls="chip";
      if(locked){
        if(correctPair) cls+=" active";
        else if(isSelected) cls+=" ";
      } else if(isSelected) cls+=" active";
      const chip = el(`<div class="${cls}" style="${locked&&correctPair?'border-color:#4ad991;color:#4ad991;':''}${locked&&isSelected&&!correctPair?'border-color:var(--coral);color:var(--coral);':''}">${esc(R)}</div>`);
      if(!locked){
        chip.addEventListener("click", ()=>{ sel[L]=R; render(); });
      }
      optRow.appendChild(chip);
    });
    row.appendChild(optRow);
    body.appendChild(row);
  });
  if(!locked){

   ["✍️","Ouvertes",()=>startSession(Q.filter(q=>q.type==="ouverte"&&filters.chapters.has(q.chapter)).sort((a,b)=>getMastery(a.id)-getMastery(b.id)).slice(0,10),"Questions ouvertes")],

/* ---------- QUESTIONS OUVERTES ---------- */
function norm(s){ return (s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,""); }
function kwHit(text,k){ const t=norm(text); const parts=norm(k).split(/[\s,\/]+/).filter(p=>p.length>2); return parts.length? parts.every(p=>t.includes(p.slice(0,Math.max(4,p.length-2)))) : t.includes(norm(k)); }
function highlight(answer, kws, userText){
  let html = esc(answer);
  kws.forEach(k=>{ const re = new RegExp("("+k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","i"); html = html.replace(re, `<mark class="${kwHit(userText,k)?'hit':'miss'}">$1</mark>`); });
  return html;
}
function renderOuverte(body,q,state){
  const key="ouv_"+q.id; const st = selectedOptions[key] || (selectedOptions[key]={text:"",revealed:false});
  if(!st.revealed && !state){
    body.appendChild(el(`<p class="hint" style="margin-top:-6px">✍️ Rédige ta réponse comme à l'examen, puis compare-la à la réponse modèle.</p>`));
    const ta = el(`<textarea class="free" placeholder="Ta réponse…"></textarea>`); ta.value=st.text; ta.oninput=e=>st.text=e.target.value; body.appendChild(ta);
    const b = el(`<button class="btn primary full mt14">👀 Voir la réponse modèle</button>`);
    b.onclick=()=>{ st.revealed=true; render(); }; body.appendChild(b);
    return;
  }
  const userText = state ? state.given : st.text;
  const hits = q.keywords.filter(k=>kwHit(userText,k)).length; const pct = Math.round(100*hits/q.keywords.length);
  body.appendChild(el(`<div class="label" style="font-size:12px;color:var(--ink2);font-weight:700;margin-bottom:6px">📝 Ta réponse</div>`));
  body.appendChild(el(`<div class="opt disabled" style="white-space:pre-wrap">${esc(userText||"(aucune réponse rédigée)")}</div>`));
  body.appendChild(el(`<div class="label" style="font-size:12px;color:var(--ink2);font-weight:700;margin:12px 0 6px">✅ Réponse modèle</div>`));
  body.appendChild(el(`<div class="model">${highlight(q.answer,q.keywords,userText)}</div>`));
  body.appendChild(el(`<div class="kwrow">${q.keywords.map(k=>`<span class="kw ${kwHit(userText,k)?'hit':''}">${kwHit(userText,k)?'✓ ':''}${esc(k)}</span>`).join("")}</div>`));
  body.appendChild(el(`<div class="hint">🔑 Mots-clés retrouvés : <b>${hits}/${q.keywords.length}</b> (${pct}%)</div>`));
  if(!state){
    const se = el(`<div><p style="font-size:13.5px;font-weight:600;margin:14px 0 0">Honnêtement, ta réponse était… ?</p><div class="selfeval"><button class="k">❌ À revoir</button><button class="m">🟡 Partielle</button><button class="o">✅ Je savais</button></div></div>`);
    se.querySelector(".k").onclick=()=>{ markAnswered(q,false,userText); render(); };
    se.querySelector(".m").onclick=()=>{ markAnswered(q,false,userText,true); render(); };
    se.querySelector(".o").onclick=()=>{ markAnswered(q,true,userText); render(); };
    body.appendChild(se);
  }
}

/* ---------- correction ---------- */
function explanationAnswerText(q){
  if(q.type==="qcm") return "Réponse : "+q.correctAnswer;
  if(q.type==="qcd") return "Réponses : "+q.correctAnswer.join(" · ");
  if(q.type==="association") return "Bonnes associations : "+q.pairs.map(p=>p[0]+" → "+p[1]).join(" · ");
  if(q.type==="libre") return "Réponse attendue (mots-clés) : "+(q.keywords||[]).join(", ");
  if(q.type==="ouverte") return "Compare ta rédaction avec la réponse modèle ci-dessus.";
  return "";
}
function renderCorrection(q,state){
  const box = el(`<div class="correction"></div>`);
  const head = state.correct?"✅ Bonne réponse":state.partial?"🟡 Réponse partielle":"❌ Voici la correction";
  box.appendChild(el(`<div class="block"><div class="label">${head}</div><div class="content"><b>${esc(explanationAnswerText(q))}</b></div></div>`));
  if(q.type!=="ouverte") box.appendChild(el(`<div class="block"><div class="label">📖 Explication</div><div class="content">${esc(q.explanation)}</div></div>`));
  if(q.simpleExplanation) box.appendChild(el(`<div class="block"><div class="label">🧒 Comme à un enfant de 10 ans</div><div class="content kid">${esc(q.simpleExplanation)}</div></div>`));
  if(q.memoryTip) box.appendChild(el(`<div class="block"><div class="label">💡 Astuce mémoire</div><div class="content tip">${esc(q.memoryTip)}</div></div>`));
  if(q.examTrap) box.appendChild(el(`<div class="block"><div class="label">⚠️ Piège d'examen</div><div class="content trap">${esc(q.examTrap)}</div></div>`));
  box.appendChild(el(`<div class="q-page">📄 Source : COURS PHARMACOLOGIE ${q.source==="2022"?"INFAS 2022":"L2 INFAS 2025"} — page ${q.page}</div>`));
  return box;
}

/* ---------- résultat de session ---------- */
let lastResult = null;
function showSummary(){
  const answered = queue.filter(q=>answersGiven[q.id]);
  const correct = answered.filter(q=>answersGiven[q.id].correct).length;
  const score = answered.length? Math.round(100*correct/answered.length):0;
  progress.history.push({date:new Date().toISOString(), label:sessionLabel, score, total:answered.length});
  lastResult = {score, correct, total:answered.length, wrong:answered.filter(q=>!answersGiven[q.id].correct), label:sessionLabel};
  checkBadges(); saveProgress();
  view="summary"; render();
  if(score>=80 && answered.length>=3) confetti();
}
function renderSummary(){
  const r = lastResult || {score:0,correct:0,total:0,wrong:[],label:""};
  const C = 2*Math.PI*62; const col = r.score>=80?"#2FA84F":r.score>=50?"#F6B81A":"#F0566A";
  const mood = r.score>=80?"happy":r.score>=50?"think":"sad";
  const msg = r.score>=80?"Superbe session ! Tu décolles 🚀":r.score>=50?"Bon travail, encore un effort 💪":"On recommence ensemble, tu vas y arriver 🌱";
  const w = el(`<div><div class="card center">
     <div class="q-page" style="margin-bottom:8px">${esc(r.label)}</div>
     <div class="ring"><svg viewBox="0 0 150 150"><circle cx="75" cy="75" r="62" stroke="#EDEEF6" stroke-width="14" fill="none"/><circle cx="75" cy="75" r="62" stroke="${col}" stroke-width="14" fill="none" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-r.score/100)}"/></svg><div class="val">${r.score}%<small>${r.correct}/${r.total} justes</small></div></div>
     <div class="react" style="justify-content:center">${mascot(mood)}<div class="bubble ${r.score>=80?'ok':r.score>=50?'mid':'ko'}">${msg}</div></div>
     <div class="hint">⚡ Niveau ${level()} · ${progress.xp} XP · 🔥 Série ${streak()} j</div></div></div>`);
  if(r.wrong.length){ const b=el(`<button class="btn primary full mb14">🔁 Revoir mes ${r.wrong.length} erreur(s)</button>`); b.onclick=()=>startSession(r.wrong,"Mes erreurs"); w.appendChild(b); }
  const h=el(`<button class="btn full">🏠 Retour à l'accueil</button>`); h.onclick=()=>{view="home";render();}; w.appendChild(h);
  return w;
}

render();
<%/script>
</body>
</html>
