<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pharmaco INFAS — Mon parcours de révision</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<meta name="theme-color" content="#5B3FF0">
<style>
:root{
  --bg:#EEF0FB; --bg2:#E6E4FB;
  --white:#FFFFFF;
  --violet:#5B3FF0; --violet2:#7C62FF; --violet-deep:#3B23C9; --lav:#ECE8FF; --lav2:#F4F1FF;
  --navy:#141A3D; --navy2:#232B5C;
  --green:#2FA84F; --green-l:#E5F6EA; --green-soft:#C9EBD2;
  --yellow:#F6B81A; --yellow-l:#FFF4D6;
  --sky:#E2F0FD; --blue:#2F7BF6;
  --coral:#F0566A; --coral-l:#FDE8EB;
  --ink:#151A33; --ink2:#5D6382; --ink3:#9AA0BC;
  --line:#E3E5F3;
  /* compat anciens noms */
  --txt:var(--ink); --txt-dim:var(--ink2); --txt-faint:var(--ink3); --panel-brd:var(--line);
  --teal:var(--violet); --amber:var(--yellow); --r0:#F0566A; --r1:#F59A3A; --r2:#F6B81A; --r3:#2FA84F; --r4:#2F7BF6;
  --radius:24px;
  --shadow:0 10px 30px rgba(59,35,201,.10);
  --font:'Poppins','Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font);color:var(--ink);min-height:100vh;
  background:
    radial-gradient(900px 500px at 100% -10%, #DCD5FF 0%, transparent 60%),
    radial-gradient(700px 500px at -20% 30%, #E4ECFF 0%, transparent 60%),
    var(--bg);
  -webkit-font-smoothing:antialiased;
}
button,input,textarea{font-family:inherit;}
.wrap{max-width:560px;margin:0 auto;padding:10px 16px 130px;}

/* ---------- barre du haut ---------- */
.brandline{text-align:center;padding:4px 2px 12px;}
.brandline .app{font-size:12px;color:var(--ink3);margin-bottom:6px;}
.brandline .app b{color:var(--violet);font-weight:700;}
.brandline .author{display:inline-block;background:linear-gradient(135deg,#5B3FF0,#8E6CFF);color:#fff;border-radius:999px;padding:7px 18px;box-shadow:0 6px 16px rgba(91,63,240,.3);font-size:14px;}
.brandline .author strong{font-weight:700;}
.brandline .author span{opacity:.9;}
.topbar{display:flex;align-items:center;gap:12px;background:var(--white);border-radius:22px;padding:10px 12px;box-shadow:var(--shadow);margin-bottom:16px;}
.avatar{width:46px;height:46px;flex:0 0 46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;
  background:linear-gradient(145deg,#FFE3B3,#FFC27A);box-shadow:inset 0 0 0 3px #fff,0 0 0 2px var(--violet2);cursor:pointer;}
.who{flex:1;min-width:0;}
.who .nm{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.who .lv{font-size:12px;color:var(--ink2);margin-top:1px;}
.who .lv i{font-style:normal;color:var(--yellow);}
.bell{position:relative;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.bell svg{width:20px;height:20px;}
.bell .dot{position:absolute;top:8px;right:9px;width:9px;height:9px;border-radius:50%;background:var(--coral);box-shadow:0 0 0 2px #fff;}

/* ---------- cartes ---------- */
.card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:14px;box-shadow:var(--shadow);}
h2.section-title{font-size:15px;font-weight:700;color:var(--ink);margin:0 0 12px;letter-spacing:0;}
.h-row{display:flex;justify-content:space-between;align-items:center;margin:6px 2px 10px;}
.h-row h3{margin:0;font-size:18px;font-weight:700;}
.h-row a{font-size:12.5px;color:var(--violet);font-weight:600;cursor:pointer;}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:28px;padding:22px 20px;margin-bottom:14px;color:#fff;
  background:radial-gradient(400px 220px at 85% 30%,rgba(255,255,255,.18),transparent 60%),linear-gradient(140deg,var(--violet2),var(--violet) 45%,var(--violet-deep));
  box-shadow:0 18px 40px rgba(91,63,240,.35);min-height:190px;}
.hero h2{font-size:24px;line-height:1.18;margin:0 0 8px;font-weight:800;max-width:62%;}
.hero p{font-size:12.5px;opacity:.88;margin:0 0 16px;max-width:60%;line-height:1.5;}
.hero .go{width:50px;height:50px;border-radius:50%;background:var(--navy);border:2px solid rgba(255,255,255,.5);color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.hero .rocket{position:absolute;right:-6px;bottom:-4px;width:46%;max-width:210px;}
.hero .spark{position:absolute;color:#FFD54A;font-size:16px;}

/* stats duo */
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;}
.mini{border-radius:22px;padding:14px;position:relative;}
.mini.lav{background:var(--lav);} .mini.sky{background:var(--sky);}
.mini .ic{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:17px;color:#fff;}
.mini.lav .ic{background:var(--violet);} .mini.sky .ic{background:var(--blue);}
.mini .t{font-size:12px;color:var(--ink2);margin-top:8px;}
.mini .v{font-size:28px;font-weight:800;line-height:1.1;}
.mini .top{display:flex;align-items:center;gap:8px;}
.mini .top .t{margin:0;}

/* progression segmentée */
.segbar{display:flex;height:16px;border-radius:10px;overflow:hidden;background:#EDEEF6;gap:3px;margin:8px 0 10px;}
.segbar span{display:block;height:100%;}
.seglegend{display:flex;justify-content:space-around;font-size:12px;}
.seglegend div{text-align:center;}
.seglegend small{display:block;color:var(--ink3);font-size:10.5px;}
.seglegend i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px;}

/* tuiles */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px;}
.tile{background:#fff;border:1px solid var(--line);border-radius:20px;padding:14px 6px;text-align:center;cursor:pointer;box-shadow:var(--shadow);}
.tile .e{font-size:26px;line-height:1;}
.tile .l{font-size:11.5px;font-weight:600;color:var(--ink2);margin-top:7px;}
.tile:active{transform:scale(.97);}

/* boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:16px;border:1px solid var(--line);
  background:#fff;color:var(--ink);font-size:14px;font-weight:600;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.btn:active{transform:scale(.98);}
.btn.primary{background:var(--violet);border-color:var(--violet);color:#fff;box-shadow:0 8px 20px rgba(91,63,240,.3);}
.btn.navy{background:var(--navy);border-color:var(--navy);color:#fff;}
.btn.green{background:var(--green);border-color:var(--green);color:#fff;}
.btn.ghost{background:transparent;}
.btn.full{width:100%;}
.btn.small{padding:8px 12px;font-size:12.5px;border-radius:12px;}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.btn:focus-visible,.chip:focus-visible,.tile:focus-visible{outline:3px solid var(--violet2);outline-offset:2px;}
.row{display:flex;gap:10px;flex-wrap:wrap;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

/* chips */
.chip{padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:12.5px;cursor:pointer;user-select:none;color:var(--ink2);font-weight:500;white-space:nowrap;}
.chip.active{background:var(--violet);border-color:var(--violet);color:#fff;font-weight:600;}
.chip.compact{padding:6px 10px;font-size:11.5px;}
.chip small{opacity:.75;}
.scroller{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none;}
.scroller::-webkit-scrollbar{display:none;}
.pill{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;font-size:12.5px;font-weight:600;}
.pill.navy{background:var(--navy);color:#fff;} .pill.white{background:#fff;border:1px solid var(--line);}

/* badges */
.badge{display:inline-block;padding:4px 10px;border-radius:999px;font-size:10.5px;font-weight:700;}
.badge.qcm{background:var(--lav);color:var(--violet);}
.badge.qcd{background:var(--sky);color:var(--blue);}
.badge.libre{background:var(--yellow-l);color:#B07D00;}
.badge.association{background:var(--green-l);color:var(--green);}
.badge.ouverte{background:#FFE9F5;color:#C2187A;}
.badge.facile{background:var(--green-l);color:var(--green);}
.badge.moyen{background:var(--yellow-l);color:#B07D00;}
.badge.difficile{background:var(--coral-l);color:var(--coral);}
.badge.chap{background:#F1F2F8;color:var(--ink2);}

/* cartes chapitre (parcours) */
.ccard{position:relative;border-radius:26px;padding:16px 16px 14px;margin-bottom:12px;color:#fff;overflow:hidden;cursor:pointer;}
.ccard.navy{background:linear-gradient(135deg,#1B2350,var(--navy));}
.ccard.green{background:linear-gradient(135deg,#3CB75C,#278C42);}
.ccard.yellow{background:linear-gradient(135deg,#FFC93A,#F2A900);color:#2A1E00;}
.ccard.violet{background:linear-gradient(135deg,var(--violet2),var(--violet-deep));}
.ccard .blob{position:absolute;right:-30px;bottom:-40px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.08);}
.ccard .cat{font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;opacity:.85;}
.ccard .ttl{font-size:17px;font-weight:700;line-height:1.25;margin:4px 104px 12px 0;}
.ccard .emo{position:absolute;right:62px;top:14px;font-size:30px;opacity:.95;}
.ccard .bm{position:absolute;right:14px;top:12px;width:34px;height:34px;border-radius:10px;border:1.5px solid currentColor;display:flex;align-items:center;justify-content:center;font-size:14px;opacity:.9;background:transparent;color:inherit;cursor:pointer;}
.ccard .bm.on{background:#fff;color:var(--violet);border-color:#fff;}
.ccard .foot{display:flex;align-items:center;justify-content:space-between;}
.stack{display:flex;align-items:center;}
.stack span{width:28px;height:28px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;margin-right:-8px;box-shadow:0 0 0 2px rgba(0,0,0,.08);}
.stack b{margin-left:14px;font-size:12px;font-weight:600;}
.ccard .arrow{width:42px;height:42px;border-radius:50%;background:#fff;color:var(--ink);display:flex;align-items:center;justify-content:center;font-size:18px;}
.ccard .cprog{height:5px;border-radius:5px;background:rgba(255,255,255,.25);margin-top:12px;overflow:hidden;}
.ccard.yellow .cprog{background:rgba(0,0,0,.12);}
.ccard .cprog span{display:block;height:100%;background:#fff;border-radius:5px;}
.ccard.yellow .cprog span{background:var(--navy);}
.ccard .done{position:absolute;left:14px;top:-1px;}

/* écran parcours en-tête */
.pheader{display:flex;align-items:center;justify-content:space-between;margin:2px 0 12px;}
.pheader h1{font-size:30px;line-height:1.05;margin:0;font-weight:800;}
.pheader .fig{font-size:58px;line-height:1;filter:drop-shadow(0 8px 10px rgba(91,63,240,.25));}

/* stats */
.toggle{display:inline-flex;background:#F1F2F8;border-radius:999px;padding:4px;}
.toggle span{padding:7px 14px;border-radius:999px;font-size:12px;font-weight:600;color:var(--ink2);cursor:pointer;}
.toggle span.on{background:var(--green);color:#fff;}
.bars{display:flex;align-items:flex-end;justify-content:space-between;height:170px;padding:22px 4px 0;gap:6px;}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;}
.bars .b em{font-style:normal;font-size:11.5px;font-weight:700;margin-bottom:5px;}
.bars .b i{display:block;width:12px;border-radius:8px;background:var(--green-soft);min-height:6px;}
.bars .b.max i{background:var(--green);width:14px;}
.bars .b small{font-size:11px;color:var(--ink3);margin-top:7px;}
.kpi{display:flex;gap:10px;align-items:center;}
.kpi .ic{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;background:var(--green);}
.kpi .v{font-size:22px;font-weight:800;line-height:1;}
.kpi small{display:block;font-size:11px;color:var(--ink3);}
.cta{display:flex;align-items:center;gap:12px;border-radius:22px;padding:14px;margin-bottom:12px;cursor:pointer;}
.cta.y{background:var(--yellow-l);} .cta.b{background:var(--sky);} .cta.v{background:var(--lav);} .cta.g{background:var(--green-l);}
.cta .e{font-size:30px;}
.cta .t{flex:1;} .cta .t b{display:block;font-size:14.5px;} .cta .t small{color:var(--ink2);font-size:12px;}
.cta .go{width:36px;height:36px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;}

/* navigation basse */
.bottomnav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(520px,calc(100% - 28px));
  background:var(--navy);border-radius:26px;display:flex;justify-content:space-around;align-items:stretch;padding:7px 6px;gap:2px;z-index:30;box-shadow:0 14px 34px rgba(20,26,61,.35);}
.bottomnav button{flex:1;min-width:0;border-radius:18px;border:none;background:transparent;color:#AEB3D3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:7px 2px;cursor:pointer;font-family:inherit;}
.bottomnav button .lbl{font-size:10.5px;font-weight:600;line-height:1;white-space:nowrap;}
.bottomnav button svg{width:22px;height:22px;}
.bottomnav button.on{background:var(--violet);color:#fff;box-shadow:0 6px 16px rgba(91,63,240,.5);}
.bottomnav button.on.stats{background:var(--green);box-shadow:0 6px 16px rgba(47,168,79,.5);}
.bottomnav.hide{display:none;}

/* quiz */
.progress-outer{height:8px;border-radius:8px;background:#E3E1F8;overflow:hidden;margin:10px 0 4px;}
.progress-inner{height:100%;background:linear-gradient(90deg,var(--violet2),var(--violet));border-radius:8px;transition:width .3s;}
.qtop{display:flex;justify-content:space-between;align-items:center;gap:10px;}
.rbtn{width:42px;height:42px;border-radius:50%;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;color:var(--ink);}
.rbtn.on{background:var(--violet);color:#fff;border-color:var(--violet);}
.qlabel{flex:1;text-align:center;font-size:12.5px;color:var(--ink2);font-weight:600;}
.q-meta{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
.q-meta .tags{display:flex;gap:6px;flex-wrap:wrap;}
.q-page{font-size:11px;color:var(--ink3);}
.q-text{font-size:17.5px;line-height:1.45;margin:6px 0 16px;font-weight:700;}
.opt{display:flex;align-items:center;gap:12px;padding:13px 14px;margin-bottom:10px;border-radius:18px;border:1.5px solid var(--line);background:#fff;cursor:pointer;font-size:14.5px;}
.opt .letter{width:28px;height:28px;flex:0 0 28px;border-radius:50%;background:var(--lav2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--violet);}
.opt.selected{border-color:var(--violet);background:var(--lav2);}
.opt.selected .letter{background:var(--violet);color:#fff;}
.opt.correct{border-color:var(--green);background:var(--green-l);}
.opt.correct .letter{background:var(--green);color:#fff;}
.opt.incorrect{border-color:var(--coral);background:var(--coral-l);}
.opt.incorrect .letter{background:var(--coral);color:#fff;}
.opt.disabled{cursor:default;}
textarea.free{width:100%;min-height:110px;border-radius:18px;border:1.5px solid var(--line);background:var(--lav2);color:var(--ink);padding:14px;font-size:14.5px;resize:vertical;}
textarea.free:focus{outline:none;border-color:var(--violet);}
.react{display:flex;align-items:flex-end;gap:10px;margin:14px 0 4px;}
.react svg{width:64px;height:76px;flex:0 0 64px;}
.bubble{position:relative;background:var(--lav);border-radius:18px 18px 18px 4px;padding:10px 14px;font-size:13.5px;font-weight:600;}
.bubble.ok{background:var(--green-l);color:#1E6E34;} .bubble.ko{background:var(--coral-l);color:#A3253A;} .bubble.mid{background:var(--yellow-l);color:#7A5600;}
.model{background:var(--lav2);border-radius:18px;padding:14px;font-size:14px;line-height:1.6;border:1px dashed var(--violet2);}
mark.hit{background:var(--green-soft);border-radius:4px;padding:0 2px;}
mark.miss{background:#FFE7A8;border-radius:4px;padding:0 2px;}
.kwrow{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0;}
.kw{font-size:11.5px;padding:4px 9px;border-radius:999px;background:#F1F2F8;color:var(--ink2);}
.kw.hit{background:var(--green-l);color:var(--green);font-weight:600;}
.selfeval{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px;}
.selfeval button{border-radius:16px;padding:12px 6px;border:1.5px solid var(--line);background:#fff;font-weight:600;font-size:12.5px;cursor:pointer;}
.selfeval .k{border-color:var(--coral);color:var(--coral);} .selfeval .m{border-color:var(--yellow);color:#9A6C00;} .selfeval .o{border-color:var(--green);color:var(--green);}

.correction{margin-top:16px;padding-top:14px;border-top:1px dashed var(--line);}
.correction .block{margin-bottom:12px;}
.correction .label{font-size:12px;color:var(--ink2);margin-bottom:5px;font-weight:700;}
.correction .content{font-size:14px;line-height:1.6;}
.correction .content.kid{background:var(--yellow-l);border-radius:16px;padding:11px 13px;}
.correction .content.trap{background:var(--coral-l);border-radius:16px;padding:11px 13px;}
.correction .content.tip{background:var(--lav);border-radius:16px;padding:11px 13px;}
.navrow{display:flex;justify-content:space-between;align-items:center;margin-top:16px;gap:10px;}
.arrow-btn{width:48px;height:48px;border-radius:50%;flex:0 0 48px;padding:0;font-size:18px;}
.qcounter{font-size:12.5px;color:var(--ink2);text-align:center;flex:1;}

/* anciens composants */
.dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;}
.stat{background:var(--lav2);border-radius:18px;padding:12px;text-align:center;}
.stat .num{font-size:22px;font-weight:800;}
.stat .lbl{font-size:11px;color:var(--ink2);margin-top:2px;}
.chapter-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);}
.chapter-row:last-child{border-bottom:none;}
.chapter-row .cname{flex:1;font-size:13.5px;}
.chapter-row .cbar{width:80px;height:7px;border-radius:7px;background:#EDEEF6;overflow:hidden;}
.chapter-row .cbar span{display:block;height:100%;background:linear-gradient(90deg,var(--violet2),var(--violet));}
.chapter-row .cpct{width:38px;text-align:right;font-size:12px;color:var(--ink2);font-weight:600;}
.mastery-dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:5px;flex:0 0 9px;}
.m0{background:var(--r0);} .m1{background:var(--r1);} .m2{background:var(--r2);} .m3{background:var(--r3);} .m4{background:var(--r4);}
.hint{font-size:12px;color:var(--ink3);margin-top:6px;}
.center{text-align:center;} .mb8{margin-bottom:8px;} .mb14{margin-bottom:14px;} .mt14{margin-top:14px;}
input[type=text]{font-family:inherit;}
#globalSearch,#medsFilter,.inp{background:#fff!important;border:1.5px solid var(--line)!important;border-radius:16px!important;color:var(--ink)!important;}

/* profil / badges */
.lvlbar{height:12px;border-radius:12px;background:#EDEEF6;overflow:hidden;margin:8px 0 4px;}
.lvlbar span{display:block;height:100%;background:linear-gradient(90deg,var(--yellow),#FF8A3D);border-radius:12px;}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
.bdg{text-align:center;border-radius:18px;padding:12px 4px;background:var(--lav2);}
.bdg .e{font-size:26px;} .bdg small{display:block;font-size:10.5px;margin-top:5px;color:var(--ink2);line-height:1.2;}
.bdg.off{filter:grayscale(1);opacity:.45;}
.avgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;}
.avgrid span{font-size:26px;text-align:center;padding:8px 0;border-radius:14px;cursor:pointer;background:var(--lav2);}
.avgrid span.on{background:var(--violet);box-shadow:0 6px 14px rgba(91,63,240,.35);}

/* résultat */
.ring{width:150px;height:150px;margin:0 auto;position:relative;}
.ring svg{width:100%;height:100%;transform:rotate(-90deg);}
.ring .val{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:32px;}
.ring .val small{font-size:12px;color:var(--ink3);font-weight:600;}

/* overlays */
.toast{position:fixed;left:50%;top:18px;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:999px;font-weight:700;font-size:14px;z-index:60;animation:toast 1.6s ease forwards;}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-10px)}15%{opacity:1;transform:translate(-50%,0)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-14px)}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:55;overflow:hidden;}
.confetti i{position:absolute;top:-12px;width:9px;height:14px;border-radius:3px;animation:fall 1.3s ease-in forwards;}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.7}}
.overlay{position:fixed;inset:0;background:rgba(20,26,61,.45);backdrop-filter:blur(4px);z-index:70;display:flex;align-items:flex-end;justify-content:center;}
.sheet{background:#fff;width:min(560px,100%);border-radius:28px 28px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom,0px));max-height:85vh;overflow:auto;}
.sheet.centered{border-radius:28px;margin:auto 16px;text-align:center;}
.overlay.center{align-items:center;}
.notif{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer;}
.notif:last-child{border-bottom:none;}
.notif .e{font-size:24px;width:42px;height:42px;border-radius:14px;background:var(--lav2);display:flex;align-items:center;justify-content:center;}
.notif b{font-size:14px;display:block;} .notif small{color:var(--ink2);font-size:12px;}
footer.sig{text-align:center;color:var(--ink3);font-size:11px;line-height:1.7;margin-top:22px;}
footer.sig b{color:var(--violet);}
@media (prefers-reduced-motion:reduce){.toast,.confetti i{animation:none!important;}.confetti{display:none;}}
@media(max-width:380px){.hero h2{font-size:21px}.pheader h1{font-size:26px}.tile .e{font-size:22px}}

// ---------------- ANTI-INFECTIEUX (p.29-49) ----------------
{id:"i001",chapter:"Anti-infectieux",page:30,type:"qcm",difficulty:"facile",
 question:"Quelle action décrit un antibiotique qui inhibe la multiplication des micro-organismes sans les tuer ?",
 options:["Action bactéricide","Action bactériostatique","Action virucide","Action fongicide"],correctAnswer:"Action bactériostatique",
 explanation:"L'action bactériostatique inhibe la multiplication des micro-organismes, tandis que l'action bactéricide les tue.",
 simpleExplanation:"Bactériostatique, c'est mettre les bactéries en pause. Bactéricide, c'est les éliminer complètement.",
 memoryTip:"STATIQUE = ça s'arrête (pause). CIDE = ça meurt (comme homicide).",examTrap:"Un piège classique d'examen : confondre les deux termes qui se ressemblent."},
{id:"i002",chapter:"Anti-infectieux",page:32,type:"qcm",difficulty:"moyen",
 question:"À quoi sert un antibiogramme ?",
 options:["À diagnostiquer une allergie médicamenteuse","À définir les antibiotiques auxquels la souche bactérienne isolée est sensible","À mesurer la fièvre du patient","À remplacer la culture bactérienne"],
 correctAnswer:"À définir les antibiotiques auxquels la souche bactérienne isolée est sensible",
 explanation:"L'antibiogramme permet de définir les ATB vis-à-vis desquels la souche bactérienne isolée est sensible, guidant la prescription et surveillant les résistances.",
 simpleExplanation:"C'est un test qui montre quelles armes (antibiotiques) fonctionnent vraiment contre le microbe précis du patient.",
 memoryTip:"Antibiogramme = carte d'identité de sensibilité du microbe.",examTrap:"Il doit être pratiqué avant le début de l'antibiothérapie, sur des prélèvements préalables."},
{id:"i003",chapter:"Anti-infectieux",page:32,type:"qcm",difficulty:"difficile",
 question:"Comment appelle-t-on la résistance qui existe d'emblée quand le germe n'appartient pas au spectre naturel de l'antibiotique ?",
 options:["Résistance acquise","Résistance naturelle","Résistance croisée","Résistance nosocomiale"],correctAnswer:"Résistance naturelle",
 explanation:"La résistance naturelle existe d'emblée si le germe n'appartient pas au spectre de l'ATB, contrairement à la résistance acquise due à l'emploi abusif d'ATB.",
 simpleExplanation:"Certaines bactéries n'ont jamais été sensibles à un antibiotique donné, dès le départ, comme une serrure qui n'a jamais eu cette clé.",
 memoryTip:"Naturelle = de naissance. Acquise = développée avec le temps (mauvais usage).",examTrap:"La résistance acquise est croisée dans une même famille d'antibiotiques."},
{id:"i004",chapter:"Anti-infectieux",page:33,type:"qcd",difficulty:"moyen",
 question:"Quelles sont les principales cibles d'action des antibiotiques citées dans le cours ?",
 options:["La paroi bactérienne","La membrane cytoplasmique","L'ARN des ribosomes","Le noyau des cellules humaines"],
 correctAnswer:["La paroi bactérienne","La membrane cytoplasmique","L'ARN des ribosomes"],
 explanation:"Les ATB agissent sur la paroi bactérienne (pénicillines), la membrane cytoplasmique (polymyxines), l'ARN des ribosomes (macrolides, tétracyclines) et l'ADN bactérien (quinolones).",
 simpleExplanation:"Les antibiotiques attaquent des points précis de la bactérie, comme un tireur qui vise des cibles différentes selon l'arme utilisée.",
 memoryTip:"4 cibles : Paroi, Membrane, ARN, ADN.",examTrap:"Le noyau des cellules humaines n'est jamais une cible : les ATB ne doivent pas toucher les cellules humaines."},
{id:"i005",chapter:"Anti-infectieux",page:33,type:"qcm",difficulty:"facile",
 question:"Quelle famille de bêta-lactamines regroupe l'Amoxicilline (CLAMOXYL) ?",
 options:["Pénicilline G","Pénicilline M antistaphylococcique","Aminopénicilline (Pénicilline A)","Carboxypénicilline"],correctAnswer:"Aminopénicilline (Pénicilline A)",
 explanation:"L'Amoxicilline (CLAMOXYL) appartient aux aminopénicillines (Pénicilline A), à spectre large.",
 simpleExplanation:"L'amoxicilline, c'est l'antibiotique le plus connu de toute une famille, avec un large spectre d'action.",
 memoryTip:"CLAMOXYL = Amoxicilline = Pénicilline A.",examTrap:"L'association amoxicilline-acide clavulanique élargit encore le spectre par rapport à l'amoxicilline seule."},
{id:"i006",chapter:"Anti-infectieux",page:36,type:"qcm",difficulty:"moyen",
 question:"À quelle génération de céphalosporines appartient la Ceftriaxone (ROCEPHINE) ?",
 options:["1ère génération","2ème génération","3ème génération","4ème génération"],correctAnswer:"3ème génération",
 explanation:"Ceftriaxone (ROCEPHINE) et Céfotaxime (CLAFORAN) appartiennent aux céphalosporines de 3ème génération.",
 simpleExplanation:"Plus le numéro de génération augmente, plus l'antibiotique couvre large et est utilisé pour des infections plus sérieuses.",
 memoryTip:"ROCEPHINE = 3ème génération, injectable, très utilisée à l'hôpital.",examTrap:"La Ceftriaxone est contre-indiquée chez les nourrissons (précipitation de bilirubine, calculs biliaires)."},
{id:"i007",chapter:"Anti-infectieux",page:41,type:"qcm",difficulty:"moyen",
 question:"Quelle classe d'antibiotiques regroupe la Doxycycline (DOXY) ?",
 options:["Tétracyclines (cyclines)","Macrolides","Aminosides","Quinolones"],correctAnswer:"Tétracyclines (cyclines)",
 explanation:"La Doxycycline (DOXY) appartient aux tétracyclines ou cyclines, bactériostatiques.",
 simpleExplanation:"La doxycycline fait partie de la famille des cyclines, souvent utilisée pour l'acné ou le paludisme.",
 memoryTip:"DOXY = cycline.",examTrap:"Les cyclines sont contre-indiquées pendant la grossesse (coloration des dents/squelette du fœtus) et chez le nourrisson."},
{id:"i008",chapter:"Anti-infectieux",page:45,type:"qcd",difficulty:"difficile",
 question:"Quelles familles d'antibiotiques sont contre-indiquées pendant la grossesse selon le cours ?",
 options:["Les cyclines","Les aminosides","Les quinolones","Les pénicillines"],
 correctAnswer:["Les cyclines","Les aminosides","Les quinolones"],
 explanation:"Cyclines (coloration des dents/squelette), aminosides (toxicité auditive/rénale fœtale), tétracyclines et quinolones (cartilage fœtal) sont contre-indiquées pendant la grossesse. Les pénicillines peuvent être utilisées avec précaution.",
 simpleExplanation:"Certains antibiotiques peuvent abîmer les dents, les os ou les articulations du bébé avant même sa naissance.",
 memoryTip:"3 familles à éviter en grossesse : Cyclines, Aminosides, Quinolones (CAQ).",examTrap:"Les pénicillines, céphalosporines et macrolides restent utilisables avec précaution, contrairement aux 3 familles ci-dessus."},
{id:"i009",chapter:"Anti-infectieux",page:45,type:"qcd",difficulty:"difficile",
 question:"Quels antibiotiques sont contre-indiqués chez le nourrisson selon le cours ?",
 options:["Les sulfamides","La ceftriaxone","Les fluoroquinolones","Les pénicillines"],
 correctAnswer:["Les sulfamides","La ceftriaxone","Les fluoroquinolones"],
 explanation:"Sulfamides (compétition avec la bilirubine, jaunisse), ceftriaxone (précipitation de bilirubine, calculs biliaires), fluoroquinolones (cartilage et tendons) et tétracyclines sont contre-indiqués chez le nourrisson.",
 simpleExplanation:"Le corps du nourrisson est très fragile : certains antibiotiques peuvent abîmer ses os, son foie ou provoquer une jaunisse.",
 memoryTip:"Nourrisson fragile : pas de Sulfamides, Ceftriaxone, Fluoroquinolones, Tétracyclines.",examTrap:"Les pénicillines, céphalosporines (sauf ceftriaxone), macrolides, aminosides et glycopeptides restent utilisables avec précaution."},
{id:"i010",chapter:"Anti-infectieux",page:46,type:"qcm",difficulty:"facile",
 question:"Quel est le chef de file des inhibiteurs de la dihydrofolate réductase utilisés en traitement antipaludéen ?",
 options:["Quinine","Chloroquine","Sulfadoxine-Pyriméthamine (FANSIDAR)","Artémisinine"],correctAnswer:"Sulfadoxine-Pyriméthamine (FANSIDAR)",
 explanation:"Les inhibiteurs de la dihydrofolate réductase comprennent Sulfadoxine + Pyriméthamine (FANSIDAR) et Proguanil (PALUDRINE).",
 simpleExplanation:"Ces médicaments bloquent une enzyme dont le parasite du paludisme a besoin pour se reproduire.",
 memoryTip:"FANSIDAR = inhibiteur DHFR.",examTrap:"La Quinine et la Chloroquine sont des antipaludéens à effet intra-érythrocytaire, mécanisme différent."},
{id:"i011",chapter:"Anti-infectieux",page:46,type:"libre",difficulty:"moyen",
 question:"Citez deux combinaisons thérapeutiques (ACT) recommandées actuellement par l'OMS pour traiter le paludisme.",
 keywords:["artéméther luméfantrine","artésunate amodiaquine","dihydroartemisinine pipéraquine","artésunate méfloquine","artésunate sulfadoxine pyriméthamine"],
 explanation:"L'OMS recommande notamment : Artéméther+luméfantrine, Artésunate+amodiaquine, Dihydroartémisinine+Pipéraquine, Artésunate+méfloquine, Artésunate+sulfadoxine-pyriméthamine.",
 simpleExplanation:"Ce sont des équipes de deux médicaments qui travaillent ensemble contre le paludisme, plus efficaces qu'un seul médicament seul.",
 memoryTip:"ACT = Artemisinin-based Combination Therapy.",examTrap:"L'amodiaquine + sulfadoxine-pyriméthamine n'est qu'une option provisoire, pas un premier choix."},
{id:"i012",chapter:"Anti-infectieux",page:47,type:"qcm",difficulty:"moyen",
 question:"L'ivermectine (STROMECTOL-MECTIZAN) est indiquée dans le traitement de :",
 options:["Le paludisme","L'onchocercose, la gale, l'anguillulose","La tuberculose","L'hépatite B"],correctAnswer:"L'onchocercose, la gale, l'anguillulose",
 explanation:"L'Ivermectine (STROMECTOL-MECTIZAN) est un anthelminthique utilisé dans le traitement de l'onchocercose, la gale et l'anguillulose.",
 simpleExplanation:"Ce médicament chasse plusieurs parasites différents, dont ceux responsables de la cécité des rivières.",
 memoryTip:"Ivermectine = Onchocercose + Gale + Anguillulose.",examTrap:"Ne pas confondre avec le Praziquantel (BILTRICIDE), antibilharzien et taenicide."},
{id:"i013",chapter:"Anti-infectieux",page:48,type:"qcm",difficulty:"facile",
 question:"Quel est le médicament de référence pour traiter les dysenteries amibiennes selon le cours ?",
 options:["Le métronidazole (FLAGYL)","L'albendazole (ZENTEL)","La colistine (COLIMYCINE)","La griséofulvine"],correctAnswer:"Le métronidazole (FLAGYL)",
 explanation:"Le métronidazole (FLAGYL, METRONYL) fait partie des anti-amibiens, traitant les dysenteries amibiennes et affections génitales comme la trichomonose.",
 simpleExplanation:"Le Flagyl est un peu le couteau suisse contre les amibes et certaines infections génitales.",
 memoryTip:"FLAGYL = amibes + trichomonose.",examTrap:"Le métronidazole appartient aussi à la classe des nitro-imidazoles, anti-anaérobies."},
{id:"i014",chapter:"Anti-infectieux",page:49,type:"qcm",difficulty:"moyen",
 question:"Quelle est l'action antifongique du Fluconazole (FLUCAZOLE) ?",
 options:["Traitement des candidoses et cryptococcoses neuroméningées","Traitement des infections virales","Traitement du paludisme","Traitement de l'hypertension"],
 correctAnswer:"Traitement des candidoses et cryptococcoses neuroméningées",
 explanation:"Le Fluconazole (FLUCAZOLE, suspension et comprimés) est indiqué dans le traitement des candidoses et des cryptococcoses neuroméningées.",
 simpleExplanation:"C'est un antifongique par voie orale qui combat les champignons, y compris dans le cerveau.",
 memoryTip:"FLUCAZOLE = Champignon + méninges.",examTrap:"Ne pas confondre avec la Terbinafine (LAMISIL), plutôt utilisée pour les dermatophyties cutanées et unguéales."},

// ---------------- RESPIRATOIRE (p.50-53) ----------------
{id:"r001",chapter:"Appareil respiratoire",page:50,type:"qcm",difficulty:"facile",
 question:"Quel type de toux est traité par des expectorants (mucolytiques) ?",
 options:["Toux sèche","Toux productive (grasse)","Toux nerveuse","Toux allergique uniquement"],correctAnswer:"Toux productive (grasse)",
 explanation:"Les toux productives ou grasses (avec expectorations) sont traitées avec des expectorants, visant à produire et expulser le mucus.",
 simpleExplanation:"Quand la toux ramène du mucus, on aide le corps à mieux l'évacuer plutôt que de le bloquer.",
 memoryTip:"Toux grasse = expectorant (aide à cracher). Toux sèche = antitussif (stoppe le réflexe).",examTrap:"Ne jamais donner un antitussif vrai en cas de toux grasse : cela peut provoquer une inondation bronchique."},
{id:"r002",chapter:"Appareil respiratoire",page:50,type:"qcm",difficulty:"moyen",
 question:"À quelle catégorie d'antitussifs appartient la Codéine (NEO CODION) ?",
 options:["Antitussifs opiacés","Antitussifs antihistaminiques","Antitussifs homéopathiques","Antitussifs phytothérapiques"],correctAnswer:"Antitussifs opiacés",
 explanation:"La Codéine (NEO CODION) fait partie des antitussifs opiacés, avec la Noscapine et le Dextrométhorphane.",
 simpleExplanation:"La codéine calme la toux en agissant sur le centre de la toux dans le cerveau, comme un opiacé léger.",
 memoryTip:"Codéine = opiacé antitussif.",examTrap:"Les expectorants n'agissent pas sur le cerveau mais sur la viscosité du mucus lui-même."},
{id:"r003",chapter:"Appareil respiratoire",page:52,type:"qcm",difficulty:"facile",
 question:"Quel est le mode d'action des bêta-2-stimulants comme le Salbutamol (VENTOLINE) ?",
 options:["Bronchodilatation par relâchement de la musculature bronchique","Blocage des récepteurs H1","Inhibition de la pompe à protons","Diminution de la sécrétion acide gastrique"],
 correctAnswer:"Bronchodilatation par relâchement de la musculature bronchique",
 explanation:"Les bêta-2-stimulants agissent par relâchement de la musculature bronchique (bronchodilatation) en agissant sur les récepteurs bêta-2 du système sympathique.",
 simpleExplanation:"La Ventoline ouvre les petits tuyaux des bronches pour laisser mieux passer l'air.",
 memoryTip:"VENTOLINE = ouvre le VENT(o).",examTrap:"Ne pas confondre avec les corticoïdes inhalés qui, eux, réduisent l'inflammation mais n'ouvrent pas rapidement les bronches."},
{id:"r004",chapter:"Appareil respiratoire",page:53,type:"qcm",difficulty:"moyen",
 question:"Quels médicaments sont des médicaments d'entretien de l'asthme, à utiliser régulièrement, et ne doivent pas être utilisés pour soulager une crise ?",
 options:["Les bêta-2-stimulants d'action rapide","Les antagonistes des récepteurs des leucotriènes (montélukast)","L'oxygène","Le MEOPA"],
 correctAnswer:"Les antagonistes des récepteurs des leucotriènes (montélukast)",
 explanation:"Le Montélukast (SINGULAIR) est un médicament d'entretien à utiliser régulièrement ; il n'ouvre pas les voies respiratoires et ne doit pas être employé pour soulager les crises.",
 simpleExplanation:"C'est un traitement de fond, pas un traitement de secours : il prévient, il ne soigne pas la crise en cours.",
 memoryTip:"Montélukast = tous les jours, jamais en urgence.",examTrap:"Le Salbutamol, lui, est un traitement de crise à action rapide."},

// ---------------- ANTIHISTAMINIQUES (p.54-55) ----------------
{id:"h001",chapter:"Antihistaminiques",page:54,type:"qcm",difficulty:"facile",
 question:"Quel médiateur chimique est bloqué par les antihistaminiques anti-H1 ?",
 options:["L'histamine","La sérotonine","L'acétylcholine","La dopamine"],correctAnswer:"L'histamine",
 explanation:"Un antihistaminique sert à réduire ou éliminer les effets de l'histamine, médiateur chimique libéré notamment au cours des réactions allergiques.",
 simpleExplanation:"L'histamine, c'est le signal d'alarme du corps qui déclenche les démangeaisons et éternuements ; les antihistaminiques coupent cette alarme.",
 memoryTip:"Anti-H1 = anti-histamine.",examTrap:"Il existe aussi des antihistaminiques atypiques qui bloquent la transformation de l'histidine en histamine."},
{id:"h002",chapter:"Antihistaminiques",page:55,type:"qcm",difficulty:"moyen",
 question:"Pourquoi préfère-t-on les antihistaminiques de deuxième génération (cétirizine, loratadine) chez le nourrisson ?",
 options:["Ils sont moins chers","Ils traversent moins la barrière hémato-encéphalique, donc moins sédatifs","Ils agissent plus vite","Ils n'ont aucun effet secondaire"],
 correctAnswer:"Ils traversent moins la barrière hémato-encéphalique, donc moins sédatifs",
 explanation:"Les antihistaminiques de 2ème génération ont un effet moins sédatif et traversent moins la barrière hémato-encéphalique, donc moins d'effets secondaires chez le nourrisson.",
 simpleExplanation:"Les anciens antihistaminiques endorment beaucoup le cerveau du bébé ; les nouveaux sont plus doux et évitent cela.",
 memoryTip:"2ème génération = moins de sommeil, plus sûr pour bébé.",examTrap:"Les antihistaminiques de 1ère génération (chlorphéniramine, prométhazine) sont déconseillés chez le nourrisson (somnolence, agitation, convulsions)."},

// ---------------- DIGESTIF (p.56-66) ----------------
{id:"d001",chapter:"Appareil digestif",page:57,type:"qcm",difficulty:"facile",
 question:"Quel est le mécanisme d'action des inhibiteurs de la pompe à protons (IPP) ?",
 options:["Blocage des récepteurs H2 de l'histamine","Inhibition de l'ATPase H+K+ au niveau de la cellule pariétale gastrique","Neutralisation directe de l'acide chlorhydrique","Formation d'un gel protecteur sur l'ulcère"],
 correctAnswer:"Inhibition de l'ATPase H+K+ au niveau de la cellule pariétale gastrique",
 explanation:"Les IPP agissent en inhibant l'activité enzymatique de l'ATPase H+K+ au niveau de la cellule pariétale gastrique, avec une activité antisécrétoire puissante et prolongée (24h en une prise).",
 simpleExplanation:"C'est comme fermer le robinet principal qui fabrique l'acide de l'estomac, à la source.",
 memoryTip:"IPP = ferme la Pompe à Protons.",examTrap:"Ne pas confondre avec les anti-H2 qui bloquent seulement un signal, moins puissant."},
{id:"d002",chapter:"Appareil digestif",page:58,type:"qcm",difficulty:"moyen",
 question:"Quel est le mécanisme d'action du sucralfate (ULCAR) ?",
 options:["Il neutralise directement l'acide gastrique","Il forme un gel qui se fixe sur les protéines des lésions ulcéreuses en milieu acide","Il bloque les récepteurs H2","Il inhibe la pompe à protons"],
 correctAnswer:"Il forme un gel qui se fixe sur les protéines des lésions ulcéreuses en milieu acide",
 explanation:"En milieu acide, le sucralfate forme un gel visqueux chargé négativement qui se fixe sur les protéines des lésions ulcéreuses (chargées positivement), isolant l'ulcère du tube digestif.",
 simpleExplanation:"Le sucralfate colle un pansement chimique directement sur la plaie de l'estomac.",
 memoryTip:"ULCAR = pansement de l'ULCère.",examTrap:"Le sucralfate est un topique antiulcéreux, pas un antisécrétoire."},
{id:"d003",chapter:"Appareil digestif",page:60,type:"libre",difficulty:"moyen",
 question:"Quel est le nouveau schéma thérapeutique de première intention (14 jours) recommandé pour éradiquer Helicobacter pylori ?",
 keywords:["quadrithérapie concomitante 14 jours","IPP amoxicilline clarithromycine métronidazole","quadrithérapie bismuth 10 jours"],
 explanation:"En 1ère intention : quadrithérapie concomitante 14 jours (IPP, amoxicilline, clarithromycine, métronidazole) ou quadrithérapie 10 jours avec bismuth (oméprazole, sel de bismuth, tétracycline, métronidazole). La trithérapie classique de 7 jours ne doit plus être utilisée.",
 simpleExplanation:"On utilise maintenant quatre médicaments ensemble pendant deux semaines pour vraiment chasser cette bactérie tenace de l'estomac.",
 memoryTip:"H. pylori = Quadrithérapie, pas trithérapie.",examTrap:"La trithérapie classique de 7 jours (2 antibiotiques + IPP) ne doit plus être utilisée."},
{id:"d004",chapter:"Appareil digestif",page:61,type:"qcm",difficulty:"facile",
 question:"Quel est le principal symptôme clinique du reflux gastro-œsophagien (RGO) ?",
 options:["Le pyrosis (brûlure rétrosternale)","La constipation","La fièvre","La toux sèche uniquement"],correctAnswer:"Le pyrosis (brûlure rétrosternale)",
 explanation:"Au niveau clinique, le RGO se manifeste par un pyrosis, douleur à type de brûlure rétrosternale, parfois avec régurgitation.",
 simpleExplanation:"C'est cette sensation de brûlure qui remonte derrière le sternum après un repas trop copieux.",
 memoryTip:"Pyrosis = brûlure qui remonte.",examTrap:"Le RGO peut aussi provoquer des manifestations extradigestives : toux chronique, asthme, laryngite."},
{id:"d005",chapter:"Appareil digestif",page:61,type:"qcm",difficulty:"moyen",
 question:"Quels médicaments renforcent le tonus du sphincter inférieur de l'œsophage dans le traitement du RGO ?",
 options:["Les IPP","Les procinétiques comme le métoclopramide (PRIMPERAN)","Les argiles","Les laxatifs"],correctAnswer:"Les procinétiques comme le métoclopramide (PRIMPERAN)",
 explanation:"Les procinétiques (Métoclopramide, Dompéridone, Lévosulpiride, Cisapride) renforcent le tonus du sphincter, accélèrent la vidange gastrique et stimulent la motricité.",
 simpleExplanation:"Ces médicaments referment un peu plus fort la porte entre l'estomac et l'œsophage pour empêcher les remontées.",
 memoryTip:"Procinétique = pousse le contenu vers l'avant + resserre la porte.",examTrap:"La dompéridone ne doit plus être utilisée chez l'enfant de moins de 12 ans."},
{id:"d006",chapter:"Appareil digestif",page:61,type:"qcm",difficulty:"moyen",
 question:"Le RGO est-il fréquent chez la femme enceinte, et pourquoi ?",
 options:["Non, il est rare pendant la grossesse","Oui, par hyperpression intra-abdominale et relâchement hormonal du sphincter","Oui, uniquement à cause du stress","Non, la grossesse protège du RGO"],
 correctAnswer:"Oui, par hyperpression intra-abdominale et relâchement hormonal du sphincter",
 explanation:"Le RGO est fréquent chez la femme enceinte : hyperpression intra-abdominale et relâchement du sphincter œsophagien inférieur d'origine hormonale.",
 simpleExplanation:"Le bébé qui grandit pousse sur l'estomac, et les hormones détendent la porte qui devrait rester fermée.",
 memoryTip:"Grossesse = pression + hormones = RGO fréquent.",examTrap:"Il n'existe pas de risque fœtal démontré lié à l'exposition aux IPP."},
{id:"d007",chapter:"Appareil digestif",page:61,type:"qcm",difficulty:"facile",
 question:"Quelle classe de médicaments correspond aux alginates (GAVISCON) utilisés dans le RGO ?",
 options:["Pansements gastriques","Antisécrétoires","Procinétiques","Antibiotiques"],correctAnswer:"Pansements gastriques",
 explanation:"Pour réduire l'acidité gastrique dans le RGO, on utilise les alginates (pansements gastriques) et les antisécrétoires.",
 simpleExplanation:"L'alginate forme une sorte de radeau protecteur qui flotte sur le contenu de l'estomac.",
 memoryTip:"GAVISCON = pansement flottant.",examTrap:"L'alginate est un pansement mécanique, pas un antisécrétoire chimique."},
{id:"d008",chapter:"Appareil digestif",page:62,type:"qcm",difficulty:"moyen",
 question:"Quelle classe d'antiémétiques est indiquée en première intention pour les nausées-vomissements induits par la chimiothérapie ?",
 options:["Les procinétiques","Les antagonistes des récepteurs 5-HT3 de la sérotonine (Ondansétron)","Les neuroleptiques antiémétiques","Les antihistaminiques H1"],
 correctAnswer:"Les antagonistes des récepteurs 5-HT3 de la sérotonine (Ondansétron)",
 explanation:"Les antagonistes 5-HT3 (Granisétron KYTRIL, Ondansétron ZOPHREN) sont indiqués pour les nausées-vomissements induits par la chimiothérapie et post-opératoires.",
 simpleExplanation:"Ces médicaments bloquent un messager chimique précis (la sérotonine) responsable des nausées de chimiothérapie.",
 memoryTip:"ZOPHREN = anti-chimio nausées.",examTrap:"Les procinétiques (métoclopramide) sont plutôt indiqués dans le RGO et la dyspepsie, pas en 1ère ligne de la chimio."},
{id:"d009",chapter:"Appareil digestif",page:62,type:"libre",difficulty:"difficile",
 question:"Quel traitement de première intention (association) est recommandé pour les nausées et vomissements de la grossesse (NVG) ?",
 keywords:["doxylamine pyridoxine","vitamine B6","NOSIC","ADIONE"],
 explanation:"La pyridoxine (vitamine B6), en monothérapie ou associée à la doxylamine, est recommandée en première intention (Spécialités : NOSIC, ADIONE) en raison de son efficacité et de son innocuité.",
 simpleExplanation:"On commence par une combinaison douce de deux substances peu risquées avant d'essayer des médicaments plus forts.",
 memoryTip:"NVG = Doxylamine + Vitamine B6 en 1er choix.",examTrap:"L'ondansétron n'est utilisé qu'en dernier recours, quand les autres associations ont échoué."},
{id:"d010",chapter:"Appareil digestif",page:64,type:"qcm",difficulty:"facile",
 question:"Quel est le mode d'action du lopéramide (IMODIUM) dans le traitement de la diarrhée ?",
 options:["Diminution de la motilité et des sécrétions intestinales","Inhibition des sécrétions d'eau et d'électrolytes","Action antibactérienne directe","Formation d'un gel protecteur"],
 correctAnswer:"Diminution de la motilité et des sécrétions intestinales",
 explanation:"Le Lopéramide (IMODIUM, ARESTAL) est un ralentisseur du transit intestinal qui diminue la motilité et les sécrétions intestinales.",
 simpleExplanation:"Il ralentit le transit intestinal, comme un frein sur des intestins trop pressés.",
 memoryTip:"IMODIUM = ralentit le transit.",examTrap:"Ne pas confondre avec le racécadotril (TIORFAN), un antisécrétoire intestinal au mécanisme différent."},
{id:"d011",chapter:"Appareil digestif",page:64,type:"qcm",difficulty:"moyen",
 question:"Le racécadotril (TIORFAN) agit selon quel mécanisme ?",
 options:["Diminution de la motilité intestinale","Inhibition des sécrétions d'eau et d'électrolytes intestinaux","Action laxative osmotique","Formation d'un film protecteur gastrique"],
 correctAnswer:"Inhibition des sécrétions d'eau et d'électrolytes intestinaux",
 explanation:"Le Racécadotril (TIORFAN) est un antisécrétoire intestinal dont le mode d'action est l'inhibition des sécrétions d'eau et d'électrolytes.",
 simpleExplanation:"Ce médicament empêche l'intestin de trop 'pleurer' de l'eau et des sels dans les selles.",
 memoryTip:"TIORFAN = ferme les sécrétions d'eau.",examTrap:"Contrairement au lopéramide, il n'agit pas en ralentissant le transit lui-même."},
{id:"d012",chapter:"Appareil digestif",page:65,type:"association",difficulty:"moyen",
 question:"Associez le type de laxatif à son mode d'action.",
 pairs:[["Laxatifs osmotiques","Augmentation de l'hydratation par effet osmotique"],["Laxatifs lubrifiants","Lubrification et ramollissement du contenu colique"],["Laxatifs stimulants","Irritation de la paroi intestinale entraînant une évacuation rapide"]],
 explanation:"Laxatifs osmotiques (Lactulose DUPHALAC), lubrifiants (huile de paraffine), stimulants (Bisacodyl), et de lest (Psylium) agissent chacun par un mécanisme différent.",
 simpleExplanation:"Certains laxatifs attirent l'eau, d'autres graissent le passage, d'autres encore forcent l'intestin à se contracter.",
 memoryTip:"Osmotique = attire l'eau. Lubrifiant = glisse. Stimulant = irrite et pousse.",examTrap:"Les laxatifs stimulants (Bisacodyl) sont les plus agressifs et ne doivent pas être utilisés en continu."},
{id:"d013",chapter:"Appareil digestif",page:57,type:"qcm",difficulty:"moyen",
 question:"Quelle est l'étiologie la plus fréquente citée pour la maladie ulcéreuse (classification actuelle) ?",
 options:["Toxicité médicamenteuse (AINS, aspirine) et Helicobacter pylori","Uniquement le stress","Uniquement une allergie alimentaire","Une carence en vitamine C"],
 correctAnswer:"Toxicité médicamenteuse (AINS, aspirine) et Helicobacter pylori",
 explanation:"La classification actuelle de l'ulcère selon la cause inclut : toxicité médicamenteuse (AINS, aspirine), présence d'Helicobacter pylori, ulcère de stress, et étiologies rares.",
 simpleExplanation:"Un ulcère vient souvent soit d'un médicament irritant pour l'estomac, soit d'une bactérie appelée Helicobacter pylori.",
 memoryTip:"Ulcère = AINS + H. pylori en priorité.",examTrap:"Le syndrome de Zollinger-Ellison est une étiologie rare, pas la plus fréquente."},

// ---------------- SNC / PSYCHOTROPES (p.67-71) ----------------
{id:"s001",chapter:"Médicaments du SNC (Psychotropes)",page:68,type:"qcm",difficulty:"facile",
 question:"Combien de grandes familles de médicaments psychotropes sont décrites dans le cours ?",
 options:["Trois","Quatre","Cinq","Six"],correctAnswer:"Cinq",
 explanation:"Cinq grandes familles : anxiolytiques, antidépresseurs, neuroleptiques, hypnotiques, thymorégulateurs.",
 simpleExplanation:"Cinq grandes équipes de médicaments qui agissent tous sur le cerveau, mais chacune avec un rôle différent.",
 memoryTip:"A-A-N-H-T : Anxiolytiques, Antidépresseurs, Neuroleptiques, Hypnotiques, Thymorégulateurs.",examTrap:"Les antiparkinsoniens et antiépileptiques sont décrits séparément, hors des 5 grandes familles."},
{id:"s002",chapter:"Médicaments du SNC (Psychotropes)",page:69,type:"qcm",difficulty:"facile",
 question:"À quelle classe pharmacologique appartient le diazépam (VALIUM) ?",
 options:["Anxiolytique benzodiazépine","Neuroleptique phénothiazine","Antidépresseur tricyclique","Antiparkinsonien"],correctAnswer:"Anxiolytique benzodiazépine",
 explanation:"Le diazépam (VALIUM) fait partie des anxiolytiques benzodiazépines, avec l'alprazolam, le bromazépam, etc.",
 simpleExplanation:"Le Valium calme l'anxiété en agissant sur le cerveau, c'est une benzodiazépine classique.",
 memoryTip:"VALIUM = anxiolytique benzodiazépine emblématique.",examTrap:"Le diazépam est aussi utilisé comme antiépileptique et myorelaxant central, selon le contexte."},
{id:"s003",chapter:"Médicaments du SNC (Psychotropes)",page:69,type:"qcm",difficulty:"moyen",
 question:"Quel est l'effet principal recherché avec un neuroleptique dans le traitement de la schizophrénie ?",
 options:["Stimuler l'humeur","Diminuer ou faire disparaître les hallucinations et le délire","Induire le sommeil profond immédiat","Augmenter l'appétit"],
 correctAnswer:"Diminuer ou faire disparaître les hallucinations et le délire",
 explanation:"Un neuroleptique entraîne indifférence affective, diminution de l'agressivité, diminution/disparition des hallucinations et du délire, réduction de la psychose.",
 simpleExplanation:"Le neuroleptique calme les pensées confuses et les fausses perceptions qui perturbent le patient.",
 memoryTip:"Neuroleptique = anti-délire, anti-hallucination.",examTrap:"Ils sont aussi utilisés hors AMM pour l'insomnie ou l'anxiété, du fait de leurs propriétés sédatives."},
{id:"s004",chapter:"Médicaments du SNC (Psychotropes)",page:70,type:"qcm",difficulty:"moyen",
 question:"À quelle classe de neuroleptiques appartient l'Halopéridol (HALDOL) ?",
 options:["Phénothiazines","Butyrophénones","Thioxanthènes","Neuroleptiques atypiques"],correctAnswer:"Butyrophénones",
 explanation:"L'Halopéridol appartient à la classe des Butyrophénones, avec le Dropéridol, le Benpéridol.",
 simpleExplanation:"L'Haldol fait partie d'une des quatre grandes familles chimiques de neuroleptiques.",
 memoryTip:"HALDOL = Butyrophénone.",examTrap:"La Chlorpromazine, elle, appartient aux phénothiazines, une famille différente."},
{id:"s005",chapter:"Médicaments du SNC (Psychotropes)",page:71,type:"libre",difficulty:"difficile",
 question:"Pourquoi préfère-t-on l'oxazépam (Séresta) si un anxiolytique est nécessaire pendant l'allaitement ?",
 keywords:["passe le moins dans le lait maternel","surveiller le bébé"],
 explanation:"Si un anxiolytique est nécessaire pendant l'allaitement, il faut choisir celui qui passe le moins dans le lait maternel, comme l'oxazépam (Séresta), et surveiller le bébé.",
 simpleExplanation:"Parmi tous les anxiolytiques, celui-ci passe le moins dans le lait, donc il dérange le moins le bébé.",
 memoryTip:"Séresta = allaitement = moindre passage lacté.",examTrap:"Les anxiolytiques restent à éviter ou limiter en général pendant l'allaitement, même l'oxazépam nécessite une surveillance."},
{id:"s006",chapter:"Médicaments du SNC (Psychotropes)",page:71,type:"qcm",difficulty:"moyen",
 question:"Quel médicament est utilisé dans la maladie de Parkinson en association avec la bensérazide ?",
 options:["La Lévodopa (MODOPAR)","Le Diazépam","La Carbamazépine","L'Acide valproïque"],correctAnswer:"La Lévodopa (MODOPAR)",
 explanation:"Lévodopa + bensérazide (MODOPAR) et Lévodopa + carbidopa (SINEMET) sont utilisés pour diminuer les tremblements et la rigidité de la maladie de Parkinson.",
 simpleExplanation:"La Lévodopa remplace une substance manquante dans le cerveau des patients parkinsoniens.",
 memoryTip:"MODOPAR = Lévodopa + Bensérazide, contre Parkinson.",examTrap:"Les anticholinergiques (Trihexiphénidyle) sont une autre classe utilisée dans le Parkinson, à ne pas confondre."},

// ---------------- HORMONAUX GYNECO (p.72-80) ----------------
{id:"o001",chapter:"Hormonaux gynécologiques",page:75,type:"qcm",difficulty:"moyen",
 question:"Quel est le mécanisme principal des ocytociques comme la méthylergométrine (METHERGIN) ?",
 options:["Bloquer les contractions utérines","Augmenter le tonus des fibres musculaires utérines et les contractions","Réduire la tension artérielle","Stimuler l'ovulation"],
 correctAnswer:"Augmenter le tonus des fibres musculaires utérines et les contractions",
 explanation:"La méthylergométrine (METHERGIN-UTERGIN) est un utérotonique puissant, indiqué dans les hémorragies de la délivrance et du post-partum, l'atonie utérine.",
 simpleExplanation:"Ce médicament fait se contracter l'utérus fort et bien après l'accouchement pour stopper les saignements.",
 memoryTip:"METHERGIN = contraction utérine puissante.",examTrap:"La méthylergométrine passe dans le lait maternel : attention chez la femme allaitante."},
{id:"o002",chapter:"Hormonaux gynécologiques",page:76,type:"qcm",difficulty:"moyen",
 question:"Le Misoprostol réduit de quel pourcentage environ le risque de saignements abondants lors des hémorragies du post-partum, selon le cours ?",
 options:["20%","40%","60%","90%"],correctAnswer:"60%",
 explanation:"L'utilisation du Misoprostol immédiatement après l'accouchement réduit le risque de saignements abondants de 60%.",
 simpleExplanation:"C'est un chiffre à retenir précisément pour l'examen : 60% de réduction du risque hémorragique.",
 memoryTip:"Misoprostol = 60% de risque en moins.",examTrap:"Le Misoprostol est aussi utilisé en association avec la mifépristone pour l'avortement précoce."},
{id:"o003",chapter:"Hormonaux gynécologiques",page:78,type:"qcd",difficulty:"difficile",
 question:"Quels sont les trois mécanismes par lesquels la contraception hormonale agit ?",
 options:["Blocage de l'ovulation","Épaississement de la glaire cervicale","Réduction de l'épaisseur de l'endomètre","Augmentation de la production d'ovules"],
 correctAnswer:["Blocage de l'ovulation","Épaississement de la glaire cervicale","Réduction de l'épaisseur de l'endomètre"],
 explanation:"La contraception hormonale bloque l'ovulation, épaissit la glaire cervicale (empêchant le passage des spermatozoïdes), et réduit l'épaisseur de l'endomètre (empêchant la nidation).",
 simpleExplanation:"La pilule agit sur trois fronts à la fois : elle empêche l'ovule de sortir, elle bloque les spermatozoïdes, et elle rend le nid trop fin pour un bébé.",
 memoryTip:"3 verrous : Ovulation bloquée, Glaire épaissie, Endomètre aminci.",examTrap:"Ne pas confondre avec le stérilet au cuivre, qui agit différemment (effet spermicide local, sans hormone)."},
{id:"o004",chapter:"Hormonaux gynécologiques",page:78,type:"qcm",difficulty:"difficile",
 question:"Pourquoi privilégie-t-on les pilules de 1ère et 2ème génération par rapport à celles de 3ème/4ème génération ?",
 options:["Elles sont moins chères uniquement","Les thromboses veineuses sont moins fréquentes avec elles","Elles sont plus efficaces contre l'ovulation","Elles n'ont aucun effet secondaire"],
 correctAnswer:"Les thromboses veineuses sont moins fréquentes avec elles",
 explanation:"Les thromboses veineuses (phlébite, embolie pulmonaire) sont plus fréquentes avec les pilules de 3ème et 4ème génération. C'est pourquoi les pilules de 1ère et 2ème génération doivent être privilégiées.",
 simpleExplanation:"Les pilules plus anciennes ont un risque de caillots dans le sang un peu plus faible que les plus récentes.",
 memoryTip:"1ère/2ème génération = moins de risque de thrombose veineuse.",examTrap:"Le risque de thrombose artérielle (AVC, infarctus), lui, existe quelle que soit la génération de la pilule."},
{id:"o005",chapter:"Hormonaux gynécologiques",page:80,type:"qcm",difficulty:"moyen",
 question:"Dans quel délai maximal après un rapport non protégé le Lévonorgestrel (NORLEVO) doit-il être pris ?",
 options:["24 heures","48 heures","72 heures","120 heures"],correctAnswer:"72 heures",
 explanation:"Le Lévonorgestrel (NORLEVO, PREGNON) : un comprimé de 1,5 mg, en une seule prise, le plus tôt possible et au plus tard 72 heures (3 jours) après le rapport.",
 simpleExplanation:"Plus on prend la pilule du lendemain rapidement, plus elle est efficace ; la limite est de 3 jours pour le Norlevo.",
 memoryTip:"NORLEVO = 72 heures (3 jours).",examTrap:"L'Ulipristal acétate (ELLAONE), lui, peut être pris jusqu'à 120 heures (5 jours) après le rapport."},
{id:"o006",chapter:"Hormonaux gynécologiques",page:81,type:"qcm",difficulty:"difficile",
 question:"Quelle est l'indication de l'Atosiban, utérorelaxant non bêta-stimulant ?",
 options:["Contraception d'urgence","Menace d'accouchement prématuré entre la 24e et la 33e semaine de grossesse","Déclenchement du travail à terme","Traitement de l'hypertension gravidique"],
 correctAnswer:"Menace d'accouchement prématuré entre la 24e et la 33e semaine de grossesse",
 explanation:"L'Atosiban est indiqué dans la menace d'accouchement prématuré de la 24e à la 33e semaine incluse, en cas de contractions régulières et de modification du col.",
 simpleExplanation:"Ce médicament aide à retarder un accouchement qui arriverait trop tôt.",
 memoryTip:"Atosiban = frein à l'accouchement prématuré.",examTrap:"Ne pas confondre avec les bêta-mimétiques (Salbutamol, Terbutaline) qui sont d'autres utérorelaxants, avec un mécanisme différent."},

// ---------------- CARDIO-VASCULAIRE (p.81-89) ----------------
{id:"c001",chapter:"Appareil cardio-vasculaire",page:83,type:"qcm",difficulty:"facile",
 question:"Quel est le mécanisme d'action des inhibiteurs de l'enzyme de conversion (IEC) ?",
 options:["Blocage des canaux calciques","Blocage de l'activation de l'angiotensine II en inhibant l'enzyme de conversion","Blocage des récepteurs bêta","Augmentation de l'élimination du sodium uniquement"],
 correctAnswer:"Blocage de l'activation de l'angiotensine II en inhibant l'enzyme de conversion",
 explanation:"Les IEC empêchent l'activation de l'angiotensine II (vasoconstricteur puissant) en bloquant l'enzyme de conversion, provoquant une vasodilatation et diminuant la synthèse d'aldostérone.",
 simpleExplanation:"Ils coupent la fabrication d'une substance qui resserre les vaisseaux sanguins, donc les vaisseaux restent plus détendus.",
 memoryTip:"IEC = -PRIL (Captopril, Ramipril, Enalapril...).",examTrap:"Les IEC diminuent l'aldostérone, donc attention au risque d'hyperkaliémie."},
{id:"c002",chapter:"Appareil cardio-vasculaire",page:84,type:"qcm",difficulty:"moyen",
 question:"Quelle est la différence de mécanisme entre les IEC et les antagonistes des récepteurs de l'angiotensine II (sartans) ?",
 options:["Les sartans empêchent l'angiotensine II de se former, les IEC bloquent ses récepteurs","Les sartans empêchent l'angiotensine II d'agir sur ses récepteurs mais ne l'empêchent pas de se former, contrairement aux IEC","Il n'y a aucune différence","Les sartans agissent uniquement sur le cœur"],
 correctAnswer:"Les sartans empêchent l'angiotensine II d'agir sur ses récepteurs mais ne l'empêchent pas de se former, contrairement aux IEC",
 explanation:"Les sartans (ARAII) empêchent l'angiotensine II d'agir sur ses récepteurs sans empêcher sa formation, alors que les IEC bloquent directement sa formation.",
 simpleExplanation:"Les IEC empêchent de fabriquer la substance nocive ; les sartans laissent la substance exister mais bloquent la porte où elle agirait.",
 memoryTip:"Sartans = -SARTAN (Losartan, Valsartan, Irbésartan...).",examTrap:"Ne pas confondre le point d'action : formation (IEC) versus récepteur (sartans)."},
{id:"c003",chapter:"Appareil cardio-vasculaire",page:84,type:"qcm",difficulty:"facile",
 question:"Quelle est la 'règle des 3R' associée aux cardiotoniques (digitaliques) ?",
 options:["Renforce, Régularise, Ralentit le rythme cardiaque","Réduit, Répare, Restaure","Rapide, Réversible, Résistant","Régule la tension, Réduit l'œdème, Renforce les reins"],
 correctAnswer:"Renforce, Régularise, Ralentit le rythme cardiaque",
 explanation:"Les cardiotoniques améliorent la fonction cardiaque selon la règle des 3R (ou règle de Potain) : Renforce le rythme, Régularise le rythme, Ralentit le rythme.",
 simpleExplanation:"La Digoxine agit comme un chef d'orchestre qui rend le cœur plus fort, plus régulier et plus calme.",
 memoryTip:"3R = Renforce, Régularise, Ralentit.",examTrap:"Le principal effet secondaire est l'intoxication digitalique, qui apparaît souvent trop tard."},
{id:"c004",chapter:"Appareil cardio-vasculaire",page:85,type:"qcd",difficulty:"moyen",
 question:"Quelles sont les indications des diurétiques citées dans le cours ?",
 options:["Hypertension artérielle essentielle modérée","Œdèmes","Œdème aigu du poumon","Constipation chronique"],
 correctAnswer:["Hypertension artérielle essentielle modérée","Œdèmes","Œdème aigu du poumon"],
 explanation:"Les diurétiques sont indiqués dans l'HTA essentielle modérée, le traitement des œdèmes, l'OAP (pour éviter la noyade alvéolaire) et l'insuffisance rénale aiguë (correction de l'anurie).",
 simpleExplanation:"Les diurétiques font sortir l'excès d'eau et de sel du corps, ce qui aide contre l'hypertension et les gonflements.",
 memoryTip:"Diurétique = fait uriner davantage = draine l'excès d'eau.",examTrap:"Ils n'ont aucune indication dans la constipation, ce n'est pas leur mécanisme."},
{id:"c005",chapter:"Appareil cardio-vasculaire",page:85,type:"qcm",difficulty:"moyen",
 question:"Le Furosémide (LASILIX) appartient à quelle classe de diurétiques ?",
 options:["Diurétiques de l'anse (hypokaliémiants)","Diurétiques hyperkaliémiants","Diurétiques osmotiques","Inhibiteurs de l'anhydrase carbonique"],correctAnswer:"Diurétiques de l'anse (hypokaliémiants)",
 explanation:"Le Furosémide (LASILIX) est un diurétique de l'anse, hypokaliémiant, comme le Torasémide et le Bumétamide.",
 simpleExplanation:"Le Lasilix est un diurétique puissant qui fait aussi perdre du potassium, il faut donc surveiller ce paramètre.",
 memoryTip:"LASILIX = diurétique de l'anse = hypokaliémiant.",examTrap:"Ne pas confondre avec la Spironolactone (ALDACTONE), diurétique hyperkaliémiant (épargneur de potassium)."},
{id:"c006",chapter:"Appareil cardio-vasculaire",page:87,type:"qcm",difficulty:"facile",
 question:"Quel est le rôle principal des antiagrégants plaquettaires comme l'Aspirine à faible dose ou le Clopidogrel ?",
 options:["Dissoudre un caillot déjà formé","Empêcher l'agrégation des plaquettes et donc la formation de caillots","Réguler le rythme cardiaque","Baisser la tension artérielle"],
 correctAnswer:"Empêcher l'agrégation des plaquettes et donc la formation de caillots",
 explanation:"Les antiagrégants plaquettaires (Aspirine, Clopidogrel CLOPACT, Ticagrelor BRILIQUE...) empêchent les plaquettes de s'agréger entre elles.",
 simpleExplanation:"Ils empêchent les petites plaquettes du sang de se coller entre elles pour former un bouchon dangereux.",
 memoryTip:"Antiagrégant = empêche les plaquettes de s'agréger (se coller).",examTrap:"Ne pas confondre avec les thrombolytiques (Streptokinase, Altéplase), qui eux dissolvent un caillot déjà formé."},

// ---------------- VITAMINES & OLIGO (p.89-99) ----------------
{id:"v001",chapter:"Vitamines & Oligo-éléments",page:92,type:"qcm",difficulty:"facile",
 question:"Quelle vitamine est systématiquement prescrite chez toute femme en âge de procréer ayant un désir de grossesse ?",
 options:["Vitamine B9 (acide folique)","Vitamine C","Vitamine D","Vitamine K"],correctAnswer:"Vitamine B9 (acide folique)",
 explanation:"L'acide folique (vitamine B9) est prescrit de manière systématique chez toute femme en âge de procréer ayant un désir de grossesse ; les folates sont indispensables au développement du système nerveux de l'embryon.",
 simpleExplanation:"Cette vitamine aide à bien construire le système nerveux du futur bébé dès les premières semaines.",
 memoryTip:"B9 = Bébé, avant la grossesse.",examTrap:"Une carence en B9 ou B12 provoque toutes deux des anémies macrocytaires, ne pas les confondre entre elles pour l'examen."},
{id:"v002",chapter:"Vitamines & Oligo-éléments",page:93,type:"qcm",difficulty:"moyen",
 question:"La vitamine K est essentielle à quelle fonction principale ?",
 options:["La vision nocturne","La coagulation du sang","La contraction musculaire","La production d'hormones thyroïdiennes"],correctAnswer:"La coagulation du sang",
 explanation:"La vitamine K est un facteur de la coagulation, permettant la synthèse de la prothrombine par le foie (activation des facteurs II, VII, IX, X).",
 simpleExplanation:"Sans vitamine K, le sang aurait du mal à coaguler correctement en cas de blessure.",
 memoryTip:"Vitamine K = Koagulation.",examTrap:"Le lait maternel est pauvre en vitamine K, un apport est donc systématiquement prescrit au nouveau-né."},
{id:"v003",chapter:"Vitamines & Oligo-éléments",page:89,type:"qcm",difficulty:"moyen",
 question:"Que provoque un apport excessif de vitamines liposolubles comme la vitamine A ou D ?",
 options:["Aucun risque, elles sont éliminées facilement","Une hypervitaminose, très toxique pour l'organisme","Une hypovitaminose","Un simple ralentissement de l'absorption"],
 correctAnswer:"Une hypervitaminose, très toxique pour l'organisme",
 explanation:"Un apport excessif de vitamines liposolubles (A et D essentiellement) provoque une hypervitaminose, très toxique pour l'organisme.",
 simpleExplanation:"Contrairement aux vitamines solubles dans l'eau qu'on élimine facilement, les vitamines A et D s'accumulent dans les graisses du corps et peuvent devenir toxiques en excès.",
 memoryTip:"Liposoluble = stockée = risque de surdosage (A, D, E, K).",examTrap:"Un déficit provoque une hypovitaminose ou avitaminose, l'excès une hypervitaminose : ne pas inverser ces deux notions."},
{id:"v004",chapter:"Vitamines & Oligo-éléments",page:96,type:"qcm",difficulty:"facile",
 question:"Quel oligo-élément est essentiel à la formation des hormones thyroïdiennes ?",
 options:["Le fer","L'iode","Le zinc","Le calcium"],correctAnswer:"L'iode",
 explanation:"L'iode sert à la formation des hormones thyroïdiennes, nécessaires à la croissance, au développement et au métabolisme de base. Il est indispensable à la maturation du système nerveux du fœtus.",
 simpleExplanation:"L'iode est l'ingrédient indispensable que la thyroïde utilise pour fabriquer ses hormones.",
 memoryTip:"Iode = thyroïde.",examTrap:"Ne pas confondre avec le fer, essentiel au transport de l'oxygène par l'hémoglobine, pas à la thyroïde."},
{id:"v005",chapter:"Vitamines & Oligo-éléments",page:99,type:"qcm",difficulty:"moyen",
 question:"Quel oligo-élément est particulièrement associé au système immunitaire et à la cicatrisation ?",
 options:["Le zinc","Le magnésium","Le phosphore","Le potassium"],correctAnswer:"Le zinc",
 explanation:"Le zinc joue un rôle important dans la croissance, le système immunitaire (notamment la cicatrisation), les fonctions neurologiques, la vision, le goût et l'odorat.",
 simpleExplanation:"Le zinc aide le corps à se défendre contre les infections et à réparer les plaies plus vite.",
 memoryTip:"Zinc = immunité + cicatrisation.",examTrap:"Le manganèse, lui, est surtout associé à la lutte contre les radicaux libres, un rôle différent."},

// ---------------- COMPLEMENTS ISSUS DU SUPPORT 2022 ----------------

{id:"i015",chapter:"Anti-infectieux",page:34,source:"2022",type:"qcd",difficulty:"difficile",
 question:"Quelles familles d'antibiotiques sont contre-indiquées en cas de grossesse et d'allaitement selon le tableau récapitulatif du cours ?",
 options:["Aminosides","Cyclines","Fluoroquinolones","Amoxicilline seule"],
 correctAnswer:["Aminosides","Cyclines","Fluoroquinolones"],
 explanation:"Le récapitulatif du cours cite : Aminosides, Cyclines, Fluoroquinolones, Sulfamides, Vancomycine, Teicoplanine, Fosfomycine, Fucidine comme contre-indiqués en grossesse et allaitement.",
 simpleExplanation:"Ce tableau récapitulatif rassemble d'un coup d'œil toutes les familles à éviter chez la femme enceinte ou qui allaite.",
 memoryTip:"Grossesse/allaitement : Amino-Cyclines-Fluoroquinolones-Sulfamides-Vanco-Teico-Fosfo-Fucidine.",
 examTrap:"L'amoxicilline (pénicilline) reste, elle, utilisable avec précaution pendant la grossesse."},
{id:"i016",chapter:"Anti-infectieux",page:34,source:"2022",type:"qcm",difficulty:"moyen",
 question:"Quels sont les deux types d'effets indésirables communs à la plupart des familles d'antibiotiques ?",
 options:["Les réactions allergiques et les troubles digestifs","La toxicité rénale et la surdité","Les convulsions et l'hypertension","La somnolence et la prise de poids"],

 explanation:"Deux types d'effets indésirables sont communs à toutes les familles d'antibiotiques : les réactions allergiques (démangeaisons, urticaire, œdème de Quincke, choc anaphylactique) et les troubles digestifs (nausées, diarrhées, perturbation de la flore intestinale).",

 memoryTip:"2 effets communs : Allergie + Digestif.",
 examTrap:"La survenue d'une réaction allergique impose l'arrêt du traitement, contrairement à de simples troubles digestifs légers."},
{id:"i017",chapter:"Anti-infectieux",page:35,source:"2022",type:"qcm",difficulty:"difficile",
 question:"Quelles classes d'antibiotiques sont particulièrement associées à un risque de photosensibilisation ?",
 options:["Les macrolides et aminosides","Les cyclines et quinolones","Les pénicillines et céphalosporines","Les sulfamides et carbapénèmes"],
 correctAnswer:"Les cyclines et quinolones",
 explanation:"Les cyclines et les quinolones sont susceptibles de provoquer des réactions de photosensibilisation ; il faut éviter l'exposition aux UV pendant le traitement. Les quinolones peuvent aussi causer des tendinites.",

// Chapitre : Antidiabétiques
{id:"ad001",chapter:"Antidiabétiques",page:59,source:"2022",type:"qcm",difficulty:"facile",
 question:"Comment définit-on le diabète sur le plan biologique selon le cours ?",
 options:["Une hypoglycémie chronique","Une hyperglycémie chronique mise en évidence par au moins deux glycémies à jeun > 7 mmol/L","Une glycémie ponctuelle élevée après un repas très sucré","Une carence en glucagon uniquement"],
 correctAnswer:"Une hyperglycémie chronique mise en évidence par au moins deux glycémies à jeun > 7 mmol/L",
 explanation:"Le diabète se définit par une hyperglycémie chronique, mise en évidence par au moins deux glycémies à jeun > 7 mmol/L (>1,26 g/L), résultant d'une carence en insuline.",
 simpleExplanation:"Le sucre reste trop élevé dans le sang de façon durable, même à jeun, et ce n'est pas juste après un bon repas.",
 memoryTip:"Diabète = glycémie à jeun > 1,26 g/L, deux fois de suite.",
 examTrap:"Une seule glycémie élevée ne suffit pas au diagnostic : il en faut deux, à jeun."},
{id:"ad002",chapter:"Antidiabétiques",page:59,source:"2022",type:"qcm",difficulty:"moyen",
 question:"Quel mécanisme est en cause dans le diabète de type 1 ?",
 options:["Résistance périphérique à l'insuline","Destruction des cellules bêta pancréatiques qui n'assurent plus la sécrétion d'insuline","Excès de sécrétion de glucagon","Consommation excessive de sucre uniquement"],
 correctAnswer:"Destruction des cellules bêta pancréatiques qui n'assurent plus la sécrétion d'insuline",
 explanation:"Dans le diabète de type 1, la destruction des cellules bêta pancréatiques empêche la sécrétion d'insuline. Le diabète de type 2, lui, résulte d'une résistance à l'insuline avec hypersécrétion compensatrice insuffisante.",
 simpleExplanation:"Dans le type 1, l'usine à insuline (le pancréas) est cassée. Dans le type 2, l'usine tourne mais le corps n'écoute plus bien le message.",
 memoryTip:"Type 1 = plus d'usine. Type 2 = usine ignorée (résistance).",
 examTrap:"Le diabète de type 1 nécessite une substitution en insuline d'emblée, contrairement au type 2 qui commence par la metformine."},
{id:"ad003",chapter:"Antidiabétiques",page:60,source:"2022",type:"qcm",difficulty:"facile",
 question:"Quelle classe d'antidiabétiques oraux est utilisée en première intention dans le diabète de type 2 ?",
 options:["Les sulfamides hypoglycémiants","Les biguanides (metformine)","Les inhibiteurs de la DPP4","L'insuline injectable"],
 correctAnswer:"Les biguanides (metformine)",
 explanation:"Dans un premier temps (insulinorésistance), ce sont les biguanides (metformine, GLUCOPHAGE) qu'il faut employer dans le diabète de type 2.",
 simpleExplanation:"La metformine est le premier médicament qu'on essaie, avant d'en ajouter d'autres si besoin.",
 memoryTip:"GLUCOPHAGE = 1er choix du diabète de type 2.",
 examTrap:"Ne pas confondre 1ère intention (biguanides) et dernier recours (insuline), qui n'arrive qu'après échec de la bi/trithérapie orale."},
{id:"ad004",chapter:"Antidiabétiques",page:60,source:"2022",type:"qcd",difficulty:"difficile",
 question:"Quelles classes d'antidiabétiques oraux sont des insulino-sécréteurs (stimulent la sécrétion d'insuline) ?",
 options:["Les sulfamides hypoglycémiants","Les glinides","Les biguanides","Les incrétino-mimétiques (analogues GLP-1, inhibiteurs DPP4)"],
 correctAnswer:["Les sulfamides hypoglycémiants","Les glinides","Les incrétino-mimétiques (analogues GLP-1, inhibiteurs DPP4)"],
 explanation:"Les insulino-sécréteurs comprennent les sulfamides hypoglycémiants (Glibenclamide, Gliclazide...), les glinides (Repaglinide) et les incrétino-mimétiques (Exénatide, Sitagliptine...). Les biguanides sont des insulino-sensibilisateurs, pas des sécréteurs.",
 simpleExplanation:"Ces médicaments donnent un petit coup de fouet au pancréas pour qu'il libère plus d'insuline.",
 memoryTip:"Sécréteurs = font sortir plus d'insuline. Sensibilisateurs (biguanides) = rendent le corps plus réceptif à l'insuline déjà là.",
 examTrap:"La Metformine (biguanide) est un insulino-sensibilisateur, elle ne stimule pas la sécrétion d'insuline."},
{id:"ad005",chapter:"Antidiabétiques",page:61,source:"2022",type:"qcm",difficulty:"moyen",
 question:"Quel est le mécanisme des inhibiteurs des alpha-glucosidases comme l'Acarbose ?",
 options:["Ils stimulent le pancréas à sécréter de l'insuline","Ils inhibent l'absorption intestinale des glucides","Ils bloquent la réabsorption rénale du glucose","Ils remplacent directement l'insuline"],
 correctAnswer:"Ils inhibent l'absorption intestinale des glucides",
 explanation:"Les inhibiteurs des alpha-glucosidases (Acarbose, Miglitol) sont des inhibiteurs de l'absorption des glucides au niveau intestinal.",
 simpleExplanation:"Ce médicament ralentit la digestion des sucres dans l'intestin pour que le sucre ne monte pas trop vite dans le sang.",
 memoryTip:"Acarbose = freine l'absorption du sucre dans l'intestin.",
 examTrap:"Ne pas confondre avec les inhibiteurs de la DPP4 (Sitagliptine), qui agissent sur les hormones incrétines, pas sur l'absorption intestinale."},

// Chapitre : Antiseptiques, désinfectants & détergents
{id:"as001",chapter:"Antiseptiques, désinfectants & détergents",page:91,source:"2022",type:"qcm",difficulty:"facile",
 question:"Quelle est la différence essentielle entre un détergent et un antiseptique ?",
 options:["Il n'y a aucune différence","Le détergent enlève les salissures mais ne tue pas les microbes, contrairement à l'antiseptique","Le détergent tue les microbes, pas l'antiseptique","Le détergent s'utilise uniquement sur le matériel inerte"],
 correctAnswer:"Le détergent enlève les salissures mais ne tue pas les microbes, contrairement à l'antiseptique",
 explanation:"Un détergent enlève les salissures et graisses (matériel inerte et tissus vivants) mais ne tue pas les microbes. Un antiseptique, lui, élimine ou empêche le développement des micro-organismes sur les tissus vivants.",
 simpleExplanation:"Le détergent nettoie juste la saleté, comme un savon simple. L'antiseptique, en plus de nettoyer, tue les microbes.",
 memoryTip:"Détergent = nettoie. Antiseptique = nettoie ET désinfecte le vivant.",
 examTrap:"Un détergent peut être utilisé sur du matériel ET des tissus vivants, mais sans jamais tuer les microbes."},
{id:"as002",chapter:"Antiseptiques, désinfectants & détergents",page:92,source:"2022",type:"qcm",difficulty:"moyen",
 question:"Quelle est la différence entre antisepsie et asepsie ?",

 correctAnswer:"L'antisepsie élimine les microbes déjà présents sur un tissu vivant, l'asepsie prévient tout apport de microbes",
 explanation:"L'antisepsie est l'opération permettant d'éliminer les micro-organismes sur les tissus vivants. L'asepsie est une méthode préventive visant à empêcher tout apport exogène de micro-organisme (ex : stérilisation du matériel opératoire).",
 simpleExplanation:"L'antisepsie nettoie ce qui est déjà là. L'asepsie empêche que quelque chose de sale n'arrive du tout, comme fermer la porte avant que la saleté n'entre.",
 memoryTip:"ASepsie = Avant (prévention). ANTIsepsie = Après (élimination).",

function buildFlashcardsFromMeds(){
  const cards = [];
  MEDS.forEach((g,gi)=>{

      cards.push({
        id:"fm_"+gi+"_"+ii, chapter:g.chapter, page:g.page,
        front:"À quelle classe appartient « "+dci+" » ?",
        back:g.classe + (brands && brands!=="—" ? "  (ex. "+brands+")" : "")
      });
    });
  });
  return cards;
}

  const fromMeds = buildFlashcardsFromMeds();

}
